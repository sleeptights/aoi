[package]
name = "aoi-setup"
version = "1.2.2-j"
edition = "2021"
description = "aoi installer"

[dependencies]
flate2 = "=1.1.9"
dirs = "=6.0.0"
winreg = "=0.52.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_Security",
] }

[build-dependencies]
flate2 = "=1.1.9"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
