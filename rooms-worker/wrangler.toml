name = "aoi-rooms"
main = "src/worker.js"
compatibility_date = "2026-04-07"

[durable_objects]
bindings = [
  { name = "ROOM", class_name = "Room" },
  { name = "PRESENCE", class_name = "PresenceHub" },
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["PresenceHub"]
