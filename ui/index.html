<script>
window.addEventListener('error', function (e) {
  var root = document.getElementById('root');
  if (!root) return;
  root.innerHTML = '<div style="color:#ff8a8a;padding:28px 32px;font-size:13px;line-height:1.5;white-space:pre-wrap">' +
    String(e.message || 'error') + '\n' + String(e.filename || '') + ':' + String(e.lineno || '') +
    '</div>';
});
document.addEventListener('contextmenu', function (e) {
  e.preventDefault();
}, true);
/* F5 / Ctrl+R — reload UI without rebuilding (works in `.\dev.ps1`) */
window.addEventListener('keydown', function (e) {
  if (e.key === 'F5' || ((e.ctrlKey || e.metaKey) && !e.shiftKey && String(e.key).toLowerCase() === 'r')) {
    e.preventDefault();
    location.reload();
  }
}, true);
</script>

const _accentCache = new Map();

    const img = new Image();
    img.crossOrigin = 'anonymous';
    let done = false;
    const finish = (val) => { if (done) return; done = true; _accentCache.set(url, val); resolve(val); };

        const canvas = document.createElement('canvas');

          { sat: 28, lumMin: 38, lumMax: 222, minCount: 3 },
          { sat: 14, lumMin: 22, lumMax: 235, minCount: 2 },
          { sat: 6,  lumMin: 12, lumMax: 244, minCount: 1 },

          const buckets = new Map();
          for (let i = 0; i < data.length; i += 4) {

          for (const e of buckets.values()) {
            const score = e.c * (e.s / e.c);

          if (!best || best.c < p.minCount) return null;

            r: Math.round(best.r / best.c),
            g: Math.round(best.g / best.c),
            b: Math.round(best.b / best.c),

        for (const p of passes) {
          color = tryPass(p);

          let sr=0, sg=0, sb=0, n=0;

function scHashColor(id) {
  let h = 0; const s = String(id);
  for (const c of s) h = ((h << 5) - h + c.charCodeAt(0)) | 0;
  return `hsl(${Math.abs(h) % 360},48%,38%)`;
}

function isHttpArtwork(url) {
  return !!url && /^https?:/i.test(String(url));
}

function scFailed(res) {
  const e = res && res.error;
  if (e === 0 || e === '0') return true;
  return e != null && e !== false && e !== '';
}

function pickScTranscodings(t) {
  const list = Array.isArray(t?.media?.transcodings) ? t.media.transcodings : [];
  const key = tc => `${tc?.preset || ''} ${tc?.format?.mime_type || ''}`.toLowerCase();
  const progressive = list.find(tc => tc?.format?.protocol === 'progressive' && tc?.url);
  // SoundCloud removed progressive / HLS MP3+Opus after 2025-12-31 — prefer AAC HLS.
  const hlsAac = list.find(tc => tc?.format?.protocol === 'hls' && tc?.url && /aac|mp4|mpeg-4/.test(key(tc)));
  const hlsAny = list.find(tc => tc?.format?.protocol === 'hls' && tc?.url);
  const hls = hlsAac || hlsAny;
  return {
    streamUrl: progressive?.url || null,
    hlsUrl: hls?.url || null,
    preferHls: !!(hlsAac || (!progressive && hls)),
  };
}

function mapScTrack(t, noTitle) {
  const streams = pickScTranscodings(t);
  return {
    id: t.id,
    title: t.title || noTitle || '—',
    artist: t.publisher_metadata?.artist || t.user?.username || '',
    artistId: t.user?.id || null,
    artistAvatarUrl: t.user?.avatar_url || null,
    uploaderUsername: t.user?.username || null,
    duration: Math.floor((t.duration || 0) / 1000),
    color: scHashColor(t.id),
    coverUrl: t.artwork_url ? t.artwork_url.replace('-large', '-t500x500') : null,
    artworkUrl: t.artwork_url ? t.artwork_url.replace('-large', '-t500x500') : null,
    likesCount: t.likes_count || 0,
    playCount: t.playback_count || 0,
    streamUrl: streams.streamUrl,
    hlsUrl: streams.hlsUrl,
    preferHls: streams.preferHls,
    permalinkUrl: t.permalink_url || null,
  };
}

async function fetchScPlaylistTracks(pl, auth, noTitle) {
  if (!pl?.id || !auth?.token || !window.electronAPI?.scFetch) return [];
  const id = pl.id;
  const base = `https://api-v2.soundcloud.com/playlists/${id}`;
  let rawTracks = [];

  const main = await window.electronAPI.scFetch(base, auth.token, auth.clientId);
  if (!scFailed(main) && main.data) {
    const embedded = main.data.tracks;
    if (Array.isArray(embedded) && embedded.length) rawTracks = embedded.filter(Boolean);
  }

  if (!rawTracks.length) {
    let url = `${base}/tracks?limit=50&linked_partitioning=1`;
    let pages = 0;
    while (url && pages < 8) {
      pages++;
      const res = await window.electronAPI.scFetch(url, auth.token, auth.clientId);
      if (scFailed(res) || !res.data) break;
      const data = res.data;
      const chunk = Array.isArray(data) ? data : (data.collection || []);
      rawTracks.push(...chunk.filter(Boolean));
      url = (!Array.isArray(data) && data.next_href) ? data.next_href : null;
    }
  }

  return rawTracks
    .map(tr => mapScTrack(tr, noTitle))
    .filter(tr => tr && tr.id);
}

function splitArtists(str) {
  if (!str) return [{ name: '', sep: null }];
  const re = /(\s*[&×,.]\s*|\s+(?:ft\.?|feat\.?|with|vs\.?)\s+)/gi;
  const raw = str.split(re);
  const result = [];
  for (let i = 0; i < raw.length; i += 2) {
    const name = raw[i]?.trim();
    const sep  = raw[i + 1] || null;
    if (name) result.push({ name, sep });
  }
  return result.length ? result : [{ name: str, sep: null }];
}

function parseDiscordAppId(raw) {
  const s = String(raw || '').trim();
  if (!s) return '';
  const fromUrl = s.match(/applications\/(\d{16,20})/);
  if (fromUrl) return fromUrl[1];
  const compact = s.replace(/\s/g, '');
  if (/^\d{16,20}$/.test(compact)) return compact;
  const digits = s.match(/\d{16,20}/);
  return digits ? digits[0] : '';
}

function isPublicHttps(url) {
  const u = String(url || '');
  return /^https:\/\//i.test(u) && !/localhost|127\.0\.0\.1/i.test(u);
}

function pickDiscordCover(track, extra) {
  const urls = [extra, track?.artworkUrl, track?.coverUrl];
  const raw = urls.find(isPublicHttps);
  if (!raw) return null;
  return String(raw)
    .replace('-large.', '-t500x500.')
    .replace('-t200x200.', '-t500x500.')
    .replace('-t50x50.', '-t500x500.');
}

function clampNum(n, lo, hi) {
  return Math.max(lo, Math.min(hi, n));
}

function migratePlayerBgSettings(s) {
  if (!s) return s;
  const next = { ...s };
  if (!next.playerBgType) {
    const bg = String(next.playerBg || '').trim();
    if (!bg) next.playerBgType = 'none';
    else if (/^#|^rgb/i.test(bg)) next.playerBgType = 'none';
    else next.playerBgType = 'image';
  }
  if (next.playerBgType === 'color') {
    next.playerBgType = next.playerBgImage ? 'image' : 'none';
  }
  if (next.playerBgScope == null) next.playerBgScope = 'window';
  if (next.playerBgLibAlpha == null) next.playerBgLibAlpha = 35;
  if (next.playerBgLibDim == null) next.playerBgLibDim = 15;
  if (next.navDockAlpha == null) next.navDockAlpha = 100;
  if (next.navDockDim == null) next.navDockDim = 0;
  if (next.navDock === 'bottom') next.navDock = 'top';
  return next;
}

function playerPanelStyle(alpha) {
  const a = clampNum(Number(alpha) ?? 35, 0, 100) / 100;
  return { backgroundColor: `rgba(7, 7, 10, ${a * 0.78})` };
}

function PlayerBgDimOverlay({ dim }) {
  const d = clampNum(Number(dim) || 0, 0, 100);
  if (d <= 0) return null;
  return (
    <div style={{
      position: 'absolute', inset: 0, zIndex: 0, pointerEvents: 'none',
      background: `rgba(0,0,0,${d / 100})`,
    }} />
  );
}

function PlayerBackground({ settings, fullTab }) {
  const type = settings?.playerBgType || 'none';
  const scope = settings?.playerBgScope || 'window';
  const blur = clampNum(Number(settings?.playerBgBlur) || 0, 0, 100);
  const dim = clampNum(Number(settings?.playerBgDim) || 0, 0, 100);
  const blurPx = blur * 0.45;
  const isWindow = scope === 'window';

  if (type !== 'image' || !settings?.playerBgImage) return null;
  if (fullTab ? !isWindow : isWindow) return null;

  const src = window.electronAPI?.fileSrc?.(settings.playerBgImage) || '';
  if (!src) return null;
  return (
    <>
      <div style={{ position: 'absolute', inset: 0, zIndex: 0, overflow: 'hidden', pointerEvents: 'none' }}>
        <div style={{
          position: 'absolute', inset: '-10%',
          backgroundImage: `url("${src}")`,
          backgroundSize: 'cover',
          backgroundPosition: 'center',
          filter: blurPx > 0 ? `blur(${blurPx}px)` : 'none',
          transform: 'scale(1.08)',
        }} />
      </div>
      {dim > 0 && (
        <div style={{
          position: 'absolute', inset: 0, zIndex: 0,
          background: `rgba(0,0,0,${dim / 100})`,
          pointerEvents: 'none',
        }} />
      )}
    </>
  );
}

function PlayerBgPanel({ settings, onPatch, t }) {
  const type = settings.playerBgType || 'none';
  const scope = settings.playerBgScope || 'window';
  const blur = clampNum(Number(settings.playerBgBlur) || 24, 0, 100);
  const dim = clampNum(Number(settings.playerBgDim) || 45, 0, 100);
  const imgSrc = settings.playerBgImage
    ? (window.electronAPI?.fileSrc?.(settings.playerBgImage) || '')
    : '';

  const modeBtn = (id, label) => {
    const active = type === id;
    return (
      <div onClick={() => onPatch({ playerBgType: id })} style={{
        fontSize: 11, padding: '5px 12px', borderRadius: 8, cursor: 'pointer', userSelect: 'none',
        background: active ? 'rgba(255,255,255,0.13)' : 'rgba(255,255,255,0.04)',
        color: active ? 'rgba(255,255,255,0.9)' : 'rgba(255,255,255,0.35)',
        border: active ? '1px solid rgba(255,255,255,0.14)' : '1px solid transparent',
      }}>{label}</div>
    );
  };

  const scopeBtn = (id, label) => {
    const active = scope === id;
    return (
      <div onClick={() => onPatch({ playerBgScope: id })} style={{
        fontSize: 11, padding: '5px 12px', borderRadius: 8, cursor: 'pointer', userSelect: 'none',
        background: active ? 'rgba(255,255,255,0.13)' : 'rgba(255,255,255,0.04)',
        color: active ? 'rgba(255,255,255,0.9)' : 'rgba(255,255,255,0.35)',
        border: active ? '1px solid rgba(255,255,255,0.14)' : '1px solid transparent',
      }}>{label}</div>
    );
  };

  const sliderRow = (label, value, onChange) => (
    <div style={{ marginTop: 10 }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 6 }}>
        <span style={{ fontSize: 12, color: 'rgba(255,255,255,0.5)' }}>{label}</span>
        <span style={{ fontSize: 11, color: 'rgba(255,255,255,0.35)' }}>{value}%</span>
      </div>
      <input type="range" min="0" max="100" value={value}
        onChange={e => onChange(Number(e.target.value))}
        style={{ width: '100%', accentColor: 'rgb(var(--accent-rgb))' }} />
    </div>
  );

  const panelSection = (title, alphaKey, dimKey, defaults) => (
    <div style={{
      marginTop: 12, padding: 12, borderRadius: 12,
      border: '1px solid rgba(255,255,255,0.06)', background: 'rgba(255,255,255,0.02)',
    }}>
      <div style={{ fontSize: 12, fontWeight: 600, color: 'rgba(255,255,255,0.62)', marginBottom: 2 }}>{title}</div>
      {sliderRow(t('player_bg_panel_alpha'), clampNum(Number(settings[alphaKey]) ?? defaults[0], 0, 100), v => onPatch({ [alphaKey]: v }))}
      {sliderRow(t('player_bg_panel_dim'), clampNum(Number(settings[dimKey]) ?? defaults[1], 0, 100), v => onPatch({ [dimKey]: v }))}
    </div>
  );

  return (
    <div style={{ padding: 0 }}>
      <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginBottom: 12 }}>
        {modeBtn('none', t('player_bg_none'))}
        {modeBtn('image', t('player_bg_image'))}
      </div>

      {type === 'image' && (
        <div style={{
          background: 'rgba(255,255,255,0.03)', borderRadius: 12,
          border: '1px solid rgba(255,255,255,0.06)', padding: 12,
        }}>
          {imgSrc ? (
            <div style={{
              height: 100, borderRadius: 10, overflow: 'hidden', marginBottom: 10,
              position: 'relative', background: '#000',
            }}>
              <div style={{
                position: 'absolute', inset: '-8%',
                backgroundImage: `url("${imgSrc}")`,
                backgroundSize: 'cover', backgroundPosition: 'center',
                filter: blur > 0 ? `blur(${blur * 0.45}px)` : 'none',
              }} />
              <div style={{
                position: 'absolute', inset: 0,
                background: `rgba(0,0,0,${dim / 100})`,
              }} />
            </div>
          ) : (
            <div style={{
              height: 80, borderRadius: 10, marginBottom: 10,
              background: 'rgba(255,255,255,0.04)',
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              fontSize: 12, color: 'rgba(255,255,255,0.3)',
            }}>{t('player_bg_image_empty')}</div>
          )}
          <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
            <div onClick={async () => {
              try {
                const path = await window.electronAPI?.selectPlayerBgImage?.();
                if (path) onPatch({ playerBgType: 'image', playerBgImage: path });
              } catch {}
            }} style={{
              fontSize: 12, color: 'rgba(255,255,255,0.7)', cursor: 'pointer',
              background: 'rgba(255,255,255,0.06)', borderRadius: 8, padding: '6px 12px',
            }}>{t('player_bg_pick')}</div>
            {settings.playerBgImage && (
              <div onClick={() => onPatch({ playerBgImage: '', playerBgType: 'none' })} style={{
                fontSize: 12, color: 'rgba(255,80,80,0.75)', cursor: 'pointer',
                background: 'rgba(255,80,80,0.08)', borderRadius: 8, padding: '6px 12px',
              }}>{t('remove')}</div>
            )}
          </div>
          {sliderRow(t('player_bg_blur'), blur, v => onPatch({ playerBgBlur: v }))}
          {sliderRow(t('player_bg_dim'), dim, v => onPatch({ playerBgDim: v }))}
          <div style={{ marginTop: 14 }}>
            <div style={{ fontSize: 11, color: 'rgba(255,255,255,0.4)', marginBottom: 8 }}>{t('player_bg_scope')}</div>
            <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
              {scopeBtn('window', t('player_bg_scope_window'))}
              {scopeBtn('player', t('player_bg_scope_player'))}
            </div>
          </div>
        </div>
      )}

      {panelSection(t('player_bg_panel_lib'), 'playerBgLibAlpha', 'playerBgLibDim', [35, 15])}
    </div>
  );
}

const LangContext = React.createContext('ru');
function useLang() {
  const lang = React.useContext(LangContext);
  return React.useCallback(key => STRINGS[lang]?.[key] ?? STRINGS.ru[key] ?? key, [lang]);
}

function LineIcon({ size = 18, children, stroke = 1.5 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
      strokeWidth={stroke} strokeLinecap="round" strokeLinejoin="round" style={{display:'block'}}>
      {children}
    </svg>
  );
}

function CdIcon({ size = 16 }) {
  return (
    <LineIcon size={size} stroke={1.5}>
      <circle cx="12" cy="12" r="8.15"/>
      <circle cx="12" cy="12" r="2.35"/>
    </LineIcon>
  );
}

function RoomAvatar({ src, size = 32, radius = 9 }) {
  const [failed, setFailed] = useState(false);
  useEffect(() => { setFailed(false); }, [src]);
  if (!src || failed) {
    return (

        </svg>
      </div>
    );
  }
  return (

}

function LockIcon({ locked, size = 13 }) {

}

function emptyRoomSlots() {
  return Array.from({ length: 8 }, (_, i) => ({ i, locked: false, member: null }));
}

function roomMemberKey(m) {
  if (!m) return '';
  if (m.uid) return 'u:' + String(m.uid);
  const name = String(m.name || '').trim().toLowerCase();
  if (name && name !== 'friend') return 'n:' + name;
  if (m.id) return 'i:' + String(m.id);
  return '';
}

function dedupeRoomMembers(list) {
  const out = [];
  const seen = new Set();
  for (const m of list || []) {
    if (!m) continue;
    const key = roomMemberKey(m);
    if (key && seen.has(key)) continue;
    if (key) seen.add(key);
    out.push(m);
  }
  return out;
}

function locksFromSlots(slots) {
  return (slots && slots.length === 8) ? slots.map(s => !!(s && s.locked)) : Array.from({ length: 8 }, () => false);
}

function applyLockOverlay(slots, locks) {
  const base = (slots && slots.length === 8) ? slots : emptyRoomSlots();
  if (!Array.isArray(locks) || locks.length !== 8) return base;
  return base.map((s, i) => ({ ...(s || { i, member: null, locked: false }), i, locked: !!locks[i] }));
}

function slotsFromRoom(room) {
  const members = dedupeRoomMembers(room && room.members || []);
  const prev = applyLockOverlay(
    (room && Array.isArray(room.slots) && room.slots.length === 8) ? room.slots : emptyRoomSlots(),
    room && room.locks
  );
  const slots = prev.map((s, i) => ({
    i,
    locked: (s && typeof s.locked === 'boolean') ? s.locked : false,
    member: null,
  }));
  const placed = new Set();
  for (const m of members) {
    const i = (m.slot != null && m.slot >= 0 && m.slot < 8) ? Number(m.slot) : -1;
    if (i >= 0 && !slots[i].member) {
      slots[i] = { i, locked: slots[i].locked, member: m };
      const key = roomMemberKey(m);
      if (key) placed.add(key);
    }
  }
  for (const m of members) {
    if (m.slot != null) continue;
    const key = roomMemberKey(m);
    if (key && placed.has(key)) continue;
    const i = slots.findIndex(s => !s.member && !s.locked);
    if (i < 0) break;
    slots[i] = { i, locked: slots[i].locked, member: { ...m, slot: i } };
    if (key) placed.add(key);
  }
  return slots;
}

function roomProfileOf(auth) {
  if (!auth) return { name: 'friend', avatar: '', uid: '' };
  const name = String(auth.username || auth.fullName || auth.full_name || auth.permalink || '').trim();
  const avatar = String(auth.avatarUrl || auth.avatar_url || '').trim();
  return {
    name: name || 'friend',
    avatar: /^https:\/\//i.test(avatar) ? avatar : '',
    uid: auth.userId != null ? String(auth.userId) : (auth.id != null ? String(auth.id) : ''),

}

function pushRoomProfile(api, auth) {

}

function scProfileUrl(auth) {

function presencePeerKey(peer) {
  if (!peer) return '';
  if (peer.uid) return 'u:' + peer.uid;
  if (peer.token) return 't:' + peer.token;
  const n = String(peer.name || '').trim().toLowerCase();

function isPresenceBlocked(peer, blocked) {
  const key = presencePeerKey(peer);
  if (!key || !Array.isArray(blocked)) return false;
  return blocked.some(b => b && (b.key === key || (peer.uid && b.uid === peer.uid) || (peer.token && b.token === peer.token)));

function presenceActivityLabel(peer, t) {

}

function proxyMediaUrl(url, useProxy, attempt) {

  try { return window.AoiRooms?.proxyScUrl?.(url, attempt) || url; } catch { return url; }

function resolveFriendUids(friends, peers) {
  const byKey = new Map();
  (peers || []).forEach(p => {
    const k = window.AoiNight?.peerKey?.(p) || '';
    if (k) byKey.set(k, p);
  });
  const uids = new Set();
  (friends || []).forEach(f => {
    if (f?.uid) uids.add(String(f.uid));
    else {
      const live = byKey.get(window.AoiNight?.peerKey?.(f) || '');
      if (live?.uid) uids.add(String(live.uid));
    }
  });
  return [...uids].slice(0, 32);
}

function resolveFriendBeatMeta(friends, peers) {
  const friendUids = resolveFriendUids(friends, peers);
  const names = new Set();
  (friends || []).forEach(f => {
    const n = String(f?.name || '').trim();
    if (n && n.toLowerCase() !== 'friend') names.add(n);
  });
  (peers || []).forEach(p => {
    if (!window.AoiNight?.isFriend?.(friends, p)) return;
    const n = String(p?.name || '').trim();
    if (n && n.toLowerCase() !== 'friend') names.add(n);
  });
  return { friendUids, friendNames: [...names].slice(0, 32) };
}

function resolvePeerUid(peer, peers) {
  if (!peer) return '';
  if (peer.uid) return String(peer.uid);
  const k = window.AoiNight?.peerKey?.(peer);
  if (!k) return '';
  const hit = (peers || []).find(p => window.AoiNight?.peerKey?.(p) === k);
  return hit?.uid ? String(hit.uid) : '';
}

function upsertSharedCrate(list, box) {
  if (!box || !box.friendUid) return Array.isArray(list) ? list : [];
  const rest = (list || []).filter(b => String(b.friendUid) !== String(box.friendUid));
  if (box.gone) return rest;
  return [{ ...box, items: Array.isArray(box.items) ? box.items : [] }, ...rest];
}

function formatAoiUid(n) {
  const v = Number(n);
  if (!Number.isFinite(v) || v <= 0) return '';
  return '#' + String(Math.floor(v)).padStart(4, '0');
}

function sharedPlaylistName(t, name) {
  const who = String(name || '').trim() || 'friend';
  return t('crate_named').replace('{name}', who);
}

function mergeSharedCratesFromBeat(prev, incoming, friendUids) {
  const list = Array.isArray(incoming) ? incoming.filter(b => b && b.friendUid) : [];
  const known = new Set((friendUids || []).map(String).filter(Boolean));
  if (!known.size && !list.length) return Array.isArray(prev) ? prev : [];
  let next = Array.isArray(prev) ? prev.slice() : [];
  if (known.size) {
    next = next.filter(b => !known.has(String(b.friendUid)) || list.some(x => String(x.friendUid) === String(b.friendUid)));
  }
  for (const box of list) next = upsertSharedCrate(next, box);
  return next;
}

function packCrateTrack(tr, auth, profile) {
  if (!tr) return null;
  return {
    id: tr.id,
    title: tr.title || '',
    artist: tr.artist || '',
    coverUrl: tr.coverUrl || tr.artworkUrl || null,
    artworkUrl: tr.artworkUrl || tr.coverUrl || null,
    streamUrl: tr.streamUrl || tr.resolvedUrl || null,
    hlsUrl: tr.hlsUrl || null,
    permalinkUrl: tr.permalinkUrl || null,
    path: tr.path || null,
    byUid: auth?.userId || '',
    byName: profile?.name || '',
  };
}

function parseAoiSemver(v) {
  const raw = String(v || '').trim().replace(/^v/i, '');
  const [base, preRaw] = raw.split('-');
  const pre = preRaw && /^[a-z]/i.test(preRaw) ? preRaw[0].toLowerCase() : null;
  const parts = base.split('.');
  const major = parseInt(parts[0], 10);
  const minor = parseInt(parts[1], 10);
  const patchPart = String(parts[2] || '');
  const patchDigits = patchPart.match(/^\d+/)?.[0] || '';
  const patch = parseInt(patchDigits, 10);
  const letterFromPatch = patchPart.slice(patchDigits.length).match(/^[a-z]/i)?.[0]?.toLowerCase() || null;
  const letter = pre || letterFromPatch;
  if (!Number.isFinite(major) || !Number.isFinite(minor) || !Number.isFinite(patch)) return null;
  return [major, minor, patch, letter];
}

function isAoiVersionNewer(remote, local) {
  const r = parseAoiSemver(remote);
  const l = parseAoiSemver(local);
  if (!r || !l) return false;
  if (r[0] !== l[0]) return r[0] > l[0];
  if (r[1] !== l[1]) return r[1] > l[1];
  if (r[2] !== l[2]) return r[2] > l[2];
  const rl = r[3];
  const ll = l[3];
  if (!rl && !ll) return false;
  if (rl && !ll) return false;
  if (!rl && ll) return true;
  return rl > ll;
}

function applyUpdateNotif(info, localVer, t, seenIds, onChanged) {
  if (!info || !info.version || !info.url) return null;
  if (!isAoiVersionNewer(info.version, localVer)) return null;
  const ver = String(info.version);
  const id = 'upd:' + ver;
  if (seenIds && seenIds.has(id)) return null;
  if (seenIds) seenIds.add(id);
  const lines = Array.isArray(info.changelog) ? info.changelog.filter(Boolean) : [];
  const body = lines.length ? lines.map(l => '· ' + l).join('\n') : (info.notes || '');
  if (typeof onChanged === 'function') onChanged();
  return [{
    id,
    type: 'update',
    title: t('notif_update') + ' · ' + ver,
    body,
    at: Date.now(),
    read: false,
    meta: { version: ver, url: info.url, sha256: info.sha256 || '' },
  }];
}

function applyPresenceInvites(invites, seenSet, t, onChanged) {
  if (!invites || !invites.length) return null;
  const out = [];
  let changed = false;
  for (const inv of invites) {
    if (!inv || !inv.id || seenSet.has(inv.id)) continue;
    seenSet.add(inv.id);
    out.push({
      id: 'inv:' + inv.id,
      type: 'invite',
      title: t('notif_invite'),
      body: t('notif_invite_from')
        .replace('{name}', inv.fromName || 'friend')
        .replace('{code}', inv.roomCode || ''),
      at: inv.at || Date.now(),
      read: false,
      meta: {
        roomCode: inv.roomCode, fromName: inv.fromName, fromAvatar: inv.fromAvatar,
        trackId: inv.trackId || '', trackTitle: inv.trackTitle || '', trackArtist: inv.trackArtist || '',
        seekSec: inv.seekSec || 0,
      },
    });
    changed = true;
  }
  if (!changed) return null;
  if (typeof onChanged === 'function') onChanged();
  return out;
}

function computePresenceStatus({ isPlaying, hasTrack, hidden, idleMs }) {
  if (isPlaying && hasTrack) return 'listening';
  if (hidden || idleMs > 4 * 60 * 1000) return 'afk';
  return 'idle';
}

function buildScShuffle(list, currentId, recentIds) {
  const ids = list.map(t => t.id);
  const byId = new Map(list.map(t => [t.id, t]));
  const rest = currentId != null ? ids.filter(id => id !== currentId) : ids.slice();
  for (let i = rest.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [rest[i], rest[j]] = [rest[j], rest[i]];
  }
  // L04 — avoid three same artists in a row
  for (let pass = 0; pass < 3; pass++) {
    for (let i = 2; i < rest.length; i++) {
      const a0 = window.AoiNight?.artistKey?.(byId.get(rest[i - 2]));
      const a1 = window.AoiNight?.artistKey?.(byId.get(rest[i - 1]));
      const a2 = window.AoiNight?.artistKey?.(byId.get(rest[i]));
      if (a0 && a0 === a1 && a1 === a2) {
        let swap = -1;
        for (let k = i + 1; k < rest.length; k++) {
          const ak = window.AoiNight?.artistKey?.(byId.get(rest[k]));
          if (ak !== a2) { swap = k; break; }
        }
        if (swap > i) {
          const tmp = rest[i]; rest[i] = rest[swap]; rest[swap] = tmp;
        }
      }
    }
  }
  if (recentIds && recentIds.length) {
    const rec = new Set(recentIds.map(id => String(id)));
    rest.sort((a, b) => (rec.has(String(a)) ? 1 : 0) - (rec.has(String(b)) ? 1 : 0));
  }
  return currentId != null ? [currentId, ...rest] : rest;
}

/* ── MarqueeText ─────────────────────────────────────────────────────────── */
function MarqueeText({ text, style, onClick, maxWidth, className }) {
  const outerRef = useRef(null);
  const [clipped, setClipped] = useState(false);
  const [showTip, setShowTip] = useState(false);
  const tipTimerRef = useRef(null);

  useLayoutEffect(() => {
    const el = outerRef.current;
    if (!el) return;
    setClipped(el.scrollWidth > el.clientWidth + 1);
  }, [text, maxWidth]);

  const onEnter = () => {
    if (!clipped) return;
    clearTimeout(tipTimerRef.current);
    tipTimerRef.current = setTimeout(() => setShowTip(true), 1200);
  };
  const onLeave = () => {
    clearTimeout(tipTimerRef.current);
    setShowTip(false);
  };
  useEffect(() => () => clearTimeout(tipTimerRef.current), []);

  return (
    <div style={{
      position:'relative',
      ...(maxWidth != null ? { width:'fit-content', maxWidth } : { flex:1, minWidth:0 }),
    }}>
      <div ref={outerRef} onClick={onClick}
        onMouseEnter={onEnter}
        onMouseLeave={onLeave}
        className={className || undefined}
        style={{
          overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap',
          textAlign:'center',
          cursor: onClick ? 'pointer' : 'default',
          ...style,
        }}>
        {text}
      </div>
      {showTip && (
        <div style={{
          position:'absolute', bottom:'calc(100% + 8px)', left:'50%',
          translate:'-50% 0',
          background:'rgba(18,18,24,0.97)',
          border:'1px solid rgba(255,255,255,0.06)',
          borderRadius:8, padding:'6px 12px',
          fontSize:13, whiteSpace:'nowrap',
          pointerEvents:'none', zIndex:1000,
          color:'rgba(255,255,255,0.78)',
          boxShadow:'0 6px 18px rgba(0,0,0,0.35)',
          animation:'fadeInUp 0.12s ease',
        }}>
          {text}
        </div>
      )}
    </div>
  );
}

/* ── Cover progress ring (moon arc) ──────────────────────────────────────── */
function CoverProgressRing({ progressRef, isPlaying, visible }) {
  const circleRef = useRef(null);
  const r = 48.5;
  const circ = 2 * Math.PI * r;
  useEffect(() => {
    let raf;
    const tick = () => {
      const p = Math.max(0, Math.min(1, progressRef.current || 0));
      const el = circleRef.current;
      if (el) {
        el.setAttribute('stroke-dasharray', String(circ));
        el.setAttribute('stroke-dashoffset', String(circ * (1 - p)));
      }
      if (visible && isPlaying) raf = requestAnimationFrame(tick);
    };
    tick();
    return () => cancelAnimationFrame(raf);
  }, [isPlaying, visible, progressRef, circ]);
  if (!visible || !isPlaying) return null;
  return (
    <svg className="cover-progress-ring" viewBox="0 0 100 100" aria-hidden
      style={{ position:'absolute', inset:-4, width:'calc(100% + 8px)', height:'calc(100% + 8px)', pointerEvents:'none', zIndex:2 }}>
      <circle ref={circleRef} cx="50" cy="50" r={r} fill="none"
        stroke="rgba(var(--accent-rgb),0.5)" strokeWidth="0.55" strokeLinecap="round"
        transform="rotate(-90 50 50)" />
    </svg>
  );
}

/* ── PlayerLikeBtn ───────────────────────────────────────────────────────── */

/* ── Progress Bar ────────────────────────────────────────────────────────── */
function ProgressBar({ progressRef, total, onSeek, isPlaying, visible, accentRGB, rate }) {
  const trackRef         = useRef(null);
  const fillRef          = useRef(null);
  const thumbRef         = useRef(null);
  const rafRef           = useRef(null);
  const progRef          = useRef(progressRef.current);
  const dispProg         = useRef(progressRef.current);
  const dragging         = useRef(false);
  const visibleRef       = useRef(visible);
  const elapsedSpanRef   = useRef(null);
  const remainingSpanRef = useRef(null);
  const totalRef         = useRef(total);
  totalRef.current = total;
  const rateRef          = useRef(1);
  rateRef.current = clampPlaybackRate(rate);
  const isPlayingRef     = useRef(isPlaying);
  isPlayingRef.current = isPlaying;
  const [hover, setHover]   = useState(false);
  const [active, setActive] = useState(false);
  const [tip, setTip] = useState({ x: 0, t: 0, show: false });

  const drawRef = useRef(null);
  const kick = () => {
    if (visibleRef.current && rafRef.current == null && drawRef.current) {
      rafRef.current = requestAnimationFrame(drawRef.current);
    }
  };

  useEffect(() => {
    visibleRef.current = visible;
    if (visible) kick();
    else { cancelAnimationFrame(rafRef.current); rafRef.current = null; }
  }, [visible]);

  useEffect(() => { kick(); }, [isPlaying, rate, total]);

  useEffect(() => {
    const draw = () => {
      progRef.current = progressRef.current;
      const diff = progRef.current - dispProg.current;
      if (!isPlayingRef.current && !dragging.current && Math.abs(diff) < 0.001) {
        dispProg.current = progRef.current;
      } else {
        dispProg.current += diff * 0.12;
      }
      const p = dispProg.current;
      if (fillRef.current)  fillRef.current.style.width = (p * 100).toFixed(3) + '%';
      if (thumbRef.current) thumbRef.current.style.left = (p * 100).toFixed(3) + '%';
      const dur = totalRef.current || 0;
      const wall = dur / (rateRef.current || 1);
      const de = Math.floor(p * wall);
      if (elapsedSpanRef.current)   elapsedSpanRef.current.textContent   = fmt(de);
      if (remainingSpanRef.current) remainingSpanRef.current.textContent = '-' + fmt(Math.max(0, wall - de));
      if (!visibleRef.current) { rafRef.current = null; return; }
      if (!isPlayingRef.current && !dragging.current
          && Math.abs(progRef.current - dispProg.current) < 0.001) {
        rafRef.current = null; return;
      }
      rafRef.current = requestAnimationFrame(draw);
    };
    drawRef.current = draw;
    if (visibleRef.current) rafRef.current = requestAnimationFrame(draw);
    return () => { cancelAnimationFrame(rafRef.current); rafRef.current = null; };
  }, []);

  const getVal = (e) => {
    const rect = trackRef.current.getBoundingClientRect();
    return Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  };
  useEffect(() => {
    const onMove = (e) => { if (dragging.current) onSeek(getVal(e)); };
    const onUp   = () => { if (dragging.current) { dragging.current = false; setActive(false); } };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
    return () => { document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); };
  }, [onSeek]);

  const timeStyle = {
    fontSize: 10.5, fontVariantNumeric: 'tabular-nums',
    color: hover || active ? 'rgba(255,255,255,0.5)' : 'rgba(255,255,255,0.28)',
    letterSpacing: '0.02em',
    userSelect: 'none', flexShrink: 0,
    transition: 'color 0.2s ease',
  };
  const thick = hover || active;
  const TRACK_H = thick ? 14 : 10;
  const THUMB_SZ = active ? 16 : (hover ? 14 : 0);
  return (
    <div style={{width:'100%', display:'flex', alignItems:'center', gap:11}}>
      <span ref={elapsedSpanRef} style={timeStyle}>{fmt(Math.floor(progressRef.current * ((total||0) / clampPlaybackRate(rate))))}</span>
      {/* clickable hit-zone with vertical padding */}
      <div
        onMouseEnter={() => setHover(true)}
        onMouseLeave={() => { setHover(false); setTip(s => ({...s, show:false})); }}
        onMouseMove={e => {
          const rect = trackRef.current?.getBoundingClientRect();
          if (!rect) return;
          const wrapRect = e.currentTarget.getBoundingClientRect();
          const wall = (total || 0) / clampPlaybackRate(rate);
          const p = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
          setTip({ x: e.clientX - wrapRect.left, t: Math.floor(p * wall), show: true });
        }}
        onMouseDown={e => { dragging.current = true; setActive(true); onSeek(getVal(e)); kick(); }}
        style={{
          flex:1, minWidth:0, position:'relative',
          padding: '10px 0', cursor:'pointer',
          display:'flex', alignItems:'center',
        }}
      >
        {/* time tooltip on hover */}
        {tip.show && (
          <div style={{
            position:'absolute',
            left: tip.x, top: -4,
            translate: '-50% -100%',
            background:'rgba(20,20,26,0.96)',
            backdropFilter:'blur(10px)', WebkitBackdropFilter:'blur(10px)',
            border:'1px solid rgba(255,255,255,0.055)',
            padding:'4px 9px', borderRadius:6,
            fontSize:11, fontWeight:600, fontVariantNumeric:'tabular-nums',
            color:'rgba(255,255,255,0.92)',
            pointerEvents:'none', whiteSpace:'nowrap',
            zIndex: 5,
          }}>{fmt(tip.t)}</div>
        )}
        <div style={{ width:'100%', position:'relative' }}>
          {/* track with overflow-hidden so fill scaleX clips cleanly */}
          <div ref={trackRef}
            style={{
              width:'100%', position:'relative',
              height: TRACK_H,
              borderRadius: 999, overflow:'hidden',
              background:'rgba(255,255,255,0.085)',
              boxShadow: thick ? 'inset 0 1px 1px rgba(0,0,0,0.18)' : 'none',
              transition: 'height 0.22s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.2s ease',
            }}
          >
            <div ref={fillRef} style={{
              position:'absolute', left:0, top:0,
              height:'100%',
              width: (progressRef.current * 100).toFixed(3) + '%',
              borderRadius: '0 999px 999px 0',
              background: 'linear-gradient(90deg, rgba(var(--accent-rgb),0.88), rgb(var(--accent-rgb)))',
              boxShadow: 'inset 0 1px 0 rgba(255,255,255,0.14)',
              pointerEvents:'none',
              transition:'background 0.6s ease',
            }}/>
          </div>
          {/* glow layer (outside track so it isn't clipped) */}
          <div style={{
            position:'absolute', left:0, top:'50%', translate:'0 -50%',
            height: TRACK_H, width: `${(progressRef.current * 100).toFixed(3)}%`,
            borderRadius: 999,
            boxShadow: active
              ? '0 0 16px rgba(var(--accent-rgb),0.32), 0 0 5px rgba(var(--accent-rgb),0.22)'
              : hover
                ? '0 0 12px rgba(var(--accent-rgb),0.22), 0 0 4px rgba(var(--accent-rgb),0.14)'
                : '0 0 8px rgba(var(--accent-rgb),0.08)',
            pointerEvents:'none',
            transition: 'box-shadow 0.3s ease, height 0.22s cubic-bezier(0.34,1.56,0.64,1)',
          }}/>
          {/* thumb — outside track so it isn't clipped */}
          <div ref={thumbRef} className={'progress-thumb' + (active ? ' is-seeking' : '')} style={{
            position:'absolute', top:'50%',
            left: (progressRef.current * 100).toFixed(3) + '%',
            translate: '-50% -50%',
            width: THUMB_SZ, height: THUMB_SZ,
            borderRadius: '50%',
            background: '#fff',
            boxShadow: '0 2px 8px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.08)',
            opacity: (hover || active) ? 1 : 0,
            transition: 'width 0.18s cubic-bezier(0.34,1.56,0.64,1), height 0.18s cubic-bezier(0.34,1.56,0.64,1), opacity 0.18s ease',
            pointerEvents:'none',
          }}/>
        </div>
      </div>
      <span ref={remainingSpanRef} style={timeStyle}>-{fmt(Math.max(0, ((total||0) / clampPlaybackRate(rate)) - Math.floor(progressRef.current * ((total||0) / clampPlaybackRate(rate)))))}</span>
    </div>
  );
}

/* ── Thin Volume Slider ───────────────────────────────────────────────────── */
function ThinVolumeSlider({ volume, onChange, onLiveChange, accentKey }) {
  const wrapRef    = useRef(null);
  const canvasRef  = useRef(null);
  const rafRef     = useRef(null);
  const volActual  = useRef(volume); /* follows props when idle, follows cursor during drag */
  const volDisp    = useRef(volume); /* smoothly chases volActual */
  const dragging   = useRef(false);
  const [floorTap, setFloorTap] = useState(false);
  const wasZero = useRef(volume <= 0.001);
  useEffect(() => {
    const z = volume <= 0.001;
    if (z && !wasZero.current) {
      setFloorTap(true);
      const id = setTimeout(() => setFloorTap(false), 90);
      wasZero.current = true;
      return () => clearTimeout(id);
    }
    wasZero.current = z;
  }, [volume]);
  const onChangeCb = useRef(onChange);     /* commit to React state (mouseup only) */
  const onLiveCb   = useRef(onLiveChange); /* live apply during drag (no re-render) */
  const accentRef  = useRef(accentKey || '178,178,178');
  const TW = 28;

  const drawRef = useRef(null);
  const kick = () => {
    if (rafRef.current == null && drawRef.current) {
      rafRef.current = requestAnimationFrame(drawRef.current);
    }
  };

  useEffect(() => { onChangeCb.current = onChange; }, [onChange]);
  useEffect(() => { onLiveCb.current = onLiveChange; }, [onLiveChange]);
  useEffect(() => {
    if (!dragging.current) volActual.current = volume;
    kick();
  }, [volume]);
  useEffect(() => { accentRef.current = accentKey || '178,178,178'; kick();
    const t0 = performance.now();
    let id;
    const loop = (now) => { kick(); if (now - t0 < 680) id = requestAnimationFrame(loop); };
    id = requestAnimationFrame(loop);
    return () => cancelAnimationFrame(id);
  }, [accentKey]);

  const getVal = useCallback((e) => {
    const rect = canvasRef.current.getBoundingClientRect();
    return Math.max(0, Math.min(1, 1 - (e.clientY - rect.top)/rect.height));
  }, []);

  useEffect(() => {
    const canvas = canvasRef.current, wrap = wrapRef.current;
    if (!canvas || !wrap) return;
    const dpr = window.devicePixelRatio || 1;
    const ctx = canvas.getContext('2d');

    const resize = () => {
      canvas.height = wrap.clientHeight * dpr;
      canvas.width  = TW * dpr;
      canvas.style.height = wrap.clientHeight + 'px';
      canvas.style.width  = TW + 'px';
      kick();
    };
    resize();
    const ro = new ResizeObserver(resize);
    ro.observe(wrap);

    const draw = () => {
      const speed = dragging.current ? 0.09 : 0.04;
      const diff = volActual.current - volDisp.current;
      if (!dragging.current && Math.abs(diff) < 0.001) {
        volDisp.current = volActual.current;
      } else {
        volDisp.current += diff * speed;
      }
      const v = volDisp.current;

      const WW = canvas.width, HH = canvas.height;
      ctx.clearRect(0, 0, WW, HH);

      const cx    = WW / 2;
      const barW  = 5 * dpr;
      const r     = barW / 2;
      const pad   = r + 4 * dpr;
      const trackH = HH - pad * 2;
      const trackTop = pad;
      const trackBot = pad + trackH;

      /* bg track */
      ctx.beginPath();
      ctx.roundRect(cx - r, trackTop, barW, trackH, r);
      ctx.fillStyle = 'rgba(255,255,255,0.07)';
      ctx.fill();

      /* fill */
      if (v > 0.01) {
        const fillH   = Math.max(barW, trackH * v);
        const fillTop = trackBot - fillH;
        ctx.save();
        const accentRgb = (getComputedStyle(document.documentElement).getPropertyValue('--accent-rgb') || accentRef.current || '178, 178, 178').trim();
        ctx.shadowColor = `rgba(${accentRgb},0.5)`;
        ctx.shadowBlur  = 8 * dpr;
        ctx.beginPath();
        ctx.roundRect(cx - r, fillTop, barW, fillH, r);
        ctx.fillStyle = `rgb(${accentRgb})`;
        ctx.fill();
        ctx.restore();
      }

      if (!dragging.current && Math.abs(volActual.current - volDisp.current) < 0.001) {
        rafRef.current = null;
        return;
      }
      rafRef.current = requestAnimationFrame(draw);
    };
    drawRef.current = draw;
    rafRef.current = requestAnimationFrame(draw);
    return () => { cancelAnimationFrame(rafRef.current); rafRef.current = null; ro.disconnect(); };
  }, []);

  useEffect(() => {
    const onMove = (e) => {
      if (!dragging.current) return;
      volActual.current = getVal(e);
      onLiveCb.current?.(volActual.current); /* apply to audio without re-rendering App */
    };
    const onUp = () => {
      if (!dragging.current) return;
      dragging.current = false;
      onChangeCb.current(volActual.current); /* commit final value to React state once */
      kick();
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup',   onUp);
    return () => { document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); };
  }, [getVal]);

  return (
    <div ref={wrapRef} className={floorTap ? 'aoi-vol-tap' : undefined} style={{flex:1, minHeight:0, cursor:'ns-resize', display:'flex', alignItems:'stretch'}}
      onMouseDown={e => { dragging.current = true; volActual.current = getVal(e); onLiveCb.current?.(volActual.current); kick(); }}>
      <canvas ref={canvasRef} style={{display:'block'}}/>
    </div>
  );
}

function EqPopover({ gains, eqId, custom, onGains, onPreset, onSave, onDelete, onClose, playbackRate, preservesPitch, onPlaybackRate }) {
  const t = useLang();
  const [name, setName] = useState('');
  const wrapRef = useRef(null);
  useEffect(() => {
    const down = (e) => {
      if (wrapRef.current && wrapRef.current.contains(e.target)) return;
      if (e.target.closest && e.target.closest('[data-eq-btn]')) return;
      onClose?.();
    };
    document.addEventListener('mousedown', down, true);
    return () => document.removeEventListener('mousedown', down, true);
  }, [onClose]);
  const chips = [
    ['flat', t('eq_flat')], ['bass', t('eq_bass')], ['vocal', t('eq_vocal')],
    ['treble', t('eq_treble')], ['electronic', t('eq_electronic')], ['acoustic', t('eq_acoustic')],
  ];
  const pitchPresets = [
    ['normal', t('eq_normal')],
    ['speedup', t('eq_speedup')],
    ['nightcore', t('eq_nightcore')],
    ['hyper', t('eq_hyper')],
    ['daycore', t('eq_daycore')],
    ['chopped', t('eq_chopped')],
  ];
  const g = (gains && gains.length === 6) ? gains : EQ_ZERO;
  const rate = clampPlaybackRate(playbackRate);
  const keepPitch = preservesPitch !== false;
  const rateLabel = (Math.round(rate * 100) / 100).toFixed(2).replace(/\.?0+$/, '') + '×';
  return (
    <div ref={wrapRef} className="aoi-eq-pop" style={{
      position:'absolute', right:36, bottom:8, width:268, zIndex:101,
      background:'rgba(16,16,20,0.97)', border:'1px solid rgba(255,255,255,0.06)',
      borderRadius:12, padding:'10px 10px 8px',
      boxShadow:'0 12px 32px rgba(0,0,0,0.45)',
    }}>
      <div style={{fontSize:10, letterSpacing:'0.08em', textTransform:'uppercase', color:'rgba(255,255,255,0.32)', marginBottom:8}}>{t('eq')}</div>
      <div style={{display:'flex', gap:4, height:96, marginBottom:8, padding:'0 2px'}}>
        {EQ_BANDS.map((freq, i) => (
          <div key={freq} className="aoi-eq-band" style={{flex:1, display:'flex', flexDirection:'column', alignItems:'center', gap:4, animationDelay: (i * 35) + 'ms'}}>
            <input type="range" min="-12" max="12" step="0.5" value={g[i]}
              onChange={e => {
                const next = g.slice();
                next[i] = Number(e.target.value);
                onGains(next);
              }}
              style={{
                writingMode:'vertical-lr', direction:'rtl', height:72, width:14,
                accentColor:'rgb(var(--accent-rgb))', cursor:'ns-resize',
              }}/>
            <span style={{fontSize:8, color:'rgba(255,255,255,0.28)', letterSpacing:'0.02em'}}>{EQ_LABELS[i]}</span>
          </div>
        ))}
      </div>
      <div style={{display:'flex', flexWrap:'wrap', gap:4, marginBottom:8}}>
        {chips.map(([id, label]) => (
          <div key={id} onClick={() => onPreset(id, EQ_PRESETS[id])}
            style={{
              fontSize:10, padding:'3px 7px', borderRadius:7, cursor:'pointer',
              background: eqId === id ? 'rgba(var(--accent-rgb),0.18)' : 'rgba(255,255,255,0.04)',
              color: eqId === id ? 'rgba(255,255,255,0.9)' : 'rgba(255,255,255,0.45)',
            }}>{label}</div>
        ))}
        {(custom || []).map(c => (
          <div key={'u:'+c.name} style={{
            display:'flex', alignItems:'center', gap:3, fontSize:10, padding:'3px 6px', borderRadius:7,
            background: eqId === 'u:'+c.name ? 'rgba(var(--accent-rgb),0.18)' : 'rgba(255,255,255,0.04)',
            color: eqId === 'u:'+c.name ? 'rgba(255,255,255,0.9)' : 'rgba(255,255,255,0.45)',
          }}>
            <span onClick={() => onPreset('u:'+c.name, c.gains)} style={{cursor:'pointer'}}>{c.name}</span>
            <span onClick={() => onDelete(c.name)} style={{cursor:'pointer', opacity:0.45, paddingLeft:2}}>×</span>
          </div>
        ))}
      </div>
      <div style={{fontSize:10, letterSpacing:'0.08em', textTransform:'uppercase', color:'rgba(255,255,255,0.32)', margin:'2px 0 6px'}}>{t('eq_speed')}</div>
      <div style={{display:'flex', alignItems:'center', gap:8, marginBottom:8}}>
        <input type="range" min="0.5" max="2" step="0.05" value={rate}
          onChange={e => onPlaybackRate?.(Number(e.target.value))}
          style={{ flex:1, accentColor:'rgb(var(--accent-rgb))', cursor:'pointer' }}/>
        <span style={{ fontSize:11, color:'rgba(255,255,255,0.7)', minWidth:36, textAlign:'right' }}>{rateLabel}</span>
      </div>
      <div style={{fontSize:10, letterSpacing:'0.08em', textTransform:'uppercase', color:'rgba(255,255,255,0.32)', margin:'2px 0 6px'}}>{t('eq_pitch')}</div>
      <div style={{display:'flex', flexWrap:'wrap', gap:4, marginBottom:8}}>
        {pitchPresets.map(([id, label]) => {
          const preset = RATE_PITCH_PRESETS[id];
          const active = preset && Math.abs(rate - preset.rate) < 0.03 && keepPitch === preset.preserve;
          return (
            <div key={id} onClick={() => onPlaybackRate?.(preset.rate, preset.preserve)}
              style={{
                fontSize:10, padding:'3px 7px', borderRadius:7, cursor:'pointer',
                background: active ? 'rgba(var(--accent-rgb),0.18)' : 'rgba(255,255,255,0.04)',
                color: active ? 'rgba(255,255,255,0.9)' : 'rgba(255,255,255,0.45)',
              }}>{label}</div>
          );
        })}
      </div>
      <div style={{display:'flex', gap:6, alignItems:'center'}}>
        <input value={name} onChange={e => setName(e.target.value.slice(0, 18))}
          placeholder={t('eq_save_ph')}
          style={{
            flex:1, minWidth:0, height:26, border:'none', borderRadius:7, padding:'0 8px',
            background:'rgba(255,255,255,0.05)', color:'rgba(255,255,255,0.8)',
            fontSize:11, fontFamily:'inherit', outline:'none',
          }}/>
        <div onClick={() => {
          const n = name.trim();
          if (!n) return;
          onSave(n, g);
          setName('');
        }} style={{
          fontSize:10, padding:'5px 8px', borderRadius:7, cursor:'pointer', flexShrink:0,
          background:'rgba(255,255,255,0.06)', color:'rgba(255,255,255,0.7)',
        }}>{t('eq_save')}</div>
      </div>
    </div>
  );
}

/* ── Album Art ───────────────────────────────────────────────────────────── */
function AlbumArt({ track, isPlaying, sleepy, someoneElse, iris }) {
  const imgRef = useRef(null);
  const retryRef = useRef(0);
  const url = track.coverUrl || null;
  const t = useLang();

  // when window returns to foreground, if img happens to be hidden (eviction),
  // force a reload from the same src to bring it back
  useEffect(() => {
    if (!url) return;
    const onVis = () => {
      if (document.visibilityState !== 'visible') return;
      const el = imgRef.current;
      if (!el) return;
      if (el.style.opacity === '0' || !el.complete || el.naturalWidth === 0) {
        const sep = url.includes('?') ? '&' : '?';
        el.src = url + sep + '_r=' + Date.now();
        el.style.opacity = '1';
      }
    };
    document.addEventListener('visibilitychange', onVis);
    window.addEventListener('focus', onVis);
    return () => {
      document.removeEventListener('visibilitychange', onVis);
      window.removeEventListener('focus', onVis);
    };
  }, [url]);

  return (
    <div className={'album-art-frame' + (sleepy ? ' sleepy' : '') + (isPlaying ? ' is-playing' : ' is-paused') + (iris ? ' iris-in' : '')} style={{
      position:'relative', width:'100%', aspectRatio:'1', borderRadius:16, overflow:'hidden',
      background:'#111116',
      display:'flex', alignItems:'center', justifyContent:'center',
    }}>
      {/* placeholder underneath — always rendered */}
      <img src="./assets/note.png" style={{width:32,height:32,filter:'brightness(0) invert(1)',opacity:0.13}}/>
      {/* cover on top, fades out on error */}
      {url && (
        <img ref={imgRef} src={url} decoding="async"
          style={{position:'absolute',inset:0,width:'100%',height:'100%',objectFit:'cover',transition:'opacity 0.26s ease'}}
          onLoad={e => { e.currentTarget.style.opacity = '1'; retryRef.current = 0; }}
          onError={e => {
            e.currentTarget.style.opacity = '0';
            if (retryRef.current < 2) {
              retryRef.current++;
              const el = e.currentTarget;
              setTimeout(() => {
                if (!el.isConnected) return;
                const sep = url.includes('?') ? '&' : '?';
                el.src = url + sep + '_r=' + Date.now();
              }, 500 * retryRef.current);
            }
          }}/>
      )}
      {someoneElse && <div className="someone-else-dot" title={t('someone_else')}/>}
    </div>
  );
}

/* ── AmbientGlow — soft cover halo; on play gently pumps with bass ───────── */
function AmbientGlow({ accent, visible, isPlaying, audioRef, eqAnalyserRef }) {
  const [slots, setSlots] = useState(() => [{ a: accent, on: true }, { a: accent, on: false }]);
  const activeRef = useRef(0);
  const keyRef = useRef(accent.r + ',' + accent.g + ',' + accent.b);
  const wrapRef = useRef(null);
  const playingRef = useRef(isPlaying);
  const visibleRef = useRef(visible);
  playingRef.current = isPlaying;
  visibleRef.current = visible;
  const smoothRef = useRef(0);
  const kickRef = useRef(0);
  const avgRef = useRef(0.12);
  const freqBufRef = useRef(null);
  useEffect(() => {
    const key = accent.r + ',' + accent.g + ',' + accent.b;
    if (key === keyRef.current) return;
    keyRef.current = key;
    const next = activeRef.current === 0 ? 1 : 0;
    activeRef.current = next;
    setSlots(prev => prev.map((s, i) => i === next ? { a: accent, on: true } : { ...s, on: false }));
  }, [accent.r, accent.g, accent.b]);
  useEffect(() => {
    const wrap = wrapRef.current;
    if (!wrap) return;
    let raf = 0;
    const tick = (t) => {
      const playing = playingRef.current && visibleRef.current;
      let raw = 0;
      if (playing) {
        try {
          const el = audioRef?.current;
          const key = el && el._aoiEqKey;
          const an = key && eqAnalyserRef?.current?.[key];
          if (an) {
            const n = an.frequencyBinCount;
            if (!freqBufRef.current || freqBufRef.current.length !== n) {
              freqBufRef.current = new Uint8Array(n);
            }
            const data = freqBufRef.current;
            an.getByteFrequencyData(data);
            let sum = 0, wsum = 0;
            const lim = Math.max(4, Math.floor(n * 0.1));
            for (let i = 0; i < lim; i++) {
              const w = 1 + (lim - i) * 0.2;
              sum += data[i] * w;
              wsum += w;
            }
            raw = sum / (wsum * 255);
          } else {
            const sec = t * 0.001;
            raw = 0.18 + 0.12 * (0.5 + 0.5 * Math.sin(sec * 3.6));
          }
        } catch { raw = 0; }
      }
      avgRef.current = avgRef.current * 0.97 + raw * 0.03;
      if (raw > avgRef.current * 1.28 && raw > 0.14) {
        kickRef.current = Math.min(1, kickRef.current + (raw - avgRef.current) * 2.2);
      }
      kickRef.current *= 0.88;
      const target = playing ? Math.min(1, raw * 0.65 + kickRef.current * 0.45) : 0;
      const e = (smoothRef.current = smoothRef.current * 0.78 + target * 0.22);
      /* tiny speaker pump — stays a cover glow, not a blob */
      const base = visibleRef.current ? (playingRef.current ? 0.92 : 0.5) : 0;
      const op = base + e * 0.18;
      const sc = 1 + e * 0.055;
      wrap.style.opacity = String(op);
      wrap.style.transform = `scale(${sc})`;
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [audioRef, eqAnalyserRef]);
  const grad = (a) => `radial-gradient(circle at center, rgba(${a.r},${a.g},${a.b},0.55) 0%, rgba(${a.r},${a.g},${a.b},0.26) 36%, rgba(${a.r},${a.g},${a.b},0.08) 64%, rgba(${a.r},${a.g},${a.b},0) 90%)`;
  return (
    <div ref={wrapRef} style={{
      position:'absolute', inset:'-18%', borderRadius:'50%',
      opacity: visible ? (isPlaying ? 0.92 : 0.5) : 0,
      transform:'scale(1)',
      willChange:'transform, opacity',
      pointerEvents:'none', zIndex:0,
    }}>
      {slots.map((s, i) => (
        <div key={i} style={{
          position:'absolute', inset:0, borderRadius:'50%',
          background: grad(s.a), filter:'blur(36px)',
          opacity: s.on ? 1 : 0, transition:'opacity 0.6s ease',
        }}/>
      ))}
    </div>
  );
}

/* ── PlayingIndicator ────────────────────────────────────────────────────── */

}

/* ── MagBtn ──────────────────────────────────────────────────────────────── */
function MagBtn({ onClick, onHoldStart, onHoldEnd, holdMs=280, active, children, size=52, locked=false, title, className }) {
  const held = useRef(false);
  const timer = useRef(null);
  const usingHold = typeof onHoldStart === 'function';
  const clear = () => { if (timer.current) { clearTimeout(timer.current); timer.current = null; } };
  const endHold = () => {
    const wasHeld = held.current;
    clear();
    held.current = false;
    if (wasHeld) onHoldEnd?.();
    return wasHeld;
  };
  return (
    <motion.button title={title} className={className}
      onClick={locked || usingHold ? undefined : onClick}
      onPointerDown={locked || !usingHold ? undefined : (e) => {
        if (e.button !== 0) return;
        try { e.currentTarget.setPointerCapture(e.pointerId); } catch {}
        held.current = false;
        clear();
        timer.current = setTimeout(() => { held.current = true; onHoldStart(); }, holdMs);
      }}
      onPointerUp={locked || !usingHold ? undefined : (e) => {
        if (!endHold()) onClick?.(e);
      }}
      onPointerLeave={locked || !usingHold ? undefined : () => { endHold(); }}
      onPointerCancel={locked || !usingHold ? undefined : () => { endHold(); }}
      whileHover={locked ? undefined : { y: -1 }}
      whileTap={locked ? undefined : { y: 0.5, scale: 0.96 }}
      transition={{ type:'spring', stiffness: 520, damping: 28, mass: 0.35 }}
      style={{
        width:size, height:size, borderRadius:'50%', border:'none', background:'none',
        color: active ? 'var(--accent)' : 'rgba(255,255,255,0.38)',
        display:'flex', alignItems:'center', justifyContent:'center',
        cursor: locked ? 'default' : 'pointer', flexShrink:0,
        opacity: locked ? 0.28 : 1,
        pointerEvents: locked ? 'none' : 'auto',
        transition:'color 0.2s ease, opacity 0.2s ease',
      }}>
      {children}
    </motion.button>
  );
}

/* ── TrackContextMenu ────────────────────────────────────────────────────── */
function TrackContextMenu({ menu, onClose, onCopyLink, onStartStation, playlists, onAddToPlaylist, canSuggest, onSuggest }) {
  const ref = useRef(null);
  const [pos, setPos] = useState({ x: menu.x, y: menu.y, ready: false });

  useLayoutEffect(() => {
    const el = ref.current;
    if (!el) return;
    const w = el.offsetWidth;
    const h = el.offsetHeight;
    const PAD = 8;
    let x = menu.x;
    let y = menu.y;
    if (x + w > window.innerWidth - PAD)  x = window.innerWidth  - w - PAD;
    if (y + h > window.innerHeight - PAD) y = window.innerHeight - h - PAD;
    if (x < PAD) x = PAD;
    if (y < PAD) y = PAD;
    setPos({ x, y, ready: true });
  }, [menu.x, menu.y]);

  useEffect(() => {
    const onDown = (e) => {
      if (e.button === 2) return;
      if (!ref.current || ref.current.contains(e.target)) return;
      onClose();
    };
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    const onScroll = () => onClose();
    document.addEventListener('mousedown', onDown, true);
    document.addEventListener('keydown', onKey);
    window.addEventListener('wheel', onScroll, { passive: true });
    return () => {
      document.removeEventListener('mousedown', onDown, true);
      document.removeEventListener('keydown', onKey);
      window.removeEventListener('wheel', onScroll);
    };
  }, [onClose]);

  const t = useLang();
  const canCopy = !!menu.track.permalinkUrl;

  const Item = ({ label, icon, disabled, onClick }) => (
    <div onClick={disabled ? null : () => { onClick?.(); onClose(); }}
      style={{
        display:'flex', alignItems:'center', gap:10,
        padding:'7px 11px', borderRadius:7,
        fontSize:12.5, color: disabled ? 'rgba(255,255,255,0.25)' : 'rgba(255,255,255,0.86)',
        cursor: disabled ? 'default' : 'pointer',
        transition:'background 0.12s',
        userSelect:'none',
      }}
      onMouseEnter={e => { if (!disabled) e.currentTarget.style.background='rgba(255,255,255,0.07)'; }}
      onMouseLeave={e => { e.currentTarget.style.background='transparent'; }}>
      <span style={{display:'flex', alignItems:'center', justifyContent:'center', width:14, opacity:0.7}}>{icon}</span>
      <span>{label}</span>
    </div>
  );

  return ReactDOM.createPortal(
    <motion.div ref={ref}
      initial={{ opacity: 0, scale: 0.985 }}
      animate={{ opacity: pos.ready ? 1 : 0, scale: 1 }}
      exit={{ opacity: 0, scale: 0.99 }}
      transition={{ duration: 0.11, ease: 'easeOut' }}
      style={{
        position:'fixed', left: pos.x, top: pos.y,
        transformOrigin: 'top left',
        minWidth: 200,
        background:'rgba(24,24,24,0.97)',
        backdropFilter:'blur(14px)', WebkitBackdropFilter:'blur(14px)',
        border:'1px solid rgba(255,255,255,0.055)',
        borderRadius:10, padding:4,
        boxShadow:'0 12px 36px rgba(0,0,0,0.55), 0 2px 8px rgba(0,0,0,0.3)',
        zIndex: 9998,
      }}>
      <Item label={t('copy_link')} disabled={!canCopy}
        onClick={() => onCopyLink(menu.track)}
        icon={
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
          </svg>
        }/>
      <Item label={t('start_station')} disabled={!menu.track.id || !onStartStation}
        onClick={() => onStartStation(menu.track)}
        icon={
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <circle cx="12" cy="12" r="2"/>
            <path d="M16.24 7.76a6 6 0 0 1 0 8.49M7.76 16.24a6 6 0 0 1 0-8.49M20.49 4a10 10 0 0 1 0 16M3.51 20a10 10 0 0 1 0-16"/>
          </svg>
        }/>
      {canSuggest && (
        <Item label={t('room_suggest')} disabled={!menu.track || (!menu.track.streamUrl && !menu.track.hlsUrl && !menu.track.id)}
          onClick={() => onSuggest?.(menu.track)}
          icon={
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <path d="M12 19V5"/><path d="M5 12l7-7 7 7"/>

            <path d="M12 5v14M5 12h14"/>
          </svg>
        }/>
    </motion.div>,
    document.body
  );
}

function VirtualTrackList({ items, activeId, loadingId, errorId, onClickItem, onContextMenuItem, scrollToActive, scrollTargetId, accentRGB, isPlaying }) {
  const ROW_H = 50;
  const BUFFER = 5;
  const FADE = 18;
  const ref = useRef(null);
  const scrollRafRef = useRef(null);
  const [range, setRange] = useState({ start: 0, end: 30 });
  const [edges, setEdges] = useState({ top: false, bottom: false });

  const updateRange = useCallback(() => {
    const el = ref.current;
    if (!el) return;
    const scrollTop = el.scrollTop;
    const viewportH = el.clientHeight;
    const visibleStart = Math.floor(scrollTop / ROW_H);
    const visibleEnd = Math.ceil((scrollTop + viewportH) / ROW_H);
    const start = Math.max(0, visibleStart - BUFFER);
    const end = Math.min(items.length, visibleEnd + BUFFER);
    setRange(prev => (prev.start === start && prev.end === end) ? prev : { start, end });
    const topEdge = scrollTop > 4;
    const botEdge = scrollTop + viewportH < el.scrollHeight - 4;
    setEdges(prev => (prev.top === topEdge && prev.bottom === botEdge) ? prev : { top: topEdge, bottom: botEdge });
  }, [items.length]);

  const updateRangeRef = useRef(updateRange);
  updateRangeRef.current = updateRange;

  useLayoutEffect(() => { updateRange(); }, [updateRange]);

  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const onScroll = () => {
      if (scrollRafRef.current) return;
      scrollRafRef.current = requestAnimationFrame(() => {
        scrollRafRef.current = null;
        updateRangeRef.current?.();
      });
    };
    el.addEventListener('scroll', onScroll, { passive: true });
    const ro = new ResizeObserver(() => updateRangeRef.current?.());
    ro.observe(el);
    return () => {
      el.removeEventListener('scroll', onScroll);
      ro.disconnect();
      cancelAnimationFrame(scrollRafRef.current);
    };
  }, []);

  const maskImage = (() => {
    if (!edges.top && !edges.bottom) return 'none';
    const parts = [];
    parts.push(edges.top ? `transparent 0` : `black 0`);
    parts.push(edges.top ? `black ${FADE}px` : `black 0`);
    parts.push(edges.bottom ? `black calc(100% - ${FADE}px)` : `black 100%`);
    parts.push(edges.bottom ? `transparent 100%` : `black 100%`);
    return `linear-gradient(to bottom, ${parts.join(', ')})`;
  })();

  useEffect(() => {
    if (!scrollToActive || !ref.current) return;
    const targetId = scrollTargetId ?? activeId;
    const idx = items.findIndex(t => t.id === targetId);
    if (idx < 0) return;
    const el = ref.current;
    smoothScroll(el, Math.max(0, idx * ROW_H - el.clientHeight / 2 + ROW_H / 2), 420);
  }, [scrollToActive]);

  const onClickStable = useCallback(t => onClickItem(t), [onClickItem]);

  const activeIdx = items.findIndex(t => t.id === activeId);
  const visibleItems = items.slice(range.start, range.end);
  const totalHeight = items.length * ROW_H;
  const offsetTop = range.start * ROW_H;

  return (
    <div ref={ref} className="scroll-thin" style={{
      flex:1, overflowY:'auto', padding:'2px 6px 10px', position:'relative',
      maskImage: maskImage, WebkitMaskImage: maskImage,
      transition: 'mask-image 0.2s ease, -webkit-mask-image 0.2s ease',
    }}>
      {activeIdx >= 0 && (
        <div style={{
          position:'absolute', pointerEvents:'none',
          top:2, left:6, right:6, height: ROW_H - 2,
          transform:`translateY(${activeIdx * ROW_H}px)`,
          borderRadius:9,
          background: accentRGB ? `rgba(${accentRGB.r},${accentRGB.g},${accentRGB.b},0.14)` : 'rgba(178,178,178,0.09)',
          transition:'transform 0.42s cubic-bezier(0.45,0,0.55,1), background 0.55s ease',
          willChange:'transform',
          zIndex:0,
        }}/>
      )}
      <div style={{position:'relative', zIndex:1, height: totalHeight}}>
        <div style={{transform:`translateY(${offsetTop}px)`}}>
          {visibleItems.map(t => (
            <TrackRow key={t.id} track={t} isActive={t.id === activeId}
              isLoading={t.id === loadingId}
              isError={t.id === errorId}
              isPlaying={t.id === activeId && isPlaying}
              onClick={onClickStable}
              onContextMenu={onContextMenuItem}/>
          ))}
        </div>
      </div>
    </div>
  );
}
