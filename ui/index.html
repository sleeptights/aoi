/* ── Hero clone ──────────────────────────────────────────────────────────── */
const HERO_DUR_MS  = 380;
const HERO_FADE_MS = 140;
const HERO_EASE    = 'expo.inOut';
function HeroClone({ hero, exiting, reverse = false }) {
  const cloneRef = useRef(null);
  const { left: tLeft, top: tTop, size } = hero.targetRect;
  const { left: sLeft, top: sTop, width: sW, height: sH } = hero.startRect;

  const dx = (sLeft + sW/2) - (tLeft + size/2);
  const dy = (sTop + sH/2) - (tTop + size/2);
  const sc = sW / size;
  const BR = 16;
  const DUR = HERO_DUR_MS / 1000;

  // run the timeline BEFORE first paint so there is no flash in the target rect
  useLayoutEffect(() => {
    const el = cloneRef.current;
    if (!el) return;
    const tl = gsap.timeline({ defaults: { force3D: true, ease: HERO_EASE, duration: DUR } });
    if (reverse) {
      tl.fromTo(el, { x: 0, y: 0, scale: 1 }, { x: dx, y: dy, scale: sc }, 0);
    } else {
      tl.fromTo(el, { x: dx, y: dy, scale: sc }, { x: 0, y: 0, scale: 1 }, 0);
    }
    return () => tl.kill();
  }, []);

  useEffect(() => {
    if (!exiting || !cloneRef.current) return;
    const tween = gsap.to(cloneRef.current, {
      opacity: 0,
      duration: HERO_FADE_MS / 1000,
      ease: 'power2.out',
      force3D: true,
    });
    return () => tween.kill();
  }, [exiting]);

  // pre-paint inline transform — clone is born already in its starting position
  const initialTransform = reverse
    ? 'translate3d(0,0,0) scale(1)'
    : `translate3d(${dx}px, ${dy}px, 0) scale(${sc})`;

  return ReactDOM.createPortal(
    <div ref={cloneRef} style={{
      position:'fixed',
      left: tLeft, top: tTop,
      width: size, height: size,
      zIndex:960, pointerEvents:'none',
      transformOrigin:'center center',
      transform: initialTransform,
      borderRadius: BR,
      overflow:'hidden',
      background:'#111116',
      willChange:'transform, opacity',
      backfaceVisibility:'hidden',
      contain:'layout style paint',
    }}>
      {hero.track.coverUrl ? (
        <img src={hero.track.coverUrl}
          loading="eager" decoding="sync"
          style={{
            position:'absolute', inset:0, width:'100%', height:'100%',
            objectFit:'cover', display:'block',
          }}
          onError={e=>{e.currentTarget.style.display='none'}}/>
      ) : (
        <div style={{
          position:'absolute', inset:0,
          display:'flex', alignItems:'center', justifyContent:'center',
        }}>
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none">
            <path d="M9 18V5l12-2v13" stroke="rgba(255,255,255,0.13)" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
            <circle cx="6" cy="18" r="3" stroke="rgba(255,255,255,0.13)" strokeWidth="1.5"/>
            <circle cx="18" cy="16" r="3" stroke="rgba(255,255,255,0.13)" strokeWidth="1.5"/>
          </svg>
        </div>
      )}
    </div>,
    document.body
  );
}

function PlaylistView({ visible, playlists, scPlaylists, scAuth, openId, onOpen, onBack, onCreate, onRename, onDelete, onRemoveItem, onPlayTrack, onPlayScPlaylist, onSaveScPlaylists, activeId, loadingTrackId, errorTrackId, hideDividers, onContextMenu, likedIds, onLike, accentRGB, sharedCrates, openShared, onSharedConsumed, onAddCurrentToShared, onRemoveSharedItem, onClearShared }) {
  const t = useLang();
  const lang = useContext(LangContext);
  const [editing, setEditing] = useState(null);
  const [draft, setDraft] = useState('');
  const [tab, setTab] = useState('local');
  const tabWrapRef = useRef(null);
  const tabRefs = useRef({});
  const [tabRail, setTabRail] = useState({ left: 0, width: 0 });
  const [scQ, setScQ] = useState('');
  const [scResults, setScResults] = useState([]);
  const [scLoading, setScLoading] = useState(false);
  const [discoverQ, setDiscoverQ] = useState('');
  const [discoverLoading, setDiscoverLoading] = useState(false);
  const [discoverResults, setDiscoverResults] = useState([]);
  const [scNeedLogin, setScNeedLogin] = useState(false);
  const [openSc, setOpenSc] = useState(null);
  const [openSharedBox, setOpenSharedBox] = useState(null);
  const open = (playlists || []).find(p => p.id === openId) || null;
  const moods = window.AoiCustom?.SC_MOODS || [];
  useEffect(() => {
    if (!visible) { setOpenSc(null); setOpenSharedBox(null); }
  }, [visible]);
  useEffect(() => {
    if (!openShared?.friendUid) return;
    setTab('shared');
    setOpenSc(null);
    setOpenSharedBox(openShared);
    onSharedConsumed?.();
  }, [openShared?.friendUid, openShared?.nonce]);
  useLayoutEffect(() => {
    const el = tabRefs.current[tab];
    const wrap = tabWrapRef.current;
    if (!el || !wrap) return;
    const wr = wrap.getBoundingClientRect();
    const r = el.getBoundingClientRect();
    setTabRail({ left: r.left - wr.left, width: r.width });
  }, [tab, lang, visible]);

  const transStyle = {
    position:'absolute', inset:0,
    opacity: visible ? 1 : 0,
    pointerEvents: visible ? 'auto' : 'none',
    transition:'opacity 0.18s ease',
    display:'flex', flexDirection:'column',
    padding:'28px 36px 24px 36px',
  };

  const openScPlaylist = async (pl) => {
    if (!scAuth?.token || !window.electronAPI?.scFetch) {
      setScNeedLogin(true);
      return;
    }
    setScNeedLogin(false);
    setOpenSc({ pl, items: [], loading: true });
    const items = await fetchScPlaylistTracks(pl, scAuth, t('no_title'));
    setOpenSc({ pl, items, loading: false });
  };

  const searchScPlaylists = async (q, mode = 'sc') => {
    const query = String(q || '').trim();
    if (!query) return [];
    if (!scAuth?.token || !window.electronAPI?.scFetch) {
      if (mode === 'sc') setScNeedLogin(true);
      return [];
    }
    setScNeedLogin(false);
    const setLoading = mode === 'discover' ? setDiscoverLoading : setScLoading;
    const setResults = mode === 'discover' ? setDiscoverResults : setScResults;
    setLoading(true);
    try {
      const res = await window.electronAPI.scFetch(
        `https://api-v2.soundcloud.com/search/playlists?q=${encodeURIComponent(query)}&limit=24`,
        scAuth.token, scAuth.clientId
      );
      const mapped = (res.data?.collection || []).map(p => ({
        id: p.id,
        title: p.title || '',
        user: p.user?.username || '',
        artwork: p.artwork_url ? p.artwork_url.replace('-large', '-t500x500') : (p.user?.avatar_url || null),
        trackCount: p.track_count || 0,
        uri: p.uri || `https://api-v2.soundcloud.com/playlists/${p.id}`,
      }));
      setResults(mapped);
      setLoading(false);
      return mapped;
    } catch {
      setResults([]);
      setLoading(false);
      return [];
    }
  };

  const saveScPlaylist = (pl) => {
    const list = scPlaylists || [];
    if (list.some(x => String(x.id) === String(pl.id))) return;
    onSaveScPlaylists?.([{
      id: pl.id, title: pl.title, user: pl.user, artwork: pl.artwork,
      trackCount: pl.trackCount, uri: pl.uri,
    }, ...list].slice(0, 40));
  };

  const tabBtn = (id, label) => {
    const active = tab === id;
    return (
      <div ref={el => { tabRefs.current[id] = el; }}
        onClick={() => { setTab(id); if (id === 'sc') setScResults([]); }} style={{
        fontSize:12, fontWeight:500, letterSpacing:'0.03em', cursor:'pointer', userSelect:'none',
        padding:'6px 12px', borderRadius:8, position:'relative', zIndex:1,
        background: 'transparent',
        color: active ? 'rgba(255,255,255,0.9)' : 'rgba(255,255,255,0.35)',
        border: '1px solid transparent',
      }}>{label}</div>
    );
  };

  const renderScRow = (pl, opts) => {
    const saved = (scPlaylists || []).some(x => String(x.id) === String(pl.id));
    return (
      <div key={pl.id} style={{
        display:'flex', alignItems:'center', gap:12,
        padding:'10px 12px', borderRadius:12, cursor:'pointer',
        background:'rgba(255,255,255,0.034)',
      }}>
        <div onClick={() => openScPlaylist(pl)} style={{display:'flex', alignItems:'center', gap:12, flex:1, minWidth:0}}>
          {pl.artwork
            ? <img src={pl.artwork} style={{width:44, height:44, borderRadius:8, objectFit:'cover', flexShrink:0}}/>
            : <div style={{width:44, height:44, borderRadius:8, background:'rgba(255,255,255,0.06)', flexShrink:0}}/>}
          <div style={{flex:1, minWidth:0}}>
            <div style={{fontSize:13, color:'rgba(255,255,255,0.82)', fontWeight:600, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>{pl.title}</div>
            <div style={{fontSize:11, color:'rgba(255,255,255,0.28)', marginTop:2}}>{pl.user || 'SoundCloud'} · {pl.trackCount || 0}</div>
          </div>
        </div>
        {opts?.canSave && !saved && (
          <div onClick={() => saveScPlaylist(pl)} title="+" style={{
            fontSize:18, color:'rgba(255,255,255,0.35)', cursor:'pointer', padding:'0 6px',
          }}>+</div>
        )}
      </div>
    );
  };

  if (openSc) {
    const { pl, items, loading } = openSc;
    return (
      <div style={transStyle}>
        <div style={{display:'flex', alignItems:'center', gap:12, marginBottom:18}}>
          <div onClick={() => setOpenSc(null)} title={t('back')} style={{
            width:32, height:32, borderRadius:9, cursor:'pointer',
            display:'flex', alignItems:'center', justifyContent:'center',
            background:'rgba(255,255,255,0.04)', color:'rgba(255,255,255,0.7)',
          }}>
            <svg width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2.2" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
          </div>
          <div style={{flex:1, minWidth:0}}>
            <div style={{fontSize:16, fontWeight:700, color:'rgba(255,255,255,0.88)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>
              {pl.title || 'SoundCloud'}
            </div>
            <div style={{fontSize:11, color:'rgba(255,255,255,0.35)', marginTop:2}}>
              {pl.user || 'SoundCloud'} · {items.length || pl.trackCount || 0}
            </div>
          </div>
          {items.length > 0 && (
            <div onClick={() => onPlayScPlaylist?.({ ...pl, _cachedItems: items })} style={{
              fontSize:12, color:'rgba(255,255,255,0.7)', cursor:'pointer',
              background:'rgba(255,255,255,0.06)', borderRadius:8, padding:'6px 12px',
            }}>{t('nav_player')}</div>
          )}
        </div>
        {loading ? (
          <div style={{fontSize:13, color:'rgba(255,255,255,0.32)', padding:'40px 0', textAlign:'center'}}>{t('loading')}</div>
        ) : items.length === 0 ? (
          <div style={{fontSize:13, color:'rgba(255,255,255,0.32)', padding:'40px 0', textAlign:'center'}}>
            {t('playlist_empty')}
          </div>
        ) : (
          <div className="scroll-thin" style={{flex:1, overflowY:'auto'}}>
            {items.map((tr, i) => (
              <SearchTrackRow
                key={tr.id || i}
                track={tr}
                isLiked={likedIds?.has(tr.id) || likedIds?.has(String(tr.id))}
                onLike={tr?.id && onLike ? () => onLike(tr) : undefined}
                onClick={() => onPlayTrack(tr, items, pl.title)}
                onCoverClick={() => onPlayTrack(tr, items, pl.title)}
                isActive={activeId != null && String(activeId) === String(tr.id)}
                isLoading={loadingTrackId === tr.id}
                isError={errorTrackId === tr.id}
                hideDividers={hideDividers}
                onContextMenu={onContextMenu}
              />
            ))}
          </div>
        )}
      </div>
    );
  }

  if (open) {
    const items = open.items || [];
    return (
      <div style={transStyle}>
        <div style={{display:'flex', alignItems:'center', gap:12, marginBottom:18}}>
          <div onClick={onBack} title={t('back')} style={{
            width:32, height:32, borderRadius:9, cursor:'pointer',
            display:'flex', alignItems:'center', justifyContent:'center',
            background:'rgba(255,255,255,0.04)', color:'rgba(255,255,255,0.7)',
          }}>
            <svg width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2.2" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
          </div>
          {editing === open.id ? (
            <input autoFocus value={draft} onChange={e => setDraft(e.target.value)}
              onKeyDown={e => {
                if (e.key === 'Enter') { onRename(open.id, draft); setEditing(null); }
                if (e.key === 'Escape') setEditing(null);
              }}
              onBlur={() => { onRename(open.id, draft); setEditing(null); }}
              style={{flex:1, background:'rgba(255,255,255,0.06)', border:'none', outline:'none',
                color:'#ededf4', fontSize:16, fontWeight:700, fontFamily:'inherit',
                borderRadius:8, padding:'6px 10px'}}/>
          ) : (
            <div onClick={() => { setDraft(open.name); setEditing(open.id); }}
              style={{flex:1, fontSize:16, fontWeight:700, color:'rgba(255,255,255,0.88)', cursor:'text'}}>
              {open.name}
            </div>
          )}
          <div onClick={() => onDelete(open.id)} style={{
            fontSize:11, color:'rgba(255,80,80,0.75)', cursor:'pointer', padding:'4px 8px',
          }}>{t('playlist_delete')}</div>
        </div>
        {items.length === 0 ? (
          <div style={{fontSize:13, color:'rgba(255,255,255,0.32)', padding:'40px 0', textAlign:'center'}}>
            {t('playlist_empty')}<br/>
            <span style={{fontSize:12, opacity:0.7}}>{t('playlist_hint')}</span>
          </div>
        ) : (
          <div className="scroll-thin" style={{flex:1, overflowY:'auto'}}>
            {items.map((tr, i) => (
              <div key={tr.id || i} style={{display:'flex', alignItems:'center', gap:8}}>
                <div style={{flex:1, minWidth:0}}>
                  <SearchTrackRow
                    track={tr}
                    isLiked={likedIds?.has(tr.id) || likedIds?.has(String(tr.id))}
                    onLike={tr?.id && onLike ? () => onLike(tr) : undefined}
                    onClick={() => onPlayTrack(tr, items, open.name)}
                    onCoverClick={() => onPlayTrack(tr, items, open.name)}
                    isActive={activeId != null && String(activeId) === String(tr.id)}
                    isLoading={loadingTrackId === tr.id}
                    isError={errorTrackId === tr.id}
                    hideDividers={hideDividers}
                    onContextMenu={onContextMenu}
                  />
                </div>
                <div onClick={() => onRemoveItem(open.id, i)}
                  style={{fontSize:16, color:'rgba(255,255,255,0.22)', cursor:'pointer', padding:'0 8px'}}>×</div>
              </div>
            ))}
          </div>
        )}
      </div>
    );
  }

  if (openSharedBox) {
    const live = (sharedCrates || []).find(b => String(b.friendUid) === String(openSharedBox.friendUid)) || openSharedBox;
    const items = live.items || [];
    const title = sharedPlaylistName(t, live.friendName || openSharedBox.friendName);
    return (
      <div style={transStyle}>
        <div style={{display:'flex', alignItems:'center', gap:12, marginBottom:18}}>
          <div onClick={() => setOpenSharedBox(null)} title={t('back')} style={{
            width:32, height:32, borderRadius:9, cursor:'pointer',
            display:'flex', alignItems:'center', justifyContent:'center',
            background:'rgba(255,255,255,0.04)', color:'rgba(255,255,255,0.7)',
          }}>
            <svg width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2.2" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
          </div>
          <div style={{flex:1, minWidth:0}}>
            <div style={{fontSize:16, fontWeight:700, color:'rgba(255,255,255,0.88)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>
              {title}
            </div>
            <div style={{fontSize:11, color:'rgba(255,255,255,0.35)', marginTop:2}}>{items.length}</div>
          </div>
          <div onClick={() => onAddCurrentToShared?.(live.friendUid, live.friendName || openSharedBox.friendName)} style={{
            fontSize:12, color:'rgba(255,255,255,0.7)', cursor:'pointer',
            background:'rgba(255,255,255,0.06)', borderRadius:8, padding:'6px 12px',
          }}>{t('crate_add_current')}</div>
          <div onClick={() => {
            onClearShared?.(live.friendUid, live.friendName || openSharedBox.friendName);
            setOpenSharedBox(null);
          }} style={{
            fontSize:11, color:'rgba(255,80,80,0.75)', cursor:'pointer', padding:'4px 8px',
          }}>{t('playlist_delete')}</div>
        </div>
        {items.length === 0 ? (
          <div style={{fontSize:13, color:'rgba(255,255,255,0.32)', padding:'40px 0', textAlign:'center'}}>
            {t('crate_empty')}<br/>
            <span style={{fontSize:12, opacity:0.7}}>{t('crate_add_current')}</span>
          </div>
        ) : (
          <div className="scroll-thin" style={{flex:1, overflowY:'auto'}}>
            {items.map((tr, i) => (
              <div key={tr.id || i} style={{display:'flex', alignItems:'center', gap:8}}>
                <div style={{flex:1, minWidth:0}}>
                  <SearchTrackRow
                    track={tr}
                    isLiked={likedIds?.has(tr.id) || likedIds?.has(String(tr.id))}
                    onLike={tr?.id && onLike ? () => onLike(tr) : undefined}
                    onClick={() => onPlayTrack(tr, items, title)}
                    onCoverClick={() => onPlayTrack(tr, items, title)}
                    isActive={activeId != null && String(activeId) === String(tr.id)}
                    isLoading={loadingTrackId === tr.id}
                    isError={errorTrackId === tr.id}
                    hideDividers={hideDividers}
                    onContextMenu={onContextMenu}
                  />
                </div>
                <div onClick={() => onRemoveSharedItem?.(live.friendUid, live.friendName || openSharedBox.friendName, tr)}
                  style={{fontSize:16, color:'rgba(255,255,255,0.22)', cursor:'pointer', padding:'0 8px'}}>×</div>
              </div>
            ))}
          </div>
        )}
      </div>
    );
  }

  return (
    <div style={transStyle}>
      <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:14, gap:10, flexWrap:'wrap'}}>
        <div ref={tabWrapRef} className="aoi-pl-tabs">
          <div className="aoi-pl-rail" style={{ transform: 'translateX(' + tabRail.left + 'px)', width: tabRail.width }}/>
          {tabBtn('local', t('playlist_local'))}
          {tabBtn('sc', t('playlist_sc'))}
          {tabBtn('discover', t('playlist_discover'))}
          {tabBtn('shared', t('playlist_shared'))}
        </div>
        {tab === 'local' && (
          <div onClick={onCreate} style={{
            fontSize:12, color:'rgba(255,255,255,0.7)', cursor:'pointer',
            background:'rgba(255,255,255,0.06)', borderRadius:8, padding:'6px 12px',
          }}>{t('playlist_create')}</div>
        )}
      </div>

      {tab === 'local' && (
        !(playlists || []).length ? (
          <div style={{fontSize:13, color:'rgba(255,255,255,0.32)', padding:'48px 0', textAlign:'center', lineHeight:1.6}}>
            {t('playlist_empty')}<br/>
            <span style={{fontSize:12, opacity:0.7}}>{t('playlist_hint')}</span>
          </div>
        ) : (
          <div className="scroll-thin" style={{flex:1, overflowY:'auto', display:'flex', flexDirection:'column', gap:6}}>
            {playlists.map(p => (
              <div key={p.id} onClick={() => onOpen(p.id)}
                style={{
                  display:'flex', alignItems:'center', gap:12,
                  padding:'12px 14px', borderRadius:12, cursor:'pointer',
                  background:'rgba(255,255,255,0.034)',
                }}>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.45)" strokeWidth="2">
                  <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
                </svg>
                <div style={{flex:1, minWidth:0}}>
                  <div style={{fontSize:13, color:'rgba(255,255,255,0.82)', fontWeight:600, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>{p.name}</div>
                  <div style={{fontSize:11, color:'rgba(255,255,255,0.28)', marginTop:2}}>{(p.items || []).length}</div>
                </div>
              </div>
            ))}
          </div>
        )
      )}

      {tab === 'sc' && (
        <>
          <div style={{display:'flex', gap:8, marginBottom:12}}>
            <input value={scQ} onChange={e => setScQ(e.target.value)}
              onKeyDown={e => { if (e.key === 'Enter') searchScPlaylists(scQ); }}
              placeholder={t('playlist_sc_search')}
              style={{flex:1, background:'rgba(255,255,255,0.06)', border:'none', outline:'none',
                color:'#ededf4', fontSize:13, fontFamily:'inherit', borderRadius:8, padding:'8px 12px'}}/>
            <div onClick={() => searchScPlaylists(scQ)} style={{
              fontSize:12, color:'rgba(255,255,255,0.7)', cursor:'pointer',
              background:'rgba(255,255,255,0.06)', borderRadius:8, padding:'8px 14px',
            }}>{t('nav_search')}</div>
          </div>
          {scLoading ? (
            <div style={{fontSize:13, color:'rgba(255,255,255,0.32)', padding:'32px 0', textAlign:'center'}}>…</div>
          ) : (
            <div className="scroll-thin" style={{flex:1, overflowY:'auto', display:'flex', flexDirection:'column', gap:6}}>
              {(scResults.length ? scResults : (scPlaylists || [])).map(pl => renderScRow(pl, { canSave: scResults.length > 0 }))}
              {!scResults.length && !(scPlaylists || []).length && (
                <div style={{fontSize:13, color:'rgba(255,255,255,0.32)', padding:'32px 0', textAlign:'center'}}>
                  {scNeedLogin ? t('playlist_sc_login') : t('playlist_sc_empty')}
                </div>
              )}
            </div>
          )}
        </>
      )}

      {tab === 'discover' && (
        <>
          <div style={{display:'flex', flexWrap:'wrap', gap:8, marginBottom:14}}>
            {moods.map(m => (
              <div key={m.id} onClick={async () => {
                setDiscoverQ(m.q);
                await searchScPlaylists(m.q, 'discover');
              }} style={{
                fontSize:12, padding:'6px 12px', borderRadius:20, cursor:'pointer',
                background: discoverQ === m.q ? 'rgba(var(--accent-rgb),0.18)' : 'rgba(255,255,255,0.06)',
                color: discoverQ === m.q ? 'rgba(255,255,255,0.9)' : 'rgba(255,255,255,0.5)',
                border: discoverQ === m.q ? '1px solid rgba(var(--accent-rgb),0.35)' : '1px solid transparent',
              }}>
                {lang === 'ru' ? m.labelRu : m.labelEn}
              </div>
            ))}
          </div>
          {discoverLoading ? (
            <div style={{fontSize:13, color:'rgba(255,255,255,0.32)', padding:'32px 0', textAlign:'center'}}>…</div>
          ) : (
            <div className="scroll-thin" style={{flex:1, overflowY:'auto', display:'flex', flexDirection:'column', gap:6}}>
              {discoverResults.map(pl => renderScRow(pl, { canSave: true }))}
              {!discoverResults.length && (
                <div style={{fontSize:13, color:'rgba(255,255,255,0.32)', padding:'32px 0', textAlign:'center', lineHeight:1.6}}>
                  {scNeedLogin ? t('playlist_sc_login') : t('playlist_discover')}
                </div>
              )}
            </div>
          )}
        </>
      )}

      {tab === 'shared' && (
        !(sharedCrates || []).length ? (
          <div style={{fontSize:13, color:'rgba(255,255,255,0.32)', padding:'48px 0', textAlign:'center', lineHeight:1.6}}>
            {t('crate_empty')}<br/>
            <span style={{fontSize:12, opacity:0.7}}>{t('crate_create')}</span>
          </div>
        ) : (
          <div className="scroll-thin" style={{flex:1, overflowY:'auto', display:'flex', flexDirection:'column', gap:6}}>
            {(sharedCrates || []).map(box => (
              <div key={box.pairKey || box.friendUid} onClick={() => { onOpen?.(null); setOpenSharedBox(box); }}
                style={{
                  display:'flex', alignItems:'center', gap:12,
                  padding:'12px 14px', borderRadius:12, cursor:'pointer',
                  background:'rgba(255,255,255,0.034)',
                }}>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.45)" strokeWidth="2">
                  <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                  <circle cx="9" cy="7" r="4"/>
                  <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                  <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                </svg>
                <div style={{flex:1, minWidth:0}}>
                  <div style={{fontSize:13, color:'rgba(255,255,255,0.82)', fontWeight:600, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>
                    {sharedPlaylistName(t, box.friendName)}
                  </div>
                  <div style={{fontSize:11, color:'rgba(255,255,255,0.28)', marginTop:2}}>{(box.items || []).length}</div>
                </div>
              </div>
            ))}
          </div>
        )
      )}
    </div>
  );
}

function RoomsView({
  visible, room, joinCode, onJoinCode, onCreate, onJoin, onLeave, onCopy,
  selfName, selfAvatar, selfId, selfUid, draftLocks, onToggleDraftLock,
  onToggleLock, onKick, onBan, onTransfer, onPlaySuggestion,
  volume, onVolume, onVolumeLive, accentKey, busy,
}) {
  busy = busy || {};
  const t = useLang();
  const [lobbyTab, setLobbyTab] = useState('setup');
  const [codeWet, setCodeWet] = useState(false);
  const [memberMenu, setMemberMenu] = useState(null);
  const slots = slotsFromRoom(room);
  const suggestions = room.suggestions || [];
  const inRoom = room.role === 'host' || room.role === 'guest';
  const isHost = room.role === 'host';
  const occupied = slots.filter(s => s.member).length;

  const transStyle = {
    position:'absolute', inset:0,
    opacity: visible ? 1 : 0,
    pointerEvents: visible ? 'auto' : 'none',
    transition:'opacity 0.18s ease',
    display:'flex',
    background:'var(--bg)',
    zIndex: 5,
  };
  const btn = (primary) => ({
    fontSize:12, cursor:'pointer', borderRadius:8,
    padding:'8px 14px', fontFamily:'inherit',
    background: primary ? 'rgba(255,255,255,0.10)' : 'rgba(255,255,255,0.05)',
    color: primary ? 'rgba(255,255,255,0.88)' : 'rgba(255,255,255,0.62)',
    border:'none',
  });
  const tabBtn = (id) => ({
    ...btn(lobbyTab === id),
    opacity: lobbyTab === id ? 1 : 0.55,
  });

  const renderSlot = (slot, opts) => {
    const m = slot.member;
    const locked = !!slot.locked;
    const localName = selfName && selfName !== 'friend' ? selfName : '';
    const sameName = localName && m && m.name === localName;
    const nameUnique = !!(sameName && (room.members || []).filter(x => x && x.name === localName).length <= 1);
    const mine = !!(m && (
      (selfId && m.id === selfId) ||
      (selfUid && m.uid && String(m.uid) === String(selfUid)) ||
      nameUnique
    ));
    const shownName = (mine && localName) ? localName : (m && m.name) || localName;
    const shownAvatar = (mine && selfAvatar) ? selfAvatar : (m && m.avatar);
    const canMod = opts.host && m && !mine;
    const canLock = !!(opts.lockable && !m && opts.onLock);
    return (
      <div key={m ? (m.id || m.uid || slot.i) : ('empty-' + slot.i)}
        className={m ? 'aoi-slot-in' : undefined}
        onContextMenu={canMod ? (e) => {
          e.preventDefault();
          setMemberMenu({ member: m, x: e.clientX, y: e.clientY });
        } : undefined}
        onClick={canLock && !busy.lock ? () => opts.onLock(slot.i, !locked) : undefined}
        style={{
          flex: 'none',
          minHeight: 44,
          display:'flex', alignItems:'center', gap:10,
          padding: '8px 12px',
          borderRadius: 12,
          cursor: canLock && !busy.lock ? 'pointer' : (canMod ? 'context-menu' : 'default'),
          background: locked ? 'rgba(255,255,255,0.018)' : 'rgba(255,255,255,0.034)',
          opacity: locked && !m ? 0.62 : 1,
        }}>
        {m ? (
          <RoomAvatar src={shownAvatar} size={32} radius={9}/>
        ) : (
          <div style={{width:32, height:32, borderRadius:9, background:'rgba(255,255,255,0.04)', flexShrink:0,
            display:'flex', alignItems:'center', justifyContent:'center', color:'rgba(255,255,255,0.22)'}}>
            <LockIcon locked={locked} size={13}/>
          </div>
        )}
        <div style={{minWidth:0, flex:1}}>
          <div style={{fontSize:13, fontWeight: m ? 650 : 500, color: m ? 'rgba(255,255,255,0.88)' : 'rgba(255,255,255,0.28)',
            overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>
            {m ? ((shownName || m.name) + (mine ? ' · ' + t('room_you') : '')) : (locked ? t('room_slot_locked') : t('room_slot') + ' ' + (slot.i + 1))}
          </div>
          {m && m.role === 'host' && (
            <div style={{fontSize:11, color:'var(--accent)', marginTop:1}}>{t('room_host')}</div>
          )}
        </div>
        {canLock && (
          <div title={locked ? t('room_slot_locked') : t('room_slot_open')}
            style={{width:28, height:28, borderRadius:8, flexShrink:0,
              display:'flex', alignItems:'center', justifyContent:'center',
              opacity: busy.lock ? 0.4 : 1,
              color: locked ? 'rgba(255,255,255,0.55)' : 'rgba(255,255,255,0.28)'}}>
            <LockIcon locked={locked} size={14}/>
          </div>
        )}
      </div>
    );
  };

  return (
    <div style={transStyle}>
      <div style={{flex:1, minWidth:0, height:'100%', display:'flex', flexDirection:'column', padding:'24px 18px 18px 28px', overflow:'hidden'}}>
        <div style={{fontSize:12, fontWeight:500, color:'rgba(255,255,255,0.22)', letterSpacing:'0.06em', textTransform:'uppercase', marginBottom:6, flexShrink:0}}>
          {t('room_title')}
        </div>
        <div style={{fontSize:13, color:'rgba(255,255,255,0.34)', marginBottom:16, lineHeight:1.5, flexShrink:0}}>{t('room_sub')}</div>

        {!inRoom && (
          <div style={{display:'flex', flexDirection:'column', gap:16, maxWidth:420, minHeight:0, flex:1}}>
            <div style={{display:'flex', gap:8}}>
              <button type="button" onClick={() => setLobbyTab('setup')} style={tabBtn('setup')}>{t('room_tab_setup')}</button>
              <button type="button" onClick={() => setLobbyTab('join')} style={tabBtn('join')}>{t('room_tab_join')}</button>
            </div>
            {lobbyTab === 'setup' && (
              <>
                <div style={{fontSize:12, color:'rgba(255,255,255,0.32)', lineHeight:1.45}}>{t('room_setup_hint')}</div>
                <div style={{display:'flex', flexDirection:'column', gap:6, flex:1, minHeight:0, overflow:'auto'}}>
                  {(draftLocks || []).map((locked, i) => renderSlot({ i, locked, member: null }, {
                    fill: false, lockable: true, host: true, onLock: onToggleDraftLock,
                  }))}
                </div>
                <button type="button" onClick={room.status === 'creating' || busy.create ? undefined : onCreate} style={{
                  ...btn(true), textAlign:'center', opacity: (room.status === 'creating' || busy.create) ? 0.45 : 1,
                  pointerEvents: (room.status === 'creating' || busy.create) ? 'none' : 'auto',
                }}>{room.status === 'creating' ? t('loading') : t('room_create')}</button>
              </>
            )}
            {lobbyTab === 'join' && (
              <div style={{display:'flex', flexDirection:'column', gap:8}}>
                <div style={{display:'flex', gap:8}}>
                <input value={joinCode} maxLength={6} spellCheck={false} autoCapitalize="characters"
                  placeholder={t('room_code_ph')}
                  onChange={e => onJoinCode(e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6))}
                  onKeyDown={e => { if (e.key === 'Enter' && joinCode.length >= 4) onJoin(); }}
                  style={{
                    flex:1, background:'rgba(255,255,255,0.05)', border:'none', outline:'none',
                    color:'#ededf4', fontSize:16, fontWeight:700, fontFamily:'inherit', letterSpacing:'0.14em',
                    borderRadius:8, padding:'8px 12px', textTransform:'uppercase',
                  }}/>
                <button type="button" onClick={joinCode.length >= 4 && room.status !== 'joining' && !busy.join ? onJoin : undefined} style={{
                  ...btn(true), display:'flex', alignItems:'center',
                  opacity: joinCode.length >= 4 && !busy.join ? 1 : 0.35,
                  pointerEvents: (room.status === 'joining' || busy.join) ? 'none' : 'auto',
                }}>{room.status === 'joining' ? t('loading') : t('room_join')}</button>
                </div>
                <div className="aoi-join-slots">
                  {[0,1,2,3,4,5].map(i => (
                    <div key={i} className={'aoi-join-slot' + (joinCode.length > i ? ' filled' : '') + (joinCode.length >= 6 ? ' ready' : '')}/>
                  ))}
                </div>
              </div>
            )}
            {room.status === 'reconnecting' && (
              <div style={{fontSize:12, color:'rgba(255,255,255,0.32)'}}>{t('room_reconnecting')}
                <span className="aoi-ellipsis-dot">.</span>
                <span className="aoi-ellipsis-dot" style={{animationDelay:'0.2s'}}>.</span>
                <span className="aoi-ellipsis-dot" style={{animationDelay:'0.4s'}}>.</span>
              </div>
            )}
            {room.error && <div style={{fontSize:12, color:'rgba(255,80,80,0.75)'}}>{room.error}</div>}
          </div>
        )}

        {inRoom && (
          <div style={{display:'flex', flexDirection:'column', gap:12, flex:1, minHeight:0}}>
            <div style={{display:'flex', alignItems:'center', gap:12, flexShrink:0}}>
              <div onClick={busy.copy ? undefined : () => {
                setCodeWet(true);
                onCopy();
                setTimeout(() => setCodeWet(false), 200);
              }} title={t('room_copy')} className={'aoi-code-stamp' + (codeWet ? ' is-wet' : '')} style={{
                fontSize:28, fontWeight:800, letterSpacing:'0.16em', color:'rgba(255,255,255,0.9)',
                cursor: busy.copy ? 'default' : 'pointer', fontVariantNumeric:'tabular-nums',
                opacity: busy.copy ? 0.5 : 1,
              }}>{String(room.code || '').split('').map((ch, i) => (
                <span key={i} style={{ animationDelay: (i * 40) + 'ms' }}>{ch}</span>
              ))}</div>
              <button type="button" onClick={busy.leave ? undefined : onLeave} style={{
                ...btn(false), marginLeft:'auto',
                opacity: busy.leave ? 0.45 : 1,
                pointerEvents: busy.leave ? 'none' : 'auto',
              }}>{t('room_leave')}</button>
            </div>
            <div style={{fontSize:13, color: isHost ? 'var(--accent)' : 'rgba(255,255,255,0.5)', flexShrink:0}}>
              {isHost ? t('room_host') : t('room_guest')}
              {room.hostLeft ? ' · ' + t('room_host_left') : ''}
              {room.status === 'reconnecting' ? ' · ' + t('room_reconnecting') : ''}
            </div>
            {room.track && room.track.title ? (
              <div style={{display:'flex', gap:12, alignItems:'center', background:'rgba(255,255,255,0.034)', borderRadius:12, padding:12, flexShrink:0}}>
                {room.track.coverUrl
                  ? <img src={room.track.coverUrl} style={{width:48, height:48, borderRadius:8, objectFit:'cover'}}/>
                  : <div style={{width:48, height:48, borderRadius:8, background:'rgba(255,255,255,0.06)'}}/>}
                <div style={{minWidth:0}}>
                  <div style={{fontSize:11, color:'rgba(255,255,255,0.28)', marginBottom:3}}>{t('room_now')}</div>
                  <div style={{fontSize:14, fontWeight:700, color:'rgba(255,255,255,0.88)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>{room.track.title}</div>
                  <div style={{fontSize:12, color:'rgba(255,255,255,0.4)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>{room.track.artist}</div>
                </div>
              </div>
            ) : (
              <div style={{fontSize:13, color:'rgba(255,255,255,0.32)', flexShrink:0}}>{t('room_waiting')}</div>
            )}
            <div style={{display:'flex', gap:14, flex:1, minHeight:0}}>
              <div style={{flex:1.15, minWidth:0, display:'flex', flexDirection:'column', gap:6}}>
                <div style={{fontSize:11, color:'rgba(255,255,255,0.28)', flexShrink:0}}>{t('room_members')} · {occupied}</div>
                <div className="scroll-thin" style={{display:'flex', flexDirection:'column', gap:6, flex:1, minHeight:0, overflowY:'auto'}}>
                  {slots.map(slot => renderSlot(slot, {
                    fill: false, lockable: isHost, host: isHost, onLock: onToggleLock,
                  }))}
                </div>
              </div>
              <div style={{flex:1, minWidth:220, display:'flex', flexDirection:'column', minHeight:0}}>
                <div style={{fontSize:11, color:'rgba(255,255,255,0.28)', marginBottom:8, flexShrink:0}}>{t('room_suggests')} · {suggestions.length}</div>
                <div className="scroll-thin" style={{flex:1, minHeight:0, overflowY:'auto', display:'flex', flexDirection:'column', gap:8}}>
                  {suggestions.length === 0 && (
                    <div style={{fontSize:12, color:'rgba(255,255,255,0.28)', paddingTop:8}}>{t('room_suggests_empty')}</div>
                  )}
                  {suggestions.map(s => (
                    <div key={s.id} className="aoi-suggest-in" onClick={isHost && !busy.suggest ? () => onPlaySuggestion?.(s.track) : undefined}
                      style={{
                        display:'flex', gap:10, alignItems:'center',
                        background:'rgba(255,255,255,0.034)', borderRadius:12, padding:10,
                        cursor: isHost && !busy.suggest ? 'pointer' : 'default',
                        opacity: busy.suggest && isHost ? 0.5 : 1,
                      }}>
                      {s.track && s.track.coverUrl
                        ? <img src={s.track.coverUrl} style={{width:40, height:40, borderRadius:8, objectFit:'cover', flexShrink:0}}/>
                        : <div style={{width:40, height:40, borderRadius:8, background:'rgba(255,255,255,0.06)', flexShrink:0}}/>}
                      <div style={{minWidth:0, flex:1}}>
                        <div style={{display:'flex', alignItems:'center', gap:6, marginBottom:3}}>
                          <RoomAvatar src={s.avatar} size={16} radius={5}/>
                          <div style={{fontSize:11, color:'rgba(255,255,255,0.38)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>{s.name}</div>
                        </div>
                        <div style={{fontSize:13, fontWeight:700, color:'rgba(255,255,255,0.86)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>{s.track && s.track.title}</div>
                        <div style={{fontSize:11, color:'rgba(255,255,255,0.36)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>{s.track && s.track.artist}</div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
            {room.error && <div style={{fontSize:12, color:'rgba(255,80,80,0.75)', flexShrink:0}}>{room.error}</div>}
          </div>
        )}
      </div>
      <div style={{
        width:28, flexShrink:0, height:'100%',
        display:'flex', flexDirection:'column', alignItems:'center',
        paddingTop:90, paddingBottom:18, paddingRight:10,
      }}>
        <ThinVolumeSlider volume={volume} onChange={onVolume} onLiveChange={onVolumeLive} accentKey={accentKey}/>
      </div>
      {memberMenu && (
        <MemberContextMenu menu={memberMenu} onClose={() => setMemberMenu(null)}
          onKick={onKick} onBan={onBan} onTransfer={onTransfer} busy={busy}/>
      )}
    </div>
  );
}

function MemberContextMenu({ menu, onClose, onKick, onBan, onTransfer, busy }) {
  const ref = useRef(null);
  const [pos, setPos] = useState({ x: menu.x, y: menu.y, ready: false });
  const t = useLang();
  useLayoutEffect(() => {
    const el = ref.current;
    if (!el) return;
    const w = el.offsetWidth, h = el.offsetHeight, PAD = 8;
    let x = menu.x, y = menu.y;
    if (x + w > window.innerWidth - PAD) x = window.innerWidth - w - PAD;
    if (y + h > window.innerHeight - PAD) y = window.innerHeight - h - PAD;
    if (x < PAD) x = PAD;
    if (y < PAD) y = PAD;
    setPos({ x, y, ready: true });
  }, [menu.x, menu.y]);
  useEffect(() => {
    const onDown = (e) => {
      if (!ref.current || ref.current.contains(e.target)) return;
      onClose();
    };
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('mousedown', onDown, true);
    document.addEventListener('keydown', onKey);
    return () => {
      document.removeEventListener('mousedown', onDown, true);
      document.removeEventListener('keydown', onKey);
    };
  }, [onClose]);
  const Item = ({ label, onClick }) => (
    <div onClick={() => { onClick?.(menu.member); onClose(); }}
      style={{padding:'7px 11px', borderRadius:7, fontSize:12.5, color:'rgba(255,255,255,0.86)', cursor:'pointer', userSelect:'none'}}
      onMouseEnter={e => { e.currentTarget.style.background='rgba(255,255,255,0.07)'; }}
      onMouseLeave={e => { e.currentTarget.style.background='transparent'; }}>
      {label}
    </div>
  );
  return ReactDOM.createPortal(
    <div ref={ref} style={{
      position:'fixed', left: pos.x, top: pos.y, minWidth: 180,
      opacity: pos.ready ? 1 : 0,
      background:'rgba(24,24,24,0.97)',
      backdropFilter:'blur(14px)', WebkitBackdropFilter:'blur(14px)',
      border:'1px solid rgba(255,255,255,0.055)',
      borderRadius:10, padding:4, zIndex:9998,
      boxShadow:'0 12px 36px rgba(0,0,0,0.55)',
    }}>
      <Item label={t('room_kick')} onClick={busy && busy.mod ? undefined : onKick}/>
      <Item label={t('room_ban')} onClick={busy && busy.mod ? undefined : onBan}/>
      <Item label={t('room_transfer')} onClick={busy && busy.mod ? undefined : onTransfer}/>
    </div>,
    document.body
  );
}

/* ── Presence (online users) ─────────────────────────────────────────────── */
function PresenceUserMenu({ menu, onClose, onOpenProfile, onInvite, onBlock, onUnblock, onToggleFriend, isFriend, isBlocked }) {
  const ref = useRef(null);
  const [pos, setPos] = useState({ x: menu.x, y: menu.y, ready: false });
  const t = useLang();
  useLayoutEffect(() => {
    const el = ref.current;
    if (!el) return;
    const w = el.offsetWidth, h = el.offsetHeight, PAD = 8;
    let x = menu.x, y = menu.y;
    if (x + w > window.innerWidth - PAD) x = window.innerWidth - w - PAD;
    if (y + h > window.innerHeight - PAD) y = window.innerHeight - h - PAD;
    if (x < PAD) x = PAD;
    if (y < PAD) y = PAD;
    setPos({ x, y, ready: true });
  }, [menu.x, menu.y]);
  useEffect(() => {
    const onDown = (e) => {
      if (e.button === 2) return;
      if (!ref.current || ref.current.contains(e.target)) return;
      onClose();
    };
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('mousedown', onDown, true);
    document.addEventListener('keydown', onKey);
    return () => {
      document.removeEventListener('mousedown', onDown, true);
      document.removeEventListener('keydown', onKey);
    };
  }, [onClose]);
  const Item = ({ label, onClick, disabled, danger }) => (
    <div onClick={disabled ? null : () => { onClick?.(menu.peer); onClose(); }}
      style={{
        padding:'7px 11px', borderRadius:7, fontSize:12.5,
        color: disabled ? 'rgba(255,255,255,0.25)' : danger ? 'rgba(255,140,140,0.9)' : 'rgba(255,255,255,0.86)',
        cursor: disabled ? 'default' : 'pointer', userSelect:'none',
      }}
      onMouseEnter={e => { if (!disabled) e.currentTarget.style.background='rgba(255,255,255,0.07)'; }}
      onMouseLeave={e => { e.currentTarget.style.background='transparent'; }}>
      {label}
    </div>
  );
  const profile = menu.peer?.profile;
  return ReactDOM.createPortal(
    <div ref={ref} style={{
      position:'fixed', left: pos.x, top: pos.y, minWidth: 196,
      opacity: pos.ready ? 1 : 0,
      background:'rgba(24,24,24,0.97)',
      backdropFilter:'blur(14px)', WebkitBackdropFilter:'blur(14px)',
      border:'1px solid rgba(255,255,255,0.055)',
      borderRadius:10, padding:4, zIndex:9999,
      boxShadow:'0 12px 36px rgba(0,0,0,0.55)',
    }}>
      <Item label={t('presence_open_profile')} disabled={!profile} onClick={onOpenProfile}/>
      <Item label={isFriend ? t('remove_friend') : t('add_friend')} onClick={onToggleFriend}/>
      <Item label={t('presence_invite')} onClick={onInvite}/>
      <Item label={t('crate_create')} onClick={(p) => { try { window.__aoiAddCrate?.(p); } catch(_){} }}/>
      {isBlocked
        ? <Item label={t('presence_unblock')} onClick={onUnblock}/>
        : <Item label={t('presence_block')} onClick={onBlock} danger/>}
    </div>,
    document.body
  );
}

function SharedCrateView({ open, items, myUid, onBack, onPlayTrack, onRemoveItem, onClear, onAddCurrent, activeId, loadingTrackId, errorTrackId, hideDividers, likedIds, onLike, onContextMenu, dockTrack, dockPlaying, progressRef, onDockToggle, onDockPrev, onDockNext, onDockOpen, onDockSeek }) {
  const t = useLang();
  const onBackRef = useRef(onBack);
  onBackRef.current = onBack;
  useEffect(() => {
    if (!open) return;
    const onKey = (e) => {
      if (e.key !== 'Escape') return;
      e.stopPropagation();
      onBackRef.current?.();
    };
    // defer so the opening click / menu Escape cannot instantly dismiss
    const tid = setTimeout(() => document.addEventListener('keydown', onKey, true), 80);
    return () => { clearTimeout(tid); document.removeEventListener('keydown', onKey, true); };
  }, [open]);
  if (!open) return null;
  const list = items || [];
  const dockOn = !!(dockTrack && dockTrack.title);
  const dockBar = dockOn ? (
    <SourceDeckPlayer
      track={dockTrack}
      isPlaying={dockPlaying}
      progressRef={progressRef}
      onToggle={onDockToggle}
      onPrev={onDockPrev}
      onNext={onDockNext}
      onOpen={onDockOpen}
      onSeek={onDockSeek}
    />
  ) : null;
  return ReactDOM.createPortal(
    <div
      onMouseDown={e => e.stopPropagation()}
      onClick={e => e.stopPropagation()}
      style={{ position:'fixed', inset:0, zIndex:9850, background:'rgba(8,8,12,0.98)', display:'flex', flexDirection:'column' }}>
      <div style={{ display:'flex', alignItems:'center', gap:12, padding:'22px 28px 14px', flexShrink:0, borderBottom:'1px solid rgba(255,255,255,0.05)' }}>
        <div onClick={onBack} title={t('back')} style={{
          width:32, height:32, borderRadius:9, cursor:'pointer',
          display:'flex', alignItems:'center', justifyContent:'center',
          background:'rgba(255,255,255,0.04)', color:'rgba(255,255,255,0.7)',
        }}>
          <svg width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2.2" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
        </div>
        <div style={{ flex:1, minWidth:0 }}>
          <div style={{ fontSize:16, fontWeight:700, color:'rgba(255,255,255,0.88)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>
            {t('crate_title')}
          </div>
          <div style={{ fontSize:11, color:'rgba(255,255,255,0.35)', marginTop:2 }}>
            {t('crate_shared_with').replace('{name}', open.friendName || 'friend')} · {list.length}
          </div>
        </div>
        <div onClick={onAddCurrent} style={{
          fontSize:12, color:'rgba(255,255,255,0.7)', cursor:'pointer',
          background:'rgba(255,255,255,0.06)', borderRadius:8, padding:'6px 12px', flexShrink:0,
        }}>{t('crate_add_current')}</div>
        {list.length > 0 && (
          <div onClick={onClear} style={{
            fontSize:11, color:'rgba(255,80,80,0.75)', cursor:'pointer', padding:'6px 10px', flexShrink:0,
          }}>{t('crate_clear')}</div>
        )}
      </div>
      <div className="scroll-thin" style={{ flex:1, overflowY:'auto', padding:'12px 28px', paddingBottom: dockOn ? 108 : 28 }}>
        {list.length === 0 ? (
          <div style={{ fontSize:13, color:'rgba(255,255,255,0.32)', padding:'48px 0', textAlign:'center', lineHeight:1.6 }}>
            {t('crate_empty')}<br/>
            <span style={{ fontSize:12, opacity:0.7 }}>{t('crate_add_current')}</span>
          </div>
        ) : (
          list.map((tr, i) => (
            <div key={(tr.id || i) + '-scrate'} style={{ display:'flex', alignItems:'center', gap:8 }}>
              <div style={{ flex:1, minWidth:0 }}>
                <SearchTrackRow
                  track={tr}
                  isLiked={likedIds?.has(tr.id) || likedIds?.has(String(tr.id))}
                  onLike={tr?.id && onLike ? () => onLike(tr) : undefined}
                  onClick={() => onPlayTrack?.(tr, list)}
                  onCoverClick={() => onPlayTrack?.(tr, list)}
                  isActive={activeId != null && String(activeId) === String(tr.id)}
                  isLoading={loadingTrackId === tr.id}
                  isError={errorTrackId === tr.id}
                  hideDividers={hideDividers}
                  onContextMenu={onContextMenu}
                />
                {tr.byName && String(tr.byUid) !== String(myUid) && (
                  <div style={{ fontSize:10, color:'rgba(255,255,255,0.22)', margin:'-4px 0 8px 52px' }}>
                    {tr.byName}
                  </div>
                )}
              </div>
              <div onClick={() => onRemoveItem?.(tr)}
                title={t('crate_remove')}
                style={{ fontSize:16, color:'rgba(255,255,255,0.22)', cursor:'pointer', padding:'0 8px', flexShrink:0 }}>×</div>
            </div>

}

function OnlinePanel({ open, onClose, peers, selfToken, blocked, onUserMenu, presenceEnabled, onToggleVisible, friends, sharedCrates, onOpenSharedCrate, onUnblock }) {
  const t = useLang();
  useEffect(() => {
    if (!open) return;
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [open, onClose]);
  if (!open) return null;
  const visible = (peers || []).filter(p => !isPresenceBlocked(p, blocked));
  const friendKeys = new Set((friends || []).map(f => window.AoiNight?.peerKey?.(f) || ''));
  const friendPeers = visible.filter(p => friendKeys.has(window.AoiNight?.peerKey?.(p) || ''));
  const otherPeers = visible.filter(p => !friendKeys.has(window.AoiNight?.peerKey?.(p) || ''));
  return ReactDOM.createPortal(
    <div style={{ position:'fixed', inset:0, zIndex:9800, pointerEvents:'auto' }}
      onMouseDown={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div style={{
        position:'absolute', top:0, right:0, bottom:0, width:'min(360px, 92vw)',
        background:'rgba(12,12,16,0.98)',
        borderLeft:'1px solid rgba(255,255,255,0.06)',
        boxShadow:'-16px 0 48px rgba(0,0,0,0.45)',
        display:'flex', flexDirection:'column',
        animation:'onlinePanelIn 0.28s cubic-bezier(0.22,1,0.36,1)',

        <div style={{ padding:'22px 20px 14px', borderBottom:'1px solid rgba(255,255,255,0.05)', flexShrink:0 }}>
          <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', gap:12 }}>
            <div>
              <div style={{ fontSize:16, fontWeight:600, letterSpacing:'-0.02em', color:'rgba(255,255,255,0.9)' }}>{t('presence_list_title')}</div>
              <div style={{ fontSize:12, color:'rgba(255,255,255,0.32)', marginTop:4 }}>{t('presence_list_sub')}</div>
            </div>
            <div onClick={onClose} title={t('close') || '×'} style={{
              width:28, height:28, borderRadius:8, cursor:'pointer', flexShrink:0,
              display:'flex', alignItems:'center', justifyContent:'center',
              color:'rgba(255,255,255,0.35)', fontSize:18, lineHeight:1,
            }}>×</div>
          </div>
        </div>
        <div className="scroll-thin" style={{ flex:1, overflowY:'auto', padding:'10px 12px 16px' }}>
          {(sharedCrates || []).length > 0 && (
            <div style={{ marginBottom:14 }}>
              <div style={{ fontSize:10, letterSpacing:'0.08em', textTransform:'uppercase', color:'rgba(255,255,255,0.32)', margin:'4px 8px 8px' }}>{t('crate_title')}</div>
              {(sharedCrates || []).map((box) => (
                <div key={'sc-' + (box.pairKey || box.friendUid)}
                  onClick={() => onOpenSharedCrate?.({ friendUid: box.friendUid, friendName: box.friendName })}
                  style={{ display:'flex', alignItems:'center', gap:10, padding:'10px 10px', borderRadius:10, marginBottom:3, cursor:'pointer', background:'rgba(255,255,255,0.03)' }}
                  onMouseEnter={e => e.currentTarget.style.background='rgba(255,255,255,0.06)'}
                  onMouseLeave={e => e.currentTarget.style.background='rgba(255,255,255,0.03)'}>
                  <div style={{ width:36, height:36, borderRadius:10, background:'rgba(255,255,255,0.06)', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0, fontSize:14, color:'rgba(255,255,255,0.45)' }}>♪</div>
                  <div style={{ minWidth:0, flex:1 }}>
                    <div style={{ fontSize:12.5, color:'rgba(255,255,255,0.85)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>
                      {t('crate_from').replace('{name}', box.friendName || 'friend')}

                    <div style={{ fontSize:11, color:'rgba(255,255,255,0.32)', marginTop:2 }}>{(box.items || []).length} {(box.items || []).length === 1 ? 'track' : 'tracks'}</div>

              )}
              {friendPeers.map(p => {
                const mine = p.token && p.token === selfToken;
                const activity = presenceActivityLabel(p, t);
                const uid = p.uid || '';
                const box = (sharedCrates || []).find(b => String(b.friendUid) === String(uid));
                const n = box?.items?.length || 0;
                return (
                  <div key={'f-'+(p.token || p.uid || p.name)}

              {otherPeers.length > 0 && (
                <div style={{ fontSize:10, letterSpacing:'0.08em', textTransform:'uppercase', color:'rgba(255,255,255,0.32)', margin:'12px 8px 8px' }}>{t('online_section')}</div>
              )}
              {otherPeers.map(p => {
            const mine = p.token && p.token === selfToken;
            const activity = presenceActivityLabel(p, t);
            return (
              <div key={p.token || p.uid || p.name}
                onContextMenu={e => { e.preventDefault(); onUserMenu?.(p, e.clientX, e.clientY); }}
                style={{
                  display:'flex', alignItems:'center', gap:12,
                  padding:'10px 10px', borderRadius:12, marginBottom:4,
                  background: mine ? 'rgba(var(--accent-rgb),0.08)' : 'transparent',
                  cursor:'context-menu', userSelect:'none',
                }}
                onMouseEnter={e => { if (!mine) e.currentTarget.style.background='rgba(255,255,255,0.04)'; }}
                onMouseLeave={e => { e.currentTarget.style.background = mine ? 'rgba(var(--accent-rgb),0.08)' : 'transparent'; }}>
                <RoomAvatar src={p.avatar} size={40} radius={11}/>
                <div style={{ minWidth:0, flex:1 }}>
                  <div style={{ fontSize:13.5, fontWeight:600, color:'rgba(255,255,255,0.88)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>
                    {p.name || 'friend'}{mine ? ' · ' + t('presence_you') : ''}
                  </div>
                  <div style={{
                    fontSize:11.5, marginTop:3, lineHeight:1.35,
                    color: p.status === 'listening' ? 'rgba(var(--accent-rgb),0.85)' : 'rgba(255,255,255,0.34)',
                    overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap',
                  }}>{activity}</div>
                </div>
                <div style={{
                  width:7, height:7, borderRadius:99, flexShrink:0,
                  background: p.status === 'afk' ? 'rgba(255,255,255,0.22)' : '#4ade80',
                  boxShadow: p.status === 'afk' ? 'none' : '0 0 8px rgba(74,222,128,0.45)',
                }}/>
              </div>
            );
          })}
              {(blocked || []).length > 0 && (
                <div style={{ marginTop:12 }}>
                  <div style={{ fontSize:10, letterSpacing:'0.08em', textTransform:'uppercase', color:'rgba(255,255,255,0.32)', margin:'4px 8px 8px' }}>{t('presence_blocked_section')}</div>
                  {(blocked || []).map((b, i) => (
                    <div key={'blk-'+(b.key || i)}
                      style={{
                        display:'flex', alignItems:'center', gap:12,
                        padding:'10px 10px', borderRadius:12, marginBottom:4,
                        background:'rgba(255,80,80,0.04)',
                      }}>
                      <div style={{ minWidth:0, flex:1 }}>
                        <div style={{ fontSize:13, color:'rgba(255,255,255,0.55)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{b.name || 'user'}</div>
                      </div>
                      <div onClick={() => onUnblock?.(b)}
                        style={{ fontSize:11, color:'rgba(255,255,255,0.45)', cursor:'pointer', padding:'4px 8px', borderRadius:7, background:'rgba(255,255,255,0.05)', flexShrink:0 }}>
                        {t('presence_unblock')}
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </>
          )}
        </div>
        <div style={{
          padding:'12px 16px 18px', borderTop:'1px solid rgba(255,255,255,0.05)', flexShrink:0,

          <div onClick={() => onToggleVisible?.(!presenceEnabled)} style={{
            display:'flex', alignItems:'center', justifyContent:'space-between', gap:10,
            padding:'10px 12px', borderRadius:10, cursor:'pointer',
            background:'rgba(255,255,255,0.03)',

              <div style={{ fontSize:12.5, color:'rgba(255,255,255,0.78)' }}>{t('presence_show_me')}</div>
              <div style={{ fontSize:10.5, color:'rgba(255,255,255,0.28)', marginTop:2 }}>{t('presence_show_me_sub')}</div>
            </div>
            <div style={{
              width:34, height:20, borderRadius:99, flexShrink:0, position:'relative',
              background: presenceEnabled ? 'rgba(var(--accent-rgb),0.55)' : 'rgba(255,255,255,0.1)',
              transition:'background 0.2s ease',
            }}>
              <div style={{
                position:'absolute', top:2, left: presenceEnabled ? 16 : 2,
                width:16, height:16, borderRadius:99, background:'#fff',
                transition:'left 0.2s ease',

            </div>
          </div>
        </div>
      </div>
    </div>,
    document.body
  );
}

function Sidebar({ navActive, onNav, libCollapsed, onToggleLib, inPlayer, scAuth, profileRef, sourceMode, onToggleSource, avatarFlying, roomLive, dock, uiShow, libPinned }) {
  const t = useLang();
  const show = (k) => uiShow?.[k] !== false;
  const NAV = [
    show('navHome') && { id:"home",      label:t('nav_tracks'),    icon: <LineIcon><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></LineIcon> },
    show('navPlaylists') && { id:"playlists", label:t('nav_playlists'), icon: <CdIcon size={16}/> },
    show('navSearch') && { id:"search",    label:t('nav_search'),    icon: <LineIcon><circle cx="11" cy="11" r="7"/><path d="m20 20-3-3"/></LineIcon> },
    show('navPlayer') && { id:"library",   label:t('nav_player'),    icon: <LineIcon><path d="M7 4.5v15l13-7.5z"/></LineIcon> },
  ].filter(Boolean);
  const folderIcon = <LineIcon><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></LineIcon>;

  const navRefs = useRef({});
  const [pillRect, setPillRect] = useState({ top: 0, left: 0, width: 38, height: 38, visible: false });
  const horizontal = dock === 'top';

  useLayoutEffect(() => {
    const el = navRefs.current[navActive];
    if (!el || !['home', 'search', 'library', 'playlists'].includes(navActive)) {
      setPillRect(p => ({ ...p, visible: false }));
      return;
    }
    if (horizontal) {
      setPillRect({ top: 0, left: el.offsetLeft, width: el.offsetWidth, height: el.offsetHeight, visible: true });
    } else {
      setPillRect({ top: el.offsetTop, left: 0, width: el.offsetWidth, height: el.offsetHeight, visible: true });
    }
  }, [navActive, inPlayer, scAuth, horizontal, NAV.length]);

  const scActive = navActive === 'soundcloud';

  const queueToggleBtn = show('queuePanel') && !libPinned && (
    <div style={{
      display:'flex', flexDirection: horizontal ? 'row' : 'column', alignItems:'center',
      overflow:'hidden',
      maxHeight: horizontal ? 38 : (inPlayer ? 48 : 0),
      maxWidth: horizontal ? (inPlayer ? 44 : 0) : 38,
      opacity: inPlayer ? 1 : 0,

        width:32, height:32, flexShrink:0, cursor:'pointer',

        onMouseLeave={e=>e.currentTarget.style.color='rgba(255,255,255,0.3)'}
      >
        <svg width="13" height="13" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"
          style={{transition:'transform 0.26s cubic-bezier(0.4,0,0.2,1)', transform: libCollapsed ? 'rotate(180deg)' : 'rotate(0deg)'}}>
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </div>
    </div>
  );

  const navCluster = (
    <div style={{position:'relative', display:'flex', flexDirection: horizontal ? 'row' : 'column', alignItems:'center', gap: horizontal ? 2 : 6}}>
      <div style={{
        position:'absolute',
        left: horizontal ? 0 : '50%',
        top: horizontal ? '50%' : 0,
        width: pillRect.width || 38,
        height: pillRect.height || 38,
        transform: horizontal
          ? `translate(${pillRect.left}px, -50%)`
          : `translate(-50%, ${pillRect.top}px)`,
        background:'rgba(178,178,178,0.11)', borderRadius:11,
        opacity: pillRect.visible ? 1 : 0,
        transition:'transform 0.34s cubic-bezier(0.45,0,0.55,1), opacity 0.18s ease, width 0.2s ease',
        willChange:'transform', pointerEvents:'none', zIndex:0,
      }}/>

/* ── CrossfadeSlider ─────────────────────────────────────────────────────── */
function CrossfadeSlider({ value, onChange }) {
  const t = useLang();
  const trackRef    = useRef(null);
  const onChangeRef = useRef(onChange);
  const valueRef    = useRef(value);
  const dragging    = useRef(false);
  const [live, setLive] = useState(null);
  onChangeRef.current = onChange;
  valueRef.current    = live != null ? live : (value || 0);

  const calcVal = (clientX) => {
    const el = trackRef.current;
    if (!el) return valueRef.current;
    const rect = el.getBoundingClientRect();
    if (!rect.width) return valueRef.current;
    return Math.round(Math.max(0, Math.min(1, (clientX - rect.left) / rect.width)) * 12);
  };

  useEffect(() => {
    const onMove = e => {
      if (!dragging.current) return;
      const v = calcVal(e.clientX);
      valueRef.current = v;
      setLive(v);
    };
    const onUp = e => {
      if (!dragging.current) return;
      dragging.current = false;
      const v = calcVal(e.clientX);
      setLive(null);
      onChangeRef.current(v);
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
    return () => {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    };
  }, []);

  useEffect(() => {
    const el = trackRef.current;
    if (!el) return;
    const onWheel = e => {
      e.preventDefault();
      onChangeRef.current(Math.max(0, Math.min(12, valueRef.current + (e.deltaY > 0 ? -1 : 1))));
    };
    el.addEventListener('wheel', onWheel, { passive: false });
    return () => el.removeEventListener('wheel', onWheel);
  }, []);

  const shown = live != null ? live : (value || 0);
  const pct = (shown / 12) * 100;

  return (
    <div style={{display:'flex', alignItems:'center', gap:12}}>
      <div ref={trackRef}
        style={{width:150, height:24, display:'flex', alignItems:'center', cursor:'ew-resize', userSelect:'none', touchAction:'none'}}
        onMouseDown={e => {
          dragging.current = true;
          const v = calcVal(e.clientX);
          valueRef.current = v;
          setLive(v);
        }}>
        <div className="aoi-xfade">
          <div className="aoi-xfade-a" style={{ width: pct > 0 ? `${Math.max(18, 100 - pct * 0.45)}%` : '0%' }}/>
          <div className="aoi-xfade-b" style={{ width: pct > 0 ? `${Math.max(18, pct * 0.7)}%` : '0%' }}/>
        </div>
      </div>
      <span style={{fontSize:12, color:'rgba(255,255,255,0.32)', minWidth:28, textAlign:'right'}}>
        {shown === 0 ? t('off') : `${shown} ${t('sec')}`}
      </span>
    </div>
  );
}

function ClearCacheCard({ Card, Row, onClearCoversCache, onClearLikesCache }) {
  const t = useLang();

    <div onClick={onClick} style={{fontSize:12, color:'rgba(255,80,80,0.8)', cursor:'pointer', background:'rgba(255,80,80,0.08)', borderRadius:7, padding:'5px 14px'}}>

      {t('cancel')}
    </div>
  );
  return (
    <Card title={t('cache')}>
      <Row label={t('covers_cache')} sub={t('covers_cache_sub')}>
        {confirmCovers ? (
          <div style={{display:'flex', gap:8, flexShrink:0}}>

        {confirmLikes ? (

/* ── AvatarFlyClone ──────────────────────────────────────────────────────── */
function AvatarFlyClone({ fly, exiting }) {
  const { avatarUrl, startRect: s, targetRect: t } = fly;
  const dx = (s.left + s.width/2)  - (t.left + t.width/2);
  const dy = (s.top  + s.height/2) - (t.top  + t.height/2);
  const sc = s.width / t.width;
  const [ready, setReady] = useState(false);
  useEffect(() => { requestAnimationFrame(() => requestAnimationFrame(() => setReady(true))); }, []);
  return ReactDOM.createPortal(
    <div style={{
      position:'fixed', left:t.left, top:t.top,
      width:t.width, height:t.height, borderRadius:12,
      overflow:'hidden', zIndex:970, pointerEvents:'none',
      transformOrigin:'center center',
      transform: ready ? 'translate(0,0) scale(1)' : `translate(${dx}px,${dy}px) scale(${sc})`,
      opacity: exiting ? 0 : 1,
      transition: ready ? 'transform 0.38s cubic-bezier(0.22,1,0.36,1), opacity 0.12s ease' : 'none',
    }}>
      <img src={avatarUrl} style={{width:'100%',height:'100%',objectFit:'cover'}}/>
    </div>,
    document.body
  );
}

/* ── SourceDeckPlayer — compact dock for shared crate ───────────────────── */
function SourceDeckPlayer({ track, isPlaying, progressRef, onToggle, onPrev, onNext, onOpen, onSeek }) {
  const t = useLang();
  const [, setTick] = useState(0);
  useEffect(() => {
    let raf;
    const loop = () => { setTick(n => n + 1); raf = requestAnimationFrame(loop); };
    raf = requestAnimationFrame(loop);
    return () => cancelAnimationFrame(raf);
  }, []);
  if (!track || !track.title) return null;
  const prog = Math.max(0, Math.min(1, progressRef?.current || 0));
  const dur = Number(track.duration) || 0;
  const curSec = dur > 0 ? prog * dur : 0;
  return (
    <div style={{
      position:'absolute', left:0, right:0, bottom:0, zIndex:4,
      padding:'10px 16px 14px',
      background:'linear-gradient(180deg, transparent 0%, rgba(7,7,10,0.92) 28%, rgba(7,7,10,0.98) 100%)',
      borderTop:'1px solid rgba(255,255,255,0.05)',
      backdropFilter:'blur(12px)',
    }}>
      <div style={{ display:'flex', alignItems:'center', gap:12, marginBottom:8 }}>
        <div onClick={onOpen} style={{
          width:44, height:44, borderRadius:8, overflow:'hidden', flexShrink:0, cursor:'pointer', background:'#111116',
        }}>
          {track.coverUrl
            ? <img src={track.coverUrl} style={{ width:'100%', height:'100%', objectFit:'cover' }}/>
            : <img src="./assets/note.png" style={{ width:18, height:18, margin:'13px', filter:'brightness(0) invert(1)', opacity:0.2 }}/>}
        </div>
        <div onClick={onOpen} style={{ flex:1, minWidth:0, cursor:'pointer' }}>
          <div style={{ fontSize:13, fontWeight:600, color:'rgba(255,255,255,0.9)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{track.title}</div>
          <div style={{ fontSize:11, color:'rgba(255,255,255,0.34)', marginTop:2, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{track.artist || ''}</div>
        </div>
        <div style={{ display:'flex', alignItems:'center', gap:6, flexShrink:0 }}>
          <div onClick={onPrev} style={{ width:30, height:30, borderRadius:8, display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', color:'rgba(255,255,255,0.55)' }}>
            <svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
          </div>
          <div onClick={onToggle} style={{
            width:36, height:36, borderRadius:999, display:'flex', alignItems:'center', justifyContent:'center',
            cursor:'pointer', background:'rgba(255,255,255,0.1)', color:'rgba(255,255,255,0.92)',
          }}>
            {isPlaying
              ? <svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg>
              : <svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24" style={{ marginLeft:2 }}><polygon points="5,3 19,12 5,21"/></svg>}
          </div>
          <div onClick={onNext} style={{ width:30, height:30, borderRadius:8, display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', color:'rgba(255,255,255,0.55)' }}>
            <svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24"><path d="M16 18h2V6h-2zM6 18l8.5-6L6 6z"/></svg>
          </div>
        </div>
      </div>
      <div onClick={e => {
        const rect = e.currentTarget.getBoundingClientRect();
        const x = (e.clientX - rect.left) / rect.width;
        onSeek?.(Math.max(0, Math.min(1, x)));
      }} style={{ height:4, borderRadius:999, background:'rgba(255,255,255,0.08)', cursor:'pointer', overflow:'hidden' }}>
        <div style={{ width:`${prog * 100}%`, height:'100%', background:'rgba(var(--accent-rgb),0.85)', borderRadius:999 }}/>
      </div>
      <div style={{ display:'flex', justifyContent:'space-between', marginTop:5, fontSize:10, color:'rgba(255,255,255,0.28)', fontVariantNumeric:'tabular-nums' }}>
        <span>{fmt(curSec)}</span>
        <span>{dur > 0 ? fmt(dur) : ''}</span>
      </div>
    </div>
  );
}

/* ── SearchTrackRow ──────────────────────────────────────────────────────── */
function SearchTrackRow({ track, isLiked, onLike, onClick, onCoverClick, isLoading, isError, hideDividers, onContextMenu, isActive }) {
  const t = useLang();
  const [hov, setHov] = useState(false);
  const lc = fmtCount(track.likesCount);
  const pc = fmtCount(track.playCount);
  return (
    <motion.div onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}
      onContextMenu={e => {
        if (!onContextMenu) return;
        e.preventDefault();
        e.stopPropagation();
        onContextMenu(track, e.clientX, e.clientY);
      }}
      layout
      initial={{ opacity: 0, height: 0 }}
      animate={{ opacity: isError ? 0.55 : 1, height: 'auto' }}
      exit={{ opacity: 0, height: 0, marginTop: 0, marginBottom: 0 }}
      transition={{ type: 'spring', stiffness: 380, damping: 34, mass: 0.6 }}
      style={{
        display:'flex', alignItems:'center', gap:12, padding:'7px 0',
        borderBottom: hideDividers ? 'none' : '1px solid rgba(255,255,255,0.032)',
        overflow:'hidden',
        background: isActive ? 'rgba(var(--accent-rgb),0.06)' : 'transparent',
        borderRadius: isActive ? 8 : 0,
      }}>
      {/* cover */}
      <div onClick={e=>{e.stopPropagation(); if(!isLoading) onCoverClick?.();}} style={{
        width:44, height:44, borderRadius:8, flexShrink:0,
        background:'#111116', overflow:'hidden', position:'relative',
        cursor: isLoading ? 'default' : 'pointer',
      }}>
        {track.coverUrl && <img src={track.coverUrl} loading="lazy" decoding="async" style={{position:'absolute',inset:0,width:'100%',height:'100%',objectFit:'cover'}}
          onError={e=>{e.currentTarget.style.display='none'}}/>}
        {isLoading
          ? <div style={{position:'absolute',inset:0,background:'rgba(0,0,0,0.55)',display:'flex',alignItems:'center',justifyContent:'center'}}>
