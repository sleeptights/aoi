window.addEventListener('error', function (e) {
  var root = document.getElementById('root');
  if (!root) return;
  root.innerHTML = '<div style="color:#ff8a8a;padding:28px 32px;font-size:13px;line-height:1.5;white-space:pre-wrap">' +
    String(e.message || 'error') + '\n' + String(e.filename || '') + ':' + String(e.lineno || '') +
    '</div>';
});
document.addEventListener('contextmenu', function (e) {
  e.preventDefault();
}, true);
/* F5 / Ctrl+R — reload UI without rebuilding (works in `.\dev.ps1`) */
window.addEventListener('keydown', function (e) {
  if (e.key === 'F5' || ((e.ctrlKey || e.metaKey) && !e.shiftKey && String(e.key).toLowerCase() === 'r')) {
    e.preventDefault();
    location.reload();
  }
}, true);

<script type="text/babel">
if (window.appInfo?.name) document.title = window.appInfo.name;
const { useState, useEffect, useLayoutEffect, useRef, useCallback, useMemo } = React;
const { motion, AnimatePresence, LayoutGroup } = Motion;

/* ── accent presets ──────────────────────────────────────────────────────── */
const ACCENT_PRESETS = {
  default:  { r: 178, g: 178, b: 178 },
  lavender: { r: 155, g: 125, b: 255 },
  mint:     { r: 130, g: 220, b: 195 },
  rose:     { r: 255, g: 145, b: 175 },
  amber:    { r: 255, g: 178, b: 100 },
};

const EQ_BANDS = [60, 150, 400, 1000, 3000, 8000];
const EQ_LABELS = ['60', '150', '400', '1k', '3k', '8k'];
const EQ_ZERO = [0, 0, 0, 0, 0, 0];
const EQ_PRESETS = {
  flat:       EQ_ZERO,
  bass:       [7, 5, 1, 0, -1, -2],
  vocal:      [-2, -1, 2, 5, 4, 1],
  treble:     [-3, -2, 0, 2, 5, 7],
  electronic: [5, 3, -2, 1, 3, 4],
  acoustic:   [3, 1, 0, 2, 2, 3],
};
function eqSame(a, b) {
  const x = a || EQ_ZERO, y = b || EQ_ZERO;
  return x.length === y.length && x.every((v, i) => Math.abs(v - (y[i] || 0)) < 0.08);
}
function eqIdOf(gains, custom) {
  for (const k of Object.keys(EQ_PRESETS)) if (eqSame(gains, EQ_PRESETS[k])) return k;
  for (const c of custom || []) if (c && eqSame(gains, c.gains)) return 'u:' + c.name;
  return 'custom';
}

function resumeEqCtx(ref) {
  const ctx = ref && ref.current;
  if (!ctx || ctx.state === 'running') return Promise.resolve();
  return ctx.resume().catch(() => {});
}

/* ── aoi mark (SVG — micro grid at ≤22px, full bars when large) ──────────── */
function AoiMark({ size = 14, radius, style }) {
  const r = radius ?? Math.max(3, Math.round(size * 0.22));
  const micro = size <= 22;
  return (
    <svg className="aoi-mark" width={size} height={size}
      viewBox={micro ? '0 0 14 14' : '0 0 256 256'} fill="none"
      shapeRendering="geometricPrecision"
      style={{ display:'block', flexShrink:0, borderRadius:r, overflow:'hidden', ...style }} aria-hidden="true">
      {micro ? (
        <>
          <rect width="14" height="14" fill="#07070a"/>
          <g fill="#ededf4">
            <rect x="2" y="6" width="2" height="6" rx="1"/>
            <rect x="6" y="2" width="2" height="10" rx="1"/>
            <rect x="10" y="4" width="2" height="8" rx="1"/>
          </g>
        </>
      ) : (
        <>
          <rect width="256" height="256" fill="#07070a"/>
          <g fill="#ededf4">
            <rect x="36.57" y="109.71" width="36.57" height="109.71" rx="18.29"/>
            <rect x="109.71" y="36.57" width="36.57" height="182.86" rx="18.29"/>
            <rect x="182.86" y="73.14" width="36.57" height="146.29" rx="18.29"/>
          </g>
        </>
      )}
    </svg>
  );
}

/* ── color extraction ────────────────────────────────────────────────────── */
const _accentCache = new Map();
function extractAccentColor(url) {
  if (!url) return Promise.resolve(null);
  if (_accentCache.has(url)) return Promise.resolve(_accentCache.get(url));
  return new Promise((resolve) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    let done = false;
    const finish = (val) => { if (done) return; done = true; _accentCache.set(url, val); resolve(val); };
    img.onload = () => {
      try {
        const W = 32, H = 32;
        const canvas = document.createElement('canvas');
        canvas.width = W; canvas.height = H;
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(img, 0, 0, W, H);
        const { data } = ctx.getImageData(0, 0, W, H);

        // Try a series of relaxing filters; first non-empty wins.
        const passes = [
          { sat: 28, lumMin: 38, lumMax: 222, minCount: 3 },
          { sat: 14, lumMin: 22, lumMax: 235, minCount: 2 },
          { sat: 6,  lumMin: 12, lumMax: 244, minCount: 1 },
        ];

        const tryPass = (p) => {
          const buckets = new Map();
          for (let i = 0; i < data.length; i += 4) {
            const r = data[i], g = data[i+1], b = data[i+2];
            const max = Math.max(r,g,b), min = Math.min(r,g,b);
            const sat = max - min;
            const lum = (r + g + b) / 3;
            if (sat < p.sat || lum < p.lumMin || lum > p.lumMax) continue;
            const key = ((r>>5)<<10) | ((g>>5)<<5) | (b>>5);
            const e = buckets.get(key) || { c:0, r:0, g:0, b:0, s:0 };
            e.c++; e.r += r; e.g += g; e.b += b; e.s += sat;
            buckets.set(key, e);
          }
          let best = null;
          for (const e of buckets.values()) {
            const score = e.c * (e.s / e.c);
            if (!best || score > best.score) best = { ...e, score };
          }
          if (!best || best.c < p.minCount) return null;
          return {
            r: Math.round(best.r / best.c),
            g: Math.round(best.g / best.c),
            b: Math.round(best.b / best.c),
          };
        };

        let color = null;
        for (const p of passes) {
          color = tryPass(p);
          if (color) break;
        }

        // Last resort: weighted mean of all mid-luminance pixels (works on grayscale covers)
        if (!color) {
          let sr=0, sg=0, sb=0, n=0;
          for (let i = 0; i < data.length; i += 4) {
            const r = data[i], g = data[i+1], b = data[i+2];
            const lum = (r + g + b) / 3;
            if (lum < 18 || lum > 245) continue;
            sr += r; sg += g; sb += b; n++;
          }
          if (n > 0) color = { r: Math.round(sr/n), g: Math.round(sg/n), b: Math.round(sb/n) };
        }

        if (!color) { finish(null); return; }

        // Boost low-luminance colors so the glow & accent text stay visible
        let { r, g, b } = color;
        const lum = (r + g + b) / 3;
        if (lum < 90) {
          const k = 90 / Math.max(1, lum);
          r = Math.min(255, Math.round(r * k));
          g = Math.min(255, Math.round(g * k));
          b = Math.min(255, Math.round(b * k));
        }
        finish({ r, g, b });
      } catch { finish(null); }
    };
    img.onerror = () => finish(null);
    img.src = url;
  });
}

function smoothScroll(el, targetTop, duration) {
  const startTop = el.scrollTop;
  const delta    = targetTop - startTop;
  if (!delta) return;
  const t0 = performance.now();
  function ease(x) { return x < 0.5 ? 2*x*x : 1 - Math.pow(-2*x + 2, 2)/2; }
  function tick(now) {
    const p = Math.min((now - t0) / duration, 1);
    el.scrollTop = startTop + delta * ease(p);
    if (p < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}


function fmt(s) {
  const m = Math.floor(s/60), sec = Math.floor(s%60);
  return `${m}:${sec.toString().padStart(2,'0')}`;
}

function fmtCount(n) {
  if (!n) return null;
  if (n >= 1_000_000) return (n / 1_000_000).toFixed(1).replace(/\.0$/, '') + 'M';
  if (n >= 1_000) return (n / 1_000).toFixed(1).replace(/\.0$/, '') + 'K';
  return String(n);
}

function scHashColor(id) {
  let h = 0; const s = String(id);
  for (const c of s) h = ((h << 5) - h + c.charCodeAt(0)) | 0;
  return `hsl(${Math.abs(h) % 360},48%,38%)`;
}

function isHttpArtwork(url) {
  return !!url && /^https?:/i.test(String(url));
}

function scFailed(res) {
  const e = res && res.error;
  if (e === 0 || e === '0') return true;
  return e != null && e !== false && e !== '';
}

function mapScTrack(t, noTitle) {
  const progressive = t.media?.transcodings?.find(tc => tc.format?.protocol === 'progressive');
  const hls = t.media?.transcodings?.find(tc => tc.format?.protocol === 'hls');
  return {
    id: t.id,
    title: t.title || noTitle || '—',
    artist: t.publisher_metadata?.artist || t.user?.username || '',
    artistId: t.user?.id || null,
    artistAvatarUrl: t.user?.avatar_url || null,
    uploaderUsername: t.user?.username || null,
    duration: Math.floor((t.duration || 0) / 1000),
    color: scHashColor(t.id),
    coverUrl: t.artwork_url ? t.artwork_url.replace('-large', '-t500x500') : null,
    artworkUrl: t.artwork_url ? t.artwork_url.replace('-large', '-t500x500') : null,
    likesCount: t.likes_count || 0,
    playCount: t.playback_count || 0,
    streamUrl: progressive?.url || null,
    hlsUrl: hls?.url || null,
    permalinkUrl: t.permalink_url || null,
  };
}

function splitArtists(str) {
  if (!str) return [{ name: '', sep: null }];
  const re = /(\s*[&×,.]\s*|\s+(?:ft\.?|feat\.?|with|vs\.?)\s+)/gi;
  const raw = str.split(re);
  const result = [];
  for (let i = 0; i < raw.length; i += 2) {
    const name = raw[i]?.trim();
    const sep  = raw[i + 1] || null;
    if (name) result.push({ name, sep });
  }
  return result.length ? result : [{ name: str, sep: null }];
}

function parseDiscordAppId(raw) {
  const s = String(raw || '').trim();
  if (!s) return '';
  const fromUrl = s.match(/applications\/(\d{16,20})/);
  if (fromUrl) return fromUrl[1];
  const compact = s.replace(/\s/g, '');
  if (/^\d{16,20}$/.test(compact)) return compact;
  const digits = s.match(/\d{16,20}/);
  return digits ? digits[0] : '';
}

function isPublicHttps(url) {
  const u = String(url || '');
  return /^https:\/\//i.test(u) && !/localhost|127\.0\.0\.1/i.test(u);
}

function pickDiscordCover(track, extra) {
  const urls = [extra, track?.artworkUrl, track?.coverUrl];
  const raw = urls.find(isPublicHttps);
  if (!raw) return null;
  return String(raw)
    .replace('-large.', '-t500x500.')
    .replace('-t200x200.', '-t500x500.')
    .replace('-t50x50.', '-t500x500.');
}

function emptyRoomSlots() {
  return Array.from({ length: 8 }, (_, i) => ({ i, locked: false, member: null }));
}

function roomMemberKey(m) {
  if (!m) return '';
  if (m.uid) return 'u:' + String(m.uid);
  const name = String(m.name || '').trim().toLowerCase();
  if (name && name !== 'friend') return 'n:' + name;
  if (m.id) return 'i:' + String(m.id);
  return '';
}

function dedupeRoomMembers(list) {
  const out = [];
  const seen = new Set();
  for (const m of list || []) {
    if (!m) continue;
    const key = roomMemberKey(m);
    if (key && seen.has(key)) continue;
    if (key) seen.add(key);
    out.push(m);
  }
  return out;
}

function locksFromSlots(slots) {
  return (slots && slots.length === 8) ? slots.map(s => !!(s && s.locked)) : Array.from({ length: 8 }, () => false);
}

function applyLockOverlay(slots, locks) {
  const base = (slots && slots.length === 8) ? slots : emptyRoomSlots();
  if (!Array.isArray(locks) || locks.length !== 8) return base;
  return base.map((s, i) => ({ ...(s || { i, member: null, locked: false }), i, locked: !!locks[i] }));
}

function slotsFromRoom(room) {
  const members = dedupeRoomMembers(room && room.members || []);
  const prev = applyLockOverlay(
    (room && Array.isArray(room.slots) && room.slots.length === 8) ? room.slots : emptyRoomSlots(),
    room && room.locks
  );
  const slots = prev.map((s, i) => ({
    i,
    locked: (s && typeof s.locked === 'boolean') ? s.locked : false,
    member: null,
  }));
  const placed = new Set();
  for (const m of members) {
    const i = (m.slot != null && m.slot >= 0 && m.slot < 8) ? Number(m.slot) : -1;
    if (i >= 0 && !slots[i].member) {
      slots[i] = { i, locked: slots[i].locked, member: m };
      const key = roomMemberKey(m);
      if (key) placed.add(key);
    }
  }
  for (const m of members) {
    if (m.slot != null) continue;
    const key = roomMemberKey(m);
    if (key && placed.has(key)) continue;
    const i = slots.findIndex(s => !s.member && !s.locked);
    if (i < 0) break;
    slots[i] = { i, locked: slots[i].locked, member: { ...m, slot: i } };
    if (key) placed.add(key);
  }
  return slots;
}

function roomProfileOf(auth) {
  if (!auth) return { name: 'friend', avatar: '', uid: '' };
  const name = String(auth.username || auth.fullName || auth.full_name || auth.permalink || '').trim();
  const avatar = String(auth.avatarUrl || auth.avatar_url || '').trim();
  return {
    name: name || 'friend',
    avatar: /^https:\/\//i.test(avatar) ? avatar : '',
    uid: auth.userId != null ? String(auth.userId) : (auth.id != null ? String(auth.id) : ''),
  };
}

function pushRoomProfile(api, auth) {
  const p = roomProfileOf(auth);
  const client = api || (typeof window !== 'undefined' ? window.AoiRooms : null);
  if (!client || !p.name || p.name === 'friend') return false;
  const msg = { type: 'profile', name: p.name, uid: p.uid };
  if (p.avatar) msg.avatar = p.avatar;
  client.send(msg);
  return true;
}

function scProfileUrl(auth) {
  if (!auth) return '';
  const direct = String(auth.permalink_url || auth.permalinkUrl || '').trim();
  if (/^https:\/\/soundcloud\.com\//i.test(direct)) return direct.split('?')[0];
  const user = String(auth.username || auth.permalink || '').trim().replace(/^@/, '');
  if (user) return 'https://soundcloud.com/' + encodeURIComponent(user);
  return '';
}

function presencePeerKey(peer) {
  if (!peer) return '';
  if (peer.uid) return 'u:' + peer.uid;
  if (peer.token) return 't:' + peer.token;
  const n = String(peer.name || '').trim().toLowerCase();
  return n && n !== 'friend' ? 'n:' + n : '';
}

function isPresenceBlocked(peer, blocked) {
  const key = presencePeerKey(peer);
  if (!key || !Array.isArray(blocked)) return false;
  return blocked.some(b => b && (b.key === key || (peer.uid && b.uid === peer.uid) || (peer.token && b.token === peer.token)));
}

function presenceActivityLabel(peer, t) {
  if (!peer) return '';
  if (peer.status === 'listening' && peer.trackTitle) {
    const track = peer.trackArtist ? peer.trackArtist + ' — ' + peer.trackTitle : peer.trackTitle;
    return t('presence_listening').replace('{track}', track);
  }
  if (peer.status === 'afk') return t('presence_afk');
  return t('presence_idle');
}

function computePresenceStatus({ isPlaying, hasTrack, hidden, idleMs }) {
  if (isPlaying && hasTrack) return 'listening';
  if (hidden || idleMs > 4 * 60 * 1000) return 'afk';
  return 'idle';
}

function buildScShuffle(list, currentId) {
  const ids = list.map(t => t.id);
  const rest = currentId != null ? ids.filter(id => id !== currentId) : ids.slice();
  for (let i = rest.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [rest[i], rest[j]] = [rest[j], rest[i]];
  }
  return currentId != null ? [currentId, ...rest] : rest;
}

/* ── MarqueeText ─────────────────────────────────────────────────────────── */
function MarqueeText({ text, style, onClick, maxWidth }) {
  const outerRef = useRef(null);
  const [clipped, setClipped] = useState(false);
  const [showTip, setShowTip] = useState(false);
  const tipTimerRef = useRef(null);

  useLayoutEffect(() => {
    const el = outerRef.current;
    if (!el) return;
    setClipped(el.scrollWidth > el.clientWidth + 1);
  }, [text, maxWidth]);

  const onEnter = () => {
    if (!clipped) return;
    clearTimeout(tipTimerRef.current);
    tipTimerRef.current = setTimeout(() => setShowTip(true), 1200);
  };
  const onLeave = () => {
    clearTimeout(tipTimerRef.current);
    setShowTip(false);
  };
  useEffect(() => () => clearTimeout(tipTimerRef.current), []);

  return (
    <div style={{
      position:'relative',
      ...(maxWidth != null ? { width:'fit-content', maxWidth } : { flex:1, minWidth:0 }),
    }}>
      <div ref={outerRef} onClick={onClick}
        onMouseEnter={onEnter}
        onMouseLeave={onLeave}
        style={{
          overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap',
          textAlign:'center',
          cursor: onClick ? 'pointer' : 'default',
          ...style,
        }}>
        {text}
      </div>
      {showTip && (
        <div style={{
          position:'absolute', bottom:'calc(100% + 8px)', left:'50%',
          translate:'-50% 0',
          background:'rgba(18,18,24,0.97)',
          border:'1px solid rgba(255,255,255,0.06)',
          borderRadius:8, padding:'6px 12px',
          fontSize:13, whiteSpace:'nowrap',
          pointerEvents:'none', zIndex:1000,
          color:'rgba(255,255,255,0.78)',
          boxShadow:'0 6px 18px rgba(0,0,0,0.35)',
          animation:'fadeInUp 0.12s ease',
        }}>
          {text}
        </div>
      )}
    </div>
  );
}

/* ── Progress Bar ────────────────────────────────────────────────────────── */
function ProgressBar({ progressRef, total, onSeek, isPlaying, visible, accentRGB }) {
  const trackRef         = useRef(null);
  const fillRef          = useRef(null);
  const thumbRef         = useRef(null);
  const rafRef           = useRef(null);
  const progRef          = useRef(progressRef.current);
  const dispProg         = useRef(progressRef.current);
  const dragging         = useRef(false);
  const visibleRef       = useRef(visible);
  const elapsedSpanRef   = useRef(null);
  const remainingSpanRef = useRef(null);
  const totalRef         = useRef(total);
  totalRef.current = total;
  const isPlayingRef     = useRef(isPlaying);
  isPlayingRef.current = isPlaying;
  const [hover, setHover]   = useState(false);
  const [active, setActive] = useState(false);
  const [tip, setTip] = useState({ x: 0, t: 0, show: false });

  const drawRef = useRef(null);
  const kick = () => {
    if (visibleRef.current && rafRef.current == null && drawRef.current) {
      rafRef.current = requestAnimationFrame(drawRef.current);
    }
  };

  useEffect(() => {
    visibleRef.current = visible;
    if (visible) kick();
    else { cancelAnimationFrame(rafRef.current); rafRef.current = null; }
  }, [visible]);

  useEffect(() => { kick(); }, [isPlaying]);

  useEffect(() => {
    const draw = () => {
      progRef.current = progressRef.current;
      const diff = progRef.current - dispProg.current;
      if (!isPlayingRef.current && !dragging.current && Math.abs(diff) < 0.001) {
        dispProg.current = progRef.current;
      } else {
        dispProg.current += diff * 0.12;
      }
      const p = dispProg.current;
      if (fillRef.current)  fillRef.current.style.width = (p * 100).toFixed(3) + '%';
      if (thumbRef.current) thumbRef.current.style.left = (p * 100).toFixed(3) + '%';
      const dur = totalRef.current || 0;
      const de = Math.floor(p * dur);
      if (elapsedSpanRef.current)   elapsedSpanRef.current.textContent   = fmt(de);
      if (remainingSpanRef.current) remainingSpanRef.current.textContent = '-' + fmt(dur - de);
      if (!visibleRef.current) { rafRef.current = null; return; }
      if (!isPlayingRef.current && !dragging.current
          && Math.abs(progRef.current - dispProg.current) < 0.001) {
        rafRef.current = null; return;
      }
      rafRef.current = requestAnimationFrame(draw);
    };
    drawRef.current = draw;
    if (visibleRef.current) rafRef.current = requestAnimationFrame(draw);
    return () => { cancelAnimationFrame(rafRef.current); rafRef.current = null; };
  }, []);

  const getVal = (e) => {
    const rect = trackRef.current.getBoundingClientRect();
    return Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  };
  useEffect(() => {
    const onMove = (e) => { if (dragging.current) onSeek(getVal(e)); };
    const onUp   = () => { if (dragging.current) { dragging.current = false; setActive(false); } };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
    return () => { document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); };
  }, [onSeek]);

  const timeStyle = {
    fontSize: 10.5, fontVariantNumeric: 'tabular-nums',
    color: hover || active ? 'rgba(255,255,255,0.5)' : 'rgba(255,255,255,0.28)',
    letterSpacing: '0.02em',
    userSelect: 'none', flexShrink: 0,
    transition: 'color 0.2s ease',
  };
  const thick = hover || active;
  const TRACK_H = thick ? 14 : 10;
  const THUMB_SZ = active ? 16 : (hover ? 14 : 0);
  return (
    <div style={{width:'100%', display:'flex', alignItems:'center', gap:11}}>
      <span ref={elapsedSpanRef} style={timeStyle}>{fmt(Math.floor(progressRef.current * (total||0)))}</span>
      {/* clickable hit-zone with vertical padding */}
      <div
        onMouseEnter={() => setHover(true)}
        onMouseLeave={() => { setHover(false); setTip(s => ({...s, show:false})); }}
        onMouseMove={e => {
          const rect = trackRef.current?.getBoundingClientRect();
          if (!rect) return;
          const wrapRect = e.currentTarget.getBoundingClientRect();
          const p = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
          setTip({ x: e.clientX - wrapRect.left, t: Math.floor(p * (total || 0)), show: true });
        }}
        onMouseDown={e => { dragging.current = true; setActive(true); onSeek(getVal(e)); kick(); }}
        style={{
          flex:1, minWidth:0, position:'relative',
          padding: '10px 0', cursor:'pointer',
          display:'flex', alignItems:'center',
        }}
      >
        {/* time tooltip on hover */}
        {tip.show && (
          <div style={{
            position:'absolute',
            left: tip.x, top: -4,
            translate: '-50% -100%',
            background:'rgba(20,20,26,0.96)',
            backdropFilter:'blur(10px)', WebkitBackdropFilter:'blur(10px)',
            border:'1px solid rgba(255,255,255,0.055)',
            padding:'4px 9px', borderRadius:6,
            fontSize:11, fontWeight:600, fontVariantNumeric:'tabular-nums',
            color:'rgba(255,255,255,0.92)',
            pointerEvents:'none', whiteSpace:'nowrap',
            zIndex: 5,
          }}>{fmt(tip.t)}</div>
        )}
        <div style={{ width:'100%', position:'relative' }}>
          {/* track with overflow-hidden so fill scaleX clips cleanly */}
          <div ref={trackRef}
            style={{
              width:'100%', position:'relative',
              height: TRACK_H,
              borderRadius: 999, overflow:'hidden',
              background:'rgba(255,255,255,0.085)',
              boxShadow: thick ? 'inset 0 1px 1px rgba(0,0,0,0.18)' : 'none',
              transition: 'height 0.22s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.2s ease',
            }}
          >
            <div ref={fillRef} style={{
              position:'absolute', left:0, top:0,
              height:'100%',
              width: (progressRef.current * 100).toFixed(3) + '%',
              borderRadius: '0 999px 999px 0',
              background: 'linear-gradient(90deg, rgba(var(--accent-rgb),0.88), rgb(var(--accent-rgb)))',
              boxShadow: 'inset 0 1px 0 rgba(255,255,255,0.14)',
              pointerEvents:'none',
              transition:'background 0.6s ease',
            }}/>
          </div>
          {/* glow layer (outside track so it isn't clipped) */}
          <div style={{
            position:'absolute', left:0, top:'50%', translate:'0 -50%',
            height: TRACK_H, width: `${(progressRef.current * 100).toFixed(3)}%`,
            borderRadius: 999,
            boxShadow: active
              ? '0 0 16px rgba(var(--accent-rgb),0.32), 0 0 5px rgba(var(--accent-rgb),0.22)'
              : hover
                ? '0 0 12px rgba(var(--accent-rgb),0.22), 0 0 4px rgba(var(--accent-rgb),0.14)'
                : '0 0 8px rgba(var(--accent-rgb),0.08)',
            pointerEvents:'none',
            transition: 'box-shadow 0.3s ease, height 0.22s cubic-bezier(0.34,1.56,0.64,1)',
          }}/>
          {/* thumb — outside track so it isn't clipped */}
          <div ref={thumbRef} style={{
            position:'absolute', top:'50%',
            left: (progressRef.current * 100).toFixed(3) + '%',
            translate: '-50% -50%',
            width: THUMB_SZ, height: THUMB_SZ,
            borderRadius: '50%',
            background: '#fff',
            boxShadow: '0 2px 8px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.08)',
            opacity: (hover || active) ? 1 : 0,
            transition: 'width 0.18s cubic-bezier(0.34,1.56,0.64,1), height 0.18s cubic-bezier(0.34,1.56,0.64,1), opacity 0.18s ease',
            pointerEvents:'none',
          }}/>
        </div>
      </div>
      <span ref={remainingSpanRef} style={timeStyle}>-{fmt((total||0) - Math.floor(progressRef.current * (total||0)))}</span>
    </div>
  );
}

/* ── Thin Volume Slider ───────────────────────────────────────────────────── */
function ThinVolumeSlider({ volume, onChange, onLiveChange, accentKey }) {
  const wrapRef    = useRef(null);
  const canvasRef  = useRef(null);
  const rafRef     = useRef(null);
  const volActual  = useRef(volume); /* follows props when idle, follows cursor during drag */
  const volDisp    = useRef(volume); /* smoothly chases volActual */
  const dragging   = useRef(false);
  const onChangeCb = useRef(onChange);     /* commit to React state (mouseup only) */
  const onLiveCb   = useRef(onLiveChange); /* live apply during drag (no re-render) */
  const accentRef  = useRef(accentKey || '178,178,178');
  const TW = 28;

  const drawRef = useRef(null);
  const kick = () => {
    if (rafRef.current == null && drawRef.current) {
      rafRef.current = requestAnimationFrame(drawRef.current);
    }
  };

  useEffect(() => { onChangeCb.current = onChange; }, [onChange]);
  useEffect(() => { onLiveCb.current = onLiveChange; }, [onLiveChange]);
  useEffect(() => {
    if (!dragging.current) volActual.current = volume;
    kick();
  }, [volume]);
  useEffect(() => { accentRef.current = accentKey || '178,178,178'; kick();
    const t0 = performance.now();
    let id;
    const loop = (now) => { kick(); if (now - t0 < 680) id = requestAnimationFrame(loop); };
    id = requestAnimationFrame(loop);
    return () => cancelAnimationFrame(id);
  }, [accentKey]);

  const getVal = useCallback((e) => {
    const rect = canvasRef.current.getBoundingClientRect();
    return Math.max(0, Math.min(1, 1 - (e.clientY - rect.top)/rect.height));
  }, []);

  useEffect(() => {
    const canvas = canvasRef.current, wrap = wrapRef.current;
    if (!canvas || !wrap) return;
    const dpr = window.devicePixelRatio || 1;
    const ctx = canvas.getContext('2d');

    const resize = () => {
      canvas.height = wrap.clientHeight * dpr;
      canvas.width  = TW * dpr;
      canvas.style.height = wrap.clientHeight + 'px';
      canvas.style.width  = TW + 'px';
      kick();
    };
    resize();
    const ro = new ResizeObserver(resize);
    ro.observe(wrap);

    const draw = () => {
      const speed = dragging.current ? 0.09 : 0.04;
      const diff = volActual.current - volDisp.current;
      if (!dragging.current && Math.abs(diff) < 0.001) {
        volDisp.current = volActual.current;
      } else {
        volDisp.current += diff * speed;
      }
      const v = volDisp.current;

      const WW = canvas.width, HH = canvas.height;
      ctx.clearRect(0, 0, WW, HH);

      const cx    = WW / 2;
      const barW  = 5 * dpr;
      const r     = barW / 2;
      const pad   = r + 4 * dpr;
      const trackH = HH - pad * 2;
      const trackTop = pad;
      const trackBot = pad + trackH;

      /* bg track */
      ctx.beginPath();
      ctx.roundRect(cx - r, trackTop, barW, trackH, r);
      ctx.fillStyle = 'rgba(255,255,255,0.07)';
      ctx.fill();

      /* fill */
      if (v > 0.01) {
        const fillH   = Math.max(barW, trackH * v);
        const fillTop = trackBot - fillH;
        ctx.save();
        const accentRgb = (getComputedStyle(document.documentElement).getPropertyValue('--accent-rgb') || accentRef.current || '178, 178, 178').trim();
        ctx.shadowColor = `rgba(${accentRgb},0.5)`;
        ctx.shadowBlur  = 8 * dpr;
        ctx.beginPath();
        ctx.roundRect(cx - r, fillTop, barW, fillH, r);
        ctx.fillStyle = `rgb(${accentRgb})`;
        ctx.fill();
        ctx.restore();
      }

      if (!dragging.current && Math.abs(volActual.current - volDisp.current) < 0.001) {
        rafRef.current = null;
        return;
      }
      rafRef.current = requestAnimationFrame(draw);
    };
    drawRef.current = draw;
    rafRef.current = requestAnimationFrame(draw);
    return () => { cancelAnimationFrame(rafRef.current); rafRef.current = null; ro.disconnect(); };
  }, []);

  useEffect(() => {
    const onMove = (e) => {
      if (!dragging.current) return;
      volActual.current = getVal(e);
      onLiveCb.current?.(volActual.current); /* apply to audio without re-rendering App */
    };
    const onUp = () => {
      if (!dragging.current) return;
      dragging.current = false;
      onChangeCb.current(volActual.current); /* commit final value to React state once */
      kick();
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup',   onUp);
    return () => { document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); };
  }, [getVal]);

  return (
    <div ref={wrapRef} style={{flex:1, minHeight:0, cursor:'ns-resize', display:'flex', alignItems:'stretch'}}
      onMouseDown={e => { dragging.current = true; volActual.current = getVal(e); onLiveCb.current?.(volActual.current); kick(); }}>
      <canvas ref={canvasRef} style={{display:'block'}}/>
    </div>
  );
}

/* ── Album Art ───────────────────────────────────────────────────────────── */
function AlbumArt({ track, isPlaying, sleepy, someoneElse }) {
  const imgRef = useRef(null);
  const retryRef = useRef(0);
  const url = track.coverUrl || null;
  const t = useLang();

  // when window returns to foreground, if img happens to be hidden (eviction),
  // force a reload from the same src to bring it back
  useEffect(() => {
    if (!url) return;
    const onVis = () => {
      if (document.visibilityState !== 'visible') return;
      const el = imgRef.current;
      if (!el) return;
      if (el.style.opacity === '0' || !el.complete || el.naturalWidth === 0) {
        const sep = url.includes('?') ? '&' : '?';
        el.src = url + sep + '_r=' + Date.now();
        el.style.opacity = '1';
      }
    };
    document.addEventListener('visibilitychange', onVis);
    window.addEventListener('focus', onVis);
    return () => {
      document.removeEventListener('visibilitychange', onVis);
      window.removeEventListener('focus', onVis);
    };
  }, [url]);

  return (
    <div className={'album-art-frame' + (sleepy ? ' sleepy' : '')} style={{
      position:'relative', width:'100%', aspectRatio:'1', borderRadius:16, overflow:'hidden',
      background:'#111116',
      display:'flex', alignItems:'center', justifyContent:'center',
    }}>
      {/* placeholder underneath — always rendered */}
      <img src="./assets/note.png" style={{width:32,height:32,filter:'brightness(0) invert(1)',opacity:0.13}}/>
      {/* cover on top, fades out on error */}
      {url && (
        <img ref={imgRef} src={url} decoding="async"
          style={{position:'absolute',inset:0,width:'100%',height:'100%',objectFit:'cover',transition:'opacity 0.26s ease'}}
          onLoad={e => { e.currentTarget.style.opacity = '1'; retryRef.current = 0; }}
          onError={e => {
            e.currentTarget.style.opacity = '0';
            if (retryRef.current < 2) {
              retryRef.current++;
              const el = e.currentTarget;
              setTimeout(() => {
                if (!el.isConnected) return;
                const sep = url.includes('?') ? '&' : '?';
                el.src = url + sep + '_r=' + Date.now();
              }, 500 * retryRef.current);
            }
          }}/>
      )}
      {someoneElse && <div className="someone-else-dot" title={t('someone_else')}/>}
    </div>
  );
}

/* ── AmbientGlow ─────────────────────────────────────────────────────────── */
/* glow за обложкой: два слоя crossfade'ятся по opacity при смене accent —
   композитится на gpu, без покадрового перерасчёта blur (в отличие от
   transition:background, который дёргал слайд) */
function AmbientGlow({ accent, visible, isPlaying }) {
  const [slots, setSlots] = useState(() => [{ a: accent, on: true }, { a: accent, on: false }]);
  const activeRef = useRef(0);
  const keyRef = useRef(accent.r + ',' + accent.g + ',' + accent.b);
  useEffect(() => {
    const key = accent.r + ',' + accent.g + ',' + accent.b;
    if (key === keyRef.current) return;
    keyRef.current = key;
    const next = activeRef.current === 0 ? 1 : 0;
    activeRef.current = next;
    setSlots(prev => prev.map((s, i) => i === next ? { a: accent, on: true } : { ...s, on: false }));
  }, [accent.r, accent.g, accent.b]);
  const grad = (a) => `radial-gradient(circle at center, rgba(${a.r},${a.g},${a.b},0.55) 0%, rgba(${a.r},${a.g},${a.b},0.26) 36%, rgba(${a.r},${a.g},${a.b},0.08) 64%, rgba(${a.r},${a.g},${a.b},0) 90%)`;
  const vis = visible ? (isPlaying ? 1 : 0.5) : 0;
  return (
    <div style={{
      position:'absolute', inset:'-30%', borderRadius:'50%',
      opacity: vis, transition:'opacity 0.55s ease',
      pointerEvents:'none', zIndex:0,
    }}>
      {slots.map((s, i) => (
        <div key={i} style={{
          position:'absolute', inset:0, borderRadius:'50%',
          background: grad(s.a), filter:'blur(42px)',
          opacity: s.on ? 1 : 0, transition:'opacity 0.6s ease',
        }}/>
      ))}
    </div>
  );
}

/* ── CircularVisualizer — симулированные кольца (без Web Audio / CORS) ───── */
function CircularVisualizer({ isPlaying, accentRGB }) {
  const canvasRef = useRef(null);
  const rafRef = useRef(null);
  const wrapRef = useRef(null);
  const playingRef = useRef(isPlaying);
  playingRef.current = isPlaying;
  useEffect(() => {
    const canvas = canvasRef.current;
    const wrap = wrapRef.current;
    if (!canvas || !wrap) return;
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const resize = () => {
      const s = wrap.clientWidth || 320;
      canvas.width = s * dpr;
      canvas.height = s * dpr;
      canvas.style.width = s + 'px';
      canvas.style.height = s + 'px';
    };
    resize();
    const ro = new ResizeObserver(resize);
    ro.observe(wrap);
    const bars = 56;
    const phases = Array.from({ length: bars }, () => Math.random() * Math.PI * 2);
    const speeds = Array.from({ length: bars }, () => 1.2 + Math.random() * 2.4);
    const draw = (t) => {
      const W = canvas.width, H = canvas.height;
      ctx.clearRect(0, 0, W, H);
      if (!playingRef.current) {
        rafRef.current = requestAnimationFrame(draw);
        return;
      }
      const cx = W / 2, cy = H / 2;
      const radius = W * 0.475;
      const sec = t * 0.001;
      for (let i = 0; i < bars; i++) {
        const wave = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(sec * speeds[i] + phases[i]));
        const val = wave * (0.55 + 0.45 * Math.sin(sec * 1.7 + i * 0.22));
        const angle = (i / bars) * Math.PI * 2 - Math.PI / 2 + sec * 0.15;
        const len = (4 + val * 22) * dpr;
        const x1 = cx + Math.cos(angle) * radius;
        const y1 = cy + Math.sin(angle) * radius;
        const x2 = cx + Math.cos(angle) * (radius + len);
        const y2 = cy + Math.sin(angle) * (radius + len);
        ctx.strokeStyle = `rgba(${accentRGB},${0.22 + val * 0.55})`;
        ctx.lineWidth = 2 * dpr;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
      }
      rafRef.current = requestAnimationFrame(draw);
    };
    rafRef.current = requestAnimationFrame(draw);
    return () => {
      cancelAnimationFrame(rafRef.current);
      rafRef.current = null;
      ro.disconnect();
    };
  }, [accentRGB]);
  return (
    <div ref={wrapRef} style={{
      position:'absolute', inset:'-10%', zIndex:0, pointerEvents:'none',
      opacity: isPlaying ? 0.62 : 0,
      transition:'opacity 0.45s ease',
    }}>
      <canvas ref={canvasRef} style={{ display:'block', width:'100%', height:'100%' }}/>
    </div>
  );
}

/* ── MagBtn ──────────────────────────────────────────────────────────────── */
function MagBtn({ onClick, onHoldStart, onHoldEnd, holdMs=280, active, children, size=52, locked=false, title }) {
  const held = useRef(false);
  const timer = useRef(null);
  const usingHold = typeof onHoldStart === 'function';
  const clear = () => { if (timer.current) { clearTimeout(timer.current); timer.current = null; } };
  const endHold = () => {
    const wasHeld = held.current;
    clear();
    held.current = false;
    if (wasHeld) onHoldEnd?.();
    return wasHeld;
  };
  return (
    <motion.button title={title}
      onClick={locked || usingHold ? undefined : onClick}
      onPointerDown={locked || !usingHold ? undefined : (e) => {
        if (e.button !== 0) return;
        try { e.currentTarget.setPointerCapture(e.pointerId); } catch {}
        held.current = false;
        clear();
        timer.current = setTimeout(() => { held.current = true; onHoldStart(); }, holdMs);
      }}
      onPointerUp={locked || !usingHold ? undefined : (e) => {
        if (!endHold()) onClick?.(e);
      }}
      onPointerLeave={locked || !usingHold ? undefined : () => { endHold(); }}
      onPointerCancel={locked || !usingHold ? undefined : () => { endHold(); }}
      whileHover={locked ? undefined : { y: -1 }}
      whileTap={locked ? undefined : { y: 0.5, scale: 0.96 }}
      transition={{ type:'spring', stiffness: 520, damping: 28, mass: 0.35 }}
      style={{
        width:size, height:size, borderRadius:'50%', border:'none', background:'none',
        color: active ? 'var(--accent)' : 'rgba(255,255,255,0.38)',
        display:'flex', alignItems:'center', justifyContent:'center',
        cursor: locked ? 'default' : 'pointer', flexShrink:0,
        opacity: locked ? 0.28 : 1,
        pointerEvents: locked ? 'none' : 'auto',
        transition:'color 0.2s ease, opacity 0.2s ease',
      }}>
      {children}
    </motion.button>
  );
}

function TrackContextMenu({ menu, onClose, onCopyLink, onStartStation, playlists, onAddToPlaylist, canSuggest, onSuggest }) {
  const ref = useRef(null);
  const [pos, setPos] = useState({ x: menu.x, y: menu.y, ready: false });

  useLayoutEffect(() => {
    const el = ref.current;
    if (!el) return;
    const w = el.offsetWidth;
    const h = el.offsetHeight;
    const PAD = 8;
    let x = menu.x;
    let y = menu.y;
    if (x + w > window.innerWidth - PAD)  x = window.innerWidth  - w - PAD;
    if (y + h > window.innerHeight - PAD) y = window.innerHeight - h - PAD;
    if (x < PAD) x = PAD;
    if (y < PAD) y = PAD;
    setPos({ x, y, ready: true });
  }, [menu.x, menu.y]);

  useEffect(() => {
    const onDown = (e) => {
      if (e.button === 2) return;
      if (!ref.current || ref.current.contains(e.target)) return;
      onClose();
    };
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    const onScroll = () => onClose();
    document.addEventListener('mousedown', onDown, true);
    document.addEventListener('keydown', onKey);
    window.addEventListener('wheel', onScroll, { passive: true });
    return () => {
      document.removeEventListener('mousedown', onDown, true);
      document.removeEventListener('keydown', onKey);
      window.removeEventListener('wheel', onScroll);
    };
  }, [onClose]);

  const t = useLang();

  return ReactDOM.createPortal(

      animate={{ opacity: pos.ready ? 1 : 0, scale: 1 }}

function VirtualTrackList({ items, activeId, loadingId, errorId, onClickItem, onContextMenuItem, scrollToActive, scrollTargetId, accentRGB, isPlaying }) {
  const ROW_H = 50;
  const BUFFER = 5;
  const FADE = 18;
  const ref = useRef(null);
  const scrollRafRef = useRef(null);
  const [range, setRange] = useState({ start: 0, end: 30 });
  const [edges, setEdges] = useState({ top: false, bottom: false });

  const updateRange = useCallback(() => {
    const el = ref.current;
    if (!el) return;
    const scrollTop = el.scrollTop;
    const viewportH = el.clientHeight;
    const visibleStart = Math.floor(scrollTop / ROW_H);
    const visibleEnd = Math.ceil((scrollTop + viewportH) / ROW_H);
    const start = Math.max(0, visibleStart - BUFFER);
    const end = Math.min(items.length, visibleEnd + BUFFER);
    setRange(prev => (prev.start === start && prev.end === end) ? prev : { start, end });
    const topEdge = scrollTop > 4;
    const botEdge = scrollTop + viewportH < el.scrollHeight - 4;
    setEdges(prev => (prev.top === topEdge && prev.bottom === botEdge) ? prev : { top: topEdge, bottom: botEdge });
  }, [items.length]);

  const updateRangeRef = useRef(updateRange);
  updateRangeRef.current = updateRange;

  useLayoutEffect(() => { updateRange(); }, [updateRange]);

  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const onScroll = () => {
      if (scrollRafRef.current) return;
      scrollRafRef.current = requestAnimationFrame(() => {
        scrollRafRef.current = null;
        updateRangeRef.current?.();
      });
    };
    el.addEventListener('scroll', onScroll, { passive: true });
    const ro = new ResizeObserver(() => updateRangeRef.current?.());
    ro.observe(el);
    return () => {
      el.removeEventListener('scroll', onScroll);
      ro.disconnect();
      cancelAnimationFrame(scrollRafRef.current);
    };
  }, []);

  const maskImage = (() => {
    if (!edges.top && !edges.bottom) return 'none';
    const parts = [];
    parts.push(edges.top ? `transparent 0` : `black 0`);
    parts.push(edges.top ? `black ${FADE}px` : `black 0`);
    parts.push(edges.bottom ? `black calc(100% - ${FADE}px)` : `black 100%`);
    parts.push(edges.bottom ? `transparent 100%` : `black 100%`);
    return `linear-gradient(to bottom, ${parts.join(', ')})`;
  })();

  useEffect(() => {
    if (!scrollToActive || !ref.current) return;
    const targetId = scrollTargetId ?? activeId;
    const idx = items.findIndex(t => t.id === targetId);
    if (idx < 0) return;
    const el = ref.current;
    smoothScroll(el, Math.max(0, idx * ROW_H - el.clientHeight / 2 + ROW_H / 2), 420);
  }, [scrollToActive]);

  const onClickStable = useCallback(t => onClickItem(t), [onClickItem]);

  const activeIdx = items.findIndex(t => t.id === activeId);
  const visibleItems = items.slice(range.start, range.end);
  const totalHeight = items.length * ROW_H;
  const offsetTop = range.start * ROW_H;

  return (
    <div ref={ref} className="scroll-thin" style={{
      flex:1, overflowY:'auto', padding:'2px 6px 10px', position:'relative',
      maskImage: maskImage, WebkitMaskImage: maskImage,
      transition: 'mask-image 0.2s ease, -webkit-mask-image 0.2s ease',
    }}>
      {activeIdx >= 0 && (
        <div style={{
          position:'absolute', pointerEvents:'none',
          top:2, left:6, right:6, height: ROW_H - 2,
          transform:`translateY(${activeIdx * ROW_H}px)`,
          borderRadius:9,
          background: accentRGB ? `rgba(${accentRGB.r},${accentRGB.g},${accentRGB.b},0.14)` : 'rgba(178,178,178,0.09)',
          transition:'transform 0.42s cubic-bezier(0.45,0,0.55,1), background 0.55s ease',
          willChange:'transform',
          zIndex:0,
        }}/>
      )}
      <div style={{position:'relative', zIndex:1, height: totalHeight}}>
        <div style={{transform:`translateY(${offsetTop}px)`}}>
          {visibleItems.map(t => (
            <TrackRow key={t.id} track={t} isActive={t.id === activeId}
              isLoading={t.id === loadingId}
              isError={t.id === errorId}
              isPlaying={t.id === activeId && isPlaying}
              onClick={onClickStable}
              onContextMenu={onContextMenuItem}/>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ── Hero clone ──────────────────────────────────────────────────────────── */
const HERO_DUR_MS  = 380;
const HERO_FADE_MS = 140;
const HERO_EASE    = 'expo.inOut';
function HeroClone({ hero, exiting, reverse = false }) {
  const cloneRef = useRef(null);
  const { left: tLeft, top: tTop, size } = hero.targetRect;
  const { left: sLeft, top: sTop, width: sW, height: sH } = hero.startRect;

  const dx = (sLeft + sW/2) - (tLeft + size/2);
  const dy = (sTop + sH/2) - (tTop + size/2);
  const sc = sW / size;
  const BR = 16;
  const DUR = HERO_DUR_MS / 1000;

  // run the timeline BEFORE first paint so there is no flash in the target rect
  useLayoutEffect(() => {
    const el = cloneRef.current;
    if (!el) return;
    const tl = gsap.timeline({ defaults: { force3D: true, ease: HERO_EASE, duration: DUR } });
    if (reverse) {
      tl.fromTo(el, { x: 0, y: 0, scale: 1 }, { x: dx, y: dy, scale: sc }, 0);
    } else {
      tl.fromTo(el, { x: dx, y: dy, scale: sc }, { x: 0, y: 0, scale: 1 }, 0);
    }
    return () => tl.kill();
  }, []);

  useEffect(() => {
    if (!exiting || !cloneRef.current) return;
    const tween = gsap.to(cloneRef.current, {
      opacity: 0,
      duration: HERO_FADE_MS / 1000,
      ease: 'power2.out',
      force3D: true,
    });
    return () => tween.kill();
  }, [exiting]);

  // pre-paint inline transform — clone is born already in its starting position
  const initialTransform = reverse
    ? 'translate3d(0,0,0) scale(1)'
    : `translate3d(${dx}px, ${dy}px, 0) scale(${sc})`;

  return ReactDOM.createPortal(
    <div ref={cloneRef} style={{
      position:'fixed',
      left: tLeft, top: tTop,
      width: size, height: size,
      zIndex:960, pointerEvents:'none',
      transformOrigin:'center center',
      transform: initialTransform,
      borderRadius: BR,
      overflow:'hidden',
      background:'#111116',
      willChange:'transform, opacity',
      backfaceVisibility:'hidden',
      contain:'layout style paint',
    }}>
      {hero.track.coverUrl ? (
        <img src={hero.track.coverUrl}
          loading="eager" decoding="sync"
          style={{
            position:'absolute', inset:0, width:'100%', height:'100%',
            objectFit:'cover', display:'block',
          }}
          onError={e=>{e.currentTarget.style.display='none'}}/>
      ) : (
        <div style={{
          position:'absolute', inset:0,
          display:'flex', alignItems:'center', justifyContent:'center',
        }}>
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none">
            <path d="M9 18V5l12-2v13" stroke="rgba(255,255,255,0.13)" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
            <circle cx="6" cy="18" r="3" stroke="rgba(255,255,255,0.13)" strokeWidth="1.5"/>
            <circle cx="18" cy="16" r="3" stroke="rgba(255,255,255,0.13)" strokeWidth="1.5"/>
          </svg>
        </div>
      )}
    </div>,
    document.body
  );
}

      (selfUid && m.uid && String(m.uid) === String(selfUid)) ||

    ));

function MemberContextMenu({ menu, onClose, onKick, onBan, onTransfer, busy }) {
  const ref = useRef(null);
  const [pos, setPos] = useState({ x: menu.x, y: menu.y, ready: false });
  const t = useLang();
  useLayoutEffect(() => {
    const el = ref.current;
    if (!el) return;
    const w = el.offsetWidth, h = el.offsetHeight, PAD = 8;
    let x = menu.x, y = menu.y;
    if (x + w > window.innerWidth - PAD) x = window.innerWidth - w - PAD;
    if (y + h > window.innerHeight - PAD) y = window.innerHeight - h - PAD;
    if (x < PAD) x = PAD;
    if (y < PAD) y = PAD;
    setPos({ x, y, ready: true });
  }, [menu.x, menu.y]);
  useEffect(() => {
    const onDown = (e) => {
      if (!ref.current || ref.current.contains(e.target)) return;
      onClose();
    };
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('mousedown', onDown, true);
    document.addEventListener('keydown', onKey);
    return () => {
      document.removeEventListener('mousedown', onDown, true);
      document.removeEventListener('keydown', onKey);
    };
  }, [onClose]);
  const Item = ({ label, onClick }) => (
    <div onClick={() => { onClick?.(menu.member); onClose(); }}
      style={{padding:'7px 11px', borderRadius:7, fontSize:12.5, color:'rgba(255,255,255,0.86)', cursor:'pointer', userSelect:'none'}}
      onMouseEnter={e => { e.currentTarget.style.background='rgba(255,255,255,0.07)'; }}
      onMouseLeave={e => { e.currentTarget.style.background='transparent'; }}>
      {label}
    </div>
  );
  return ReactDOM.createPortal(
    <div ref={ref} style={{
      position:'fixed', left: pos.x, top: pos.y, minWidth: 180,
      opacity: pos.ready ? 1 : 0,
      background:'rgba(24,24,24,0.97)',
      backdropFilter:'blur(14px)', WebkitBackdropFilter:'blur(14px)',
      border:'1px solid rgba(255,255,255,0.055)',
      borderRadius:10, padding:4, zIndex:9998,
      boxShadow:'0 12px 36px rgba(0,0,0,0.55)',
    }}>
      <Item label={t('room_kick')} onClick={busy && busy.mod ? undefined : onKick}/>
      <Item label={t('room_ban')} onClick={busy && busy.mod ? undefined : onBan}/>
      <Item label={t('room_transfer')} onClick={busy && busy.mod ? undefined : onTransfer}/>
    </div>,
    document.body
  );
}

/* ── CrossfadeSlider ─────────────────────────────────────────────────────── */
function CrossfadeSlider({ value, onChange }) {
  const t = useLang();
  const trackRef    = useRef(null);
  const onChangeRef = useRef(onChange);
  const valueRef    = useRef(value);
  const dragging    = useRef(false);
  const [live, setLive] = useState(null);
  onChangeRef.current = onChange;
  valueRef.current    = live != null ? live : (value || 0);

  const calcVal = (clientX) => {
    const el = trackRef.current;
    if (!el) return valueRef.current;
    const rect = el.getBoundingClientRect();
    if (!rect.width) return valueRef.current;
    return Math.round(Math.max(0, Math.min(1, (clientX - rect.left) / rect.width)) * 12);
  };

  useEffect(() => {
    const onMove = e => {
      if (!dragging.current) return;
      const v = calcVal(e.clientX);
      valueRef.current = v;
      setLive(v);
    };
    const onUp = e => {
      if (!dragging.current) return;
      dragging.current = false;
      const v = calcVal(e.clientX);
      setLive(null);
      onChangeRef.current(v);
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
    return () => {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    };
  }, []);

  useEffect(() => {
    const el = trackRef.current;
    if (!el) return;
    const onWheel = e => {
      e.preventDefault();
      onChangeRef.current(Math.max(0, Math.min(12, valueRef.current + (e.deltaY > 0 ? -1 : 1))));
    };
    el.addEventListener('wheel', onWheel, { passive: false });
    return () => el.removeEventListener('wheel', onWheel);
  }, []);

  const shown = live != null ? live : (value || 0);
  const pct = (shown / 12) * 100;

  return (
    <div style={{display:'flex', alignItems:'center', gap:12}}>
      <div ref={trackRef}
        style={{width:150, height:24, display:'flex', alignItems:'center', cursor:'ew-resize', userSelect:'none', touchAction:'none'}}
        onMouseDown={e => {
          dragging.current = true;
          const v = calcVal(e.clientX);
          valueRef.current = v;
          setLive(v);
        }}>
        <div style={{width:'100%', height:6, borderRadius:3, background:'rgba(255,255,255,0.07)', position:'relative', overflow:'hidden'}}>
          <div style={{
            position:'absolute', left:0, top:0, height:'100%',
            width:`${pct}%`, borderRadius:3,
            background:'#c8c8c8',
            boxShadow: pct > 0 ? '0 0 8px rgba(178,178,178,0.45)' : 'none',
          }}/>
        </div>
      </div>
      <span style={{fontSize:12, color:'rgba(255,255,255,0.32)', minWidth:28, textAlign:'right'}}>
        {shown === 0 ? t('off') : `${shown} ${t('sec')}`}
      </span>
    </div>
  );
}

/* ── AvatarFlyClone ──────────────────────────────────────────────────────── */
function AvatarFlyClone({ fly, exiting }) {
  const { avatarUrl, startRect: s, targetRect: t } = fly;
  const dx = (s.left + s.width/2)  - (t.left + t.width/2);
  const dy = (s.top  + s.height/2) - (t.top  + t.height/2);
  const sc = s.width / t.width;
  const [ready, setReady] = useState(false);
  useEffect(() => { requestAnimationFrame(() => requestAnimationFrame(() => setReady(true))); }, []);
  return ReactDOM.createPortal(
    <div style={{
      position:'fixed', left:t.left, top:t.top,
      width:t.width, height:t.height, borderRadius:12,
      overflow:'hidden', zIndex:970, pointerEvents:'none',
      transformOrigin:'center center',
      transform: ready ? 'translate(0,0) scale(1)' : `translate(${dx}px,${dy}px) scale(${sc})`,
      opacity: exiting ? 0 : 1,
      transition: ready ? 'transform 0.38s cubic-bezier(0.22,1,0.36,1), opacity 0.12s ease' : 'none',
    }}>
      <img src={avatarUrl} style={{width:'100%',height:'100%',objectFit:'cover'}}/>
    </div>,
    document.body
  );
}

  const t = useLang();

    setLoading(true); setError(null);
    try {
      const creds = await window.electronAPI.scLogin();
      if (!creds) { setError(t('login_cancel')); setLoading(false); return; }
      const res = await window.electronAPI.scFetch('https://api-v2.soundcloud.com/me', creds.token, creds.clientId);
      if (res.data) onLogin({ ...creds, userId: res.data.id, username: res.data.username, avatarUrl: res.data.avatar_url || null });

            : <svg width="42" height="42" fill="none" stroke="currentColor" strokeWidth="1.6" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
          }
        </div>
        <div style={{textAlign:'center'}}>
          <div style={{fontSize:11, color:'rgba(255,255,255,0.28)', letterSpacing:'0.08em', textTransform:'uppercase', marginBottom:8}}>signed as</div>
          <div style={{fontSize:20, fontWeight:600, letterSpacing:'-0.02em', color:'rgba(255,255,255,0.85)'}}>{scAuth.username || t('unknown')}</div>

          onMouseEnter={e=>{ e.currentTarget.style.background='rgba(255,255,255,0.07)'; e.currentTarget.style.color='rgba(255,255,255,0.75)'; }}
          onMouseLeave={e=>{ e.currentTarget.style.background='rgba(255,255,255,0.04)'; e.currentTarget.style.color='rgba(255,255,255,0.5)'; }}
        >{t('logout')}</button>
      </div>

  );

  return (
    <div style={{...transStyle, display:'flex', alignItems:'center', justifyContent:'center'}}>
      {topChrome}
      <div style={{display:'flex', flexDirection:'column', alignItems:'center', gap:20, marginTop:36}}>
        <div ref={avatarRef} style={{
          width:72, height:72, borderRadius:20, flexShrink:0,
          background:'rgba(255,85,0,0.07)',
          display:'flex', alignItems:'center', justifyContent:'center', overflow:'hidden',
        }}>
          {SC_ICON}
        </div>
        <div style={{textAlign:'center'}}>
          <div style={{fontSize:15,fontWeight:600,letterSpacing:'-0.015em',color:'rgba(255,255,255,0.6)',marginBottom:7}}>{t('sc_not_connected')}</div>
          <div style={{fontSize:12,color:'rgba(255,255,255,0.22)',lineHeight:1.6}}>{t('sc_hint').split('\n').map((l,i)=><span key={i}>{l}{i===0&&<br/>}</span>)}</div>
        </div>
        {error && <div style={{fontSize:11,color:'rgba(255,80,60,0.7)'}}>{error}</div>}
        <button onClick={handleLogin} disabled={loading} style={{

          cursor: loading ? 'default' : 'pointer', fontFamily:'inherit',
        }}>{loading ? t('opening_browser') : t('login_browser')}</button>
      </div>
    </div>
  );
}

/* ── SearchView ──────────────────────────────────────────────────────────── */
const SearchView = React.forwardRef(function SearchView({ visible, scAuth, likedIds, onLike, onPlayTrack, onSelectTrack, onResultsLoaded, onArtistClick, loadingTrackId, errorTrackId, hideDividers, onContextMenu }, ref) {
  const T = useLang();
  const inputRef = useRef(null);
  const [query,   setQuery]   = useState('');
  const [results, setResults] = useState([]);
  const [users,   setUsers]   = useState([]);
  const [loading, setLoading] = useState(false);
  const [offset,  setOffset]  = useState(0);
  const [hasMore, setHasMore] = useState(false);
  const debounceRef  = useRef(null);
  const queryRef     = useRef('');
  const loadingRef   = useRef(false);
  const hasMoreRef   = useRef(false);
  const offsetRef    = useRef(0);
  hasMoreRef.current = hasMore;
  offsetRef.current  = offset;
  React.useImperativeHandle(ref, () => ({
    focus: () => { inputRef.current?.focus(); inputRef.current?.select(); },
    loadMore: () => {
      if (!hasMoreRef.current || loadingRef.current) return;
      doSearch(queryRef.current, offsetRef.current);
    },
  }));

  const hasResults = results.length > 0 || users.length > 0;

  const doSearch = async (q, off = 0) => {
    if (!q.trim() || !scAuth) return;
    loadingRef.current = true;
    setLoading(true);
    const [tracksRes, usersRes] = await Promise.all([
      window.electronAPI.scFetch(
        `https://api-v2.soundcloud.com/search/tracks?q=${encodeURIComponent(q)}&limit=20&offset=${off}`,
        scAuth.token, scAuth.clientId
      ),
      off === 0
        ? window.electronAPI.scFetch(
            `https://api-v2.soundcloud.com/search/users?q=${encodeURIComponent(q)}&limit=4`,
            scAuth.token, scAuth.clientId
          )
        : Promise.resolve(null),
    ]);
    if (queryRef.current !== q) return;
    const newTracks = (tracksRes.data?.collection || []).map(t => mapScTrack(t, T('no_title')));
    if (off === 0) {
      setResults(newTracks);
      setUsers((usersRes?.data?.collection || []).map(u => ({
        id: u.id, username: u.username,
        avatarUrl: u.avatar_url,
        followersCount: u.followers_count,
        bannerUrl: u.visuals?.visuals?.[0]?.visual_url || null,
      })));
    } else {
      setResults(prev => [...prev, ...newTracks]);
      if (newTracks.length > 0) onResultsLoaded?.(newTracks);
    }
    setHasMore(!!tracksRes.data?.next_href);
    setOffset(off + 20);
    loadingRef.current = false;
    setLoading(false);
  };

  const handleInput = e => {
    const q = e.target.value;
    setQuery(q);
    queryRef.current = q;
    clearTimeout(debounceRef.current);
    if (!q.trim()) { setResults([]); setUsers([]); setOffset(0); return; }
    debounceRef.current = setTimeout(() => doSearch(q, 0), 380);
  };

  const handleScroll = e => {
    if (!hasMore || loadingRef.current) return;
    const el = e.currentTarget;
    if (el.scrollTop + el.clientHeight >= el.scrollHeight - 120) doSearch(query, offset);
  };

  return (
    <div style={{
      position:'absolute', inset:0,
      opacity: visible ? 1 : 0,
      pointerEvents: visible ? 'auto' : 'none',
      transition:'opacity 0.14s ease',
    }}>
      {/* searchbar */}
      <div style={{
        position:'absolute', left:0, right:0,
        top: hasResults ? '8%' : '36%',
        transition:'top 0.42s cubic-bezier(0.22,1,0.36,1)',
        padding:'0 52px', zIndex:2,
      }}>
        <div style={{
          position:'relative',
          background:'rgba(255,255,255,0.05)',
          borderRadius:18,
        }}>
          <svg width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2"
            viewBox="0 0 24 24" style={{position:'absolute', left:22, top:'50%', translate:'0 -50%', pointerEvents:'none', color:'rgba(255,255,255,0.3)'}}>
            <circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35" strokeLinecap="round"/>
          </svg>
          <input
            ref={inputRef}
            value={query} onChange={handleInput}
            placeholder={T('search_ph')}
            style={{
              width:'100%', background:'transparent', border:'none', outline:'none',
              padding:'15px 54px',
              color:'#ededf4', fontSize:18, fontFamily:'inherit', textAlign:'center',
            }}
          />
          {loading && <div style={{position:'absolute', right:22, top:'50%', translate:'0 -50%', width:16, height:16, borderRadius:'50%', border:'2px solid rgba(255,255,255,0.15)', borderTopColor:'rgba(255,255,255,0.5)', animation:'spin 0.7s linear infinite'}}/>}
        </div>
      </div>

      {/* results */}
      {hasResults && (
        <div onScroll={handleScroll}
          className="scroll-thin"
          style={{
            position:'absolute', left:0, right:10,
            top:'calc(8% + 76px)', bottom:0,
            overflowY:'auto', padding:'16px 52px 32px',
            willChange:'transform',
          }}>
          {users.length > 0 && (
            <div style={{marginBottom:22}}>
              <div style={{fontSize:10.5,letterSpacing:'0.09em',textTransform:'uppercase',color:'rgba(255,255,255,0.22)',marginBottom:10}}>{T('artists')}</div>
              <div style={{display:'grid', gridTemplateColumns:'repeat(4, 1fr)', gap:10}}>
                {users.slice(0, 4).map(u => (
                  <div key={u.id}
                    onClick={() => onArtistClick?.(u)}
                    style={{
                    display:'flex', alignItems:'center', gap:14,
                    background:'rgba(255,255,255,0.04)',
                    border:'1px solid rgba(255,255,255,0.03)',
                    borderRadius:14, padding:'12px 16px',
                    cursor:'pointer', transition:'background 0.15s, border-color 0.15s',
                    minWidth:0,
                  }}
                    onMouseEnter={e => { e.currentTarget.style.background='rgba(255,255,255,0.075)'; e.currentTarget.style.borderColor='rgba(255,255,255,0.06)'; }}
                    onMouseLeave={e => { e.currentTarget.style.background='rgba(255,255,255,0.04)'; e.currentTarget.style.borderColor='rgba(255,255,255,0.03)'; }}
                  >
                    {u.avatarUrl
                      ? <img src={u.avatarUrl} loading="lazy" decoding="async" style={{width:42,height:42,borderRadius:'50%',objectFit:'cover',flexShrink:0}}/>
                      : <div style={{width:42,height:42,borderRadius:'50%',background:'#111116',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                          <svg width="20" height="20" fill="none" stroke="rgba(255,255,255,0.3)" strokeWidth="1.6" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
                        </div>
                    }
                    <div style={{minWidth:0, flex:1}}>
                      <div style={{fontSize:13.5, fontWeight:600, color:'rgba(255,255,255,0.9)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', letterSpacing:'-0.005em'}}>{u.username}</div>
                      {u.followersCount > 0 && <div style={{fontSize:10.5, color:'rgba(255,255,255,0.36)', marginTop:3, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>{u.followersCount.toLocaleString()} {T('followers')}</div>}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}
          {results.length > 0 && (
            <div>
              <div style={{fontSize:10.5,letterSpacing:'0.09em',textTransform:'uppercase',color:'rgba(255,255,255,0.22)',marginBottom:8}}>{T('tracks_label')}</div>
              <AnimatePresence initial={false}>
                {results.map(t => (
                  <SearchTrackRow key={t.id} track={t}
                    isLiked={likedIds.has(t.id)}
                    onLike={() => onLike(t)}
                    onClick={() => onSelectTrack(t, results)}
                    onCoverClick={() => onPlayTrack(t, results)}
                    isLoading={loadingTrackId === t.id}
                    isError={errorTrackId === t.id}
                    hideDividers={hideDividers}
                    onContextMenu={onContextMenu}/>
                ))}
              </AnimatePresence>
              {loading && <div style={{textAlign:'center',color:'rgba(255,255,255,0.2)',padding:'16px 0',fontSize:12}}>{T('loading')}</div>}
            </div>
          )}
        </div>
      )}
    </div>
  );
});

/* ── ArtistView ──────────────────────────────────────────────────────────── */
function ArtistView({ artist, visible, onClose, scAuth, likedIds, onLike, onPlayTrack, onSelectTrack, loadingTrackId, errorTrackId, artistCacheRef, onFollow, onCheckFollow, hideDividers, onContextMenu }) {
  const t = useLang();
  const [tab, setTab] = useState('popular');
  const [fetched, setFetched] = useState(null);
  const [artistTracks, setArtistTracks] = useState([]);
  const [tracksLoading, setTracksLoading] = useState(false);
  const [tracksError, setTracksError] = useState(null);
  const [fetchKey, setFetchKey] = useState(0);
  const [nextHref, setNextHref] = useState(null);
  const nextHrefRef = useRef(null);
  const [loadingMore, setLoadingMore] = useState(false);
  const loadingMoreRef = useRef(false);
  const tabCacheRef = useRef({});
  const scrollContainerRef = useRef(null);
  const tabReqRef = useRef(0);
  const [isFollowing, setIsFollowing] = useState(null);
  const [followBusy, setFollowBusy] = useState(false);

  const mapTrack = tr => mapScTrack(tr);

  const TABS = [
    { id: 'popular', label: t('artist_popular') },
    { id: 'tracks',  label: t('artist_tracks')  },
  ];

  useEffect(() => {
    if (!artist) return;
    tabCacheRef.current = {};
    setTab('popular'); setFetched(null); setArtistTracks([]);
    setIsFollowing(null); setFollowBusy(false);
  }, [artist?.id, artist?.username]);

  useEffect(() => {
    if (!visible || !scAuth || (!artist?.id && !artist?.username)) return;
    const cacheKey = artist.id ? String(artist.id) : artist.username?.toLowerCase();
    const cached = artistCacheRef?.current?.get(cacheKey);
    if (cached) { setFetched(cached); return; }
    let cancelled = false;
    (async () => {
      try {
        let userId = artist.id;
        if (!userId) {
          const s = await window.electronAPI.scFetch(
            `https://api-v2.soundcloud.com/search/users?q=${encodeURIComponent(artist.username)}&limit=1`,
            scAuth.token, scAuth.clientId
          );
          if (cancelled) return;
          userId = s.data?.collection?.[0]?.id;
          if (!userId) return;
        }
        const res = await window.electronAPI.scFetch(
          `https://api-v2.soundcloud.com/users/${userId}`,
          scAuth.token, scAuth.clientId
        );
        if (cancelled) return;
        const u = res.data;
        if (!u) return;
        const data = {
          id: u.id,
          username: u.username,
          avatarUrl: u.avatar_url ? u.avatar_url.replace('-large', '-t500x500') : null,
          followersCount: u.followers_count,
          bannerUrl: u.visuals?.visuals?.[0]?.visual_url || null,
        };
        artistCacheRef?.current?.set(cacheKey, data);
        setFetched(data);
      } catch {}
    })();
    return () => { cancelled = true; };
  }, [visible, artist?.id, artist?.username]);

  const profileId = fetched?.id || artist?.id || null;

  useEffect(() => {
    if (!visible || !scAuth || !profileId || !onCheckFollow) return;
    let cancelled = false;
    (async () => {
      const f = await onCheckFollow(profileId);
      if (!cancelled) setIsFollowing(!!f);
    })();
    return () => { cancelled = true; };
  }, [visible, profileId, onCheckFollow, scAuth]);

  const handleSubscribeClick = async () => {
    if (!profileId || !onFollow || followBusy) return;
    setFollowBusy(true);
    const result = await onFollow(profileId, isFollowing);
    setFollowBusy(false);
    if (result !== null) setIsFollowing(result);
  };

  useEffect(() => {
    if (!visible || !scAuth || !profileId) return;

    const cached = tabCacheRef.current[tab];
    if (cached) {
      setTracksLoading(false);
      setTracksError(null);
      setArtistTracks(cached.tracks);
      nextHrefRef.current = cached.nextHref;
      setNextHref(cached.nextHref);
      return;
    }

    const reqId = ++tabReqRef.current;
    setArtistTracks([]);
    setTracksError(null);
    nextHrefRef.current = null;
    setNextHref(null);
    setTracksLoading(true);
    const urls = {
      popular: `https://api-v2.soundcloud.com/users/${profileId}/toptracks?limit=20`,
      tracks:  `https://api-v2.soundcloud.com/users/${profileId}/tracks?limit=20`,
    };
    const url = urls[tab];
    if (!url) { setTracksLoading(false); return; }
    window.electronAPI.scFetch(url, scAuth.token, scAuth.clientId).then(res => {
      if (tabReqRef.current !== reqId) return;
      const items = res.data?.collection || [];
      const mapped = items.map(mapTrack);
      const nh = res.data?.next_href || null;
      tabCacheRef.current[tab] = { tracks: mapped, nextHref: nh };
      setArtistTracks(mapped);
      nextHrefRef.current = nh;
      setNextHref(nh);
    }).catch(() => {
      if (tabReqRef.current === reqId) setTracksError(t('error_retry') || 'Ошибка загрузки');
    }).finally(() => { if (tabReqRef.current === reqId) setTracksLoading(false); });
  }, [tab, profileId, visible, fetchKey]);

  useEffect(() => {
    if (tracksLoading || loadingMore || !nextHrefRef.current) return;
    const el = scrollContainerRef.current;
    if (!el || el.scrollHeight > el.clientHeight) return;
    loadMore();
  }, [tracksLoading, loadingMore]);

  const loadMore = async () => {
    if (!nextHrefRef.current || loadingMoreRef.current || !scAuth) return;
    loadingMoreRef.current = true;
    setLoadingMore(true);
    const href = nextHrefRef.current;
    const currentTab = tab;
    try {
      const res = await window.electronAPI.scFetch(href, scAuth.token, scAuth.clientId);
      const newTracks = (res.data?.collection || []).map(mapTrack);
      const nh = res.data?.next_href || null;
      nextHrefRef.current = nh;
      setNextHref(nh);
      setArtistTracks(prev => {
        const updated = [...prev, ...newTracks];
        if (tabCacheRef.current[currentTab]) {
          tabCacheRef.current[currentTab] = { tracks: updated, nextHref: nh };
        }
        return updated;
      });
    } catch {}
    loadingMoreRef.current = false;
    setLoadingMore(false);
  };

  const profile = fetched ? { ...artist, ...fetched } : artist;

      {/* content */}
      <div ref={scrollContainerRef} className="scroll-thin" style={{ flex: 1, overflowY: 'auto', padding: '8px 32px 32px' }}

        {tracksLoading ? (
          <div style={{ display:'flex', justifyContent:'center', padding:'48px 0' }}>
            <div style={{ width:26, height:26, border:'2px solid rgba(255,255,255,0.07)', borderTopColor:'rgba(255,255,255,0.22)', borderRadius:'50%', animation:'spin 1s linear infinite' }}/>

        ) : tracksError ? (
          <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:12, padding:'48px 0' }}>
            <div style={{ fontSize:12, color:'rgba(255,255,255,0.3)' }}>{tracksError}</div>
            <button onClick={() => { delete tabCacheRef.current[tab]; setFetchKey(k => k + 1); }}
              style={{ background:'rgba(255,255,255,0.06)', border:'none', borderRadius:8, padding:'6px 16px',
                fontSize:12, color:'rgba(255,255,255,0.55)', cursor:'pointer', fontFamily:'inherit' }}>
              {t('retry') || 'Повторить'}

          </div>
        ) : artistTracks.length === 0 ? (
          <div style={{ textAlign:'center', padding:'48px 0', fontSize:12, color:'rgba(255,255,255,0.15)' }}>{t('not_found')}</div>
        ) : (
          <AnimatePresence initial={false}>
            {artistTracks.map(tr => (
              <SearchTrackRow key={tr.id} track={tr}
                isLiked={likedIds?.has(tr.id) || false}
                onLike={onLike ? () => onLike(tr) : null}
                onClick={() => onSelectTrack?.(tr)}
                onCoverClick={() => onPlayTrack?.(tr)}
                isLoading={loadingTrackId === tr.id}
                isError={errorTrackId === tr.id}
                hideDividers={hideDividers}
                onContextMenu={onContextMenu}/>
            ))}
          </AnimatePresence>
        )}
        {loadingMore && (
          <div style={{ display:'flex', justifyContent:'center', padding:'16px 0' }}>
            <div style={{ width:20, height:20, border:'2px solid rgba(255,255,255,0.07)', borderTopColor:'rgba(255,255,255,0.22)', borderRadius:'50%', animation:'spin 1s linear infinite' }}/>
          </div>
        )}
      </div>
    </div>
  );
}

/* ── Mini player (index.html#mini) ───────────────────────────────────────── */
function tauriApi() {
  return window.__TAURI__ || null;
}
function emitAoi(name, payload, labels) {
  const ev = tauriApi()?.event;
  if (!ev) return;
  const targets = labels || ['main', 'mini'];
  const go = async () => {
    for (const label of targets) {
      try { if (ev.emitTo) await ev.emitTo({ kind: 'WebviewWindow', label }, name, payload); } catch {}
      try { if (ev.emitTo) await ev.emitTo(label, name, payload); } catch {}
    }
    try { await ev.emit(name, payload); } catch {}
  };
  go();
}
function emitPlayerCmd(action, value) {
  // Rust bridge — надёжный путь mini → main (события между webview на Windows часто глохнут)
  try { window.electronAPI?.miniCmd?.(action, value); } catch {}
}

function MiniIcoBtn({ onClick, children, w = 32, dim, title }) {
  const armed = useRef(false);
  return (
    <button type="button" className="mini-hit" title={title}
      onPointerDown={e => {
        if (e.button !== 0) return;
        e.stopPropagation();
        armed.current = true;
        onClick?.(e);
      }}
      onClick={e => {
        e.stopPropagation();
        if (armed.current) { armed.current = false; e.preventDefault(); return; }
        onClick?.(e);
      }}
      style={{
        width:w, height:w, borderRadius:10, border:'none', background:'none',
        display:'flex', alignItems:'center', justifyContent:'center',
        cursor:'pointer', color: dim ? 'rgba(255,255,255,0.38)' : 'rgba(255,255,255,0.88)', flexShrink:0,
        WebkitAppRegion:'no-drag', pointerEvents:'auto', position:'relative', zIndex:2,
      }}
      onMouseEnter={e => { e.currentTarget.style.background='rgba(255,255,255,0.06)'; }}
      onMouseLeave={e => { e.currentTarget.style.background='none'; }}>
      {children}
    </button>
  );
}

function MiniVolBar({ value, onLive, onCommit }) {
  const ref = useRef(null);
  const drag = useRef(false);
  const apply = (e, commit) => {
    const el = ref.current;
    if (!el) return;
    const r = el.getBoundingClientRect();
    const v = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
    onLive?.(v);
    if (commit) onCommit?.(v);
  };
  useEffect(() => {
    const move = e => { if (drag.current) apply(e, false); };
    const up = e => { if (!drag.current) return; drag.current = false; apply(e, true); };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
    return () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); };
  }, []);
  const pct = Math.round((value || 0) * 100);
  return (
    <div ref={ref} className="mini-hit" onMouseDown={e => { drag.current = true; apply(e, false); }}
      style={{ flex:1, height:14, display:'flex', alignItems:'center', cursor:'pointer', minWidth:48 }}>
      <div style={{ width:'100%', height:3, borderRadius:99, background:'rgba(255,255,255,0.1)', overflow:'hidden', position:'relative' }}>
        <div style={{
          width: pct + '%', height:'100%', borderRadius:99,
          background:'linear-gradient(90deg, rgba(var(--accent-rgb),0.55), rgb(var(--accent-rgb)))',
        }}/>
      </div>
    </div>
  );
}

                    : <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7L8 5z"/></svg>}

    if (!scPlayingTrack || !isPlaying) { setSomeoneElse(false); return; }

    try { tok = localStorage.getItem('aoiPulseTok') || ''; } catch {}
    if (!tok) {
      tok = Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
      try { localStorage.setItem('aoiPulseTok', tok); } catch {}
    }
    let stop = false;
    const beat = async () => {
      if (stop) return;
      const n = await window.AoiRooms?.pulse?.(String(scPlayingTrack.id), tok);
      if (!stop) setSomeoneElse(n > 1);
    };
    beat();
    const id = setInterval(beat, 40000);
    return () => { stop = true; clearInterval(id); };
  }, [scPlayingTrack?.id, isPlaying]);

  useEffect(() => {
    const bump = () => { lastActivityRef.current = Date.now(); };
    const onVis = () => { if (document.visibilityState === 'visible') bump(); };
    window.addEventListener('mousemove', bump, { passive: true });
    window.addEventListener('keydown', bump, { passive: true });
    window.addEventListener('mousedown', bump, { passive: true });
    window.addEventListener('wheel', bump, { passive: true });
    document.addEventListener('visibilitychange', onVis);
    return () => {
      window.removeEventListener('mousemove', bump);
      window.removeEventListener('keydown', bump);
      window.removeEventListener('mousedown', bump);
      window.removeEventListener('wheel', bump);
      document.removeEventListener('visibilitychange', onVis);
    };
  }, []);

  useEffect(() => {
    if (!settingsHydrated) return;
    if (settings.presenceEnabled === false) {
      setPresenceConnected(false);
      try { window.AoiRooms?.presenceLeave?.(); } catch {}
