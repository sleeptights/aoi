    }
    const api = window.AoiRooms;
    if (!api?.presenceBeat) return;
    presenceTokenRef.current = api.presenceToken?.() || '';
    let stop = false;
    const beat = async () => {
      if (stop) return;
      const hidden = document.visibilityState !== 'visible';
      const idleMs = Date.now() - lastActivityRef.current;
      const activeTrack = scPlayingTrackRef.current || tracksRef.current[trackIdxRef.current];
      const hasTrack = !!(activeTrack && activeTrack.title);
      const listening = isPlayingRef.current && hasTrack;
      const status = computePresenceStatus({ isPlaying: listening, hasTrack, hidden, idleMs });
      const p = roomProfileOf(settings.soundcloudAuth);
      const res = await api.presenceBeat({
        name: p.name,
        avatar: p.avatar,
        uid: p.uid,
        profile: scProfileUrl(settings.soundcloudAuth),
        status,
        trackTitle: listening && activeTrack ? (activeTrack.title || '') : '',
        trackArtist: listening && activeTrack ? (activeTrack.artist || '') : '',
      });
      if (!stop) {
        setPresenceConnected(!!(res && res.ok));
        if (res && Array.isArray(res.invites) && res.invites.length) {
          setSettings(s => {
            let notifications = Array.isArray(s.notifications) ? s.notifications.slice() : [];
            let changed = false;
            for (const inv of res.invites) {
              if (!inv || !inv.id || seenInviteRef.current.has(inv.id)) continue;
              seenInviteRef.current.add(inv.id);
              if (notifications.some(n => n.id === 'inv:' + inv.id)) continue;
              const title = t('notif_invite');
              const body = t('notif_invite_from')
                .replace('{name}', inv.fromName || 'friend')
                .replace('{code}', inv.roomCode || '');
              notifications = [{
                id: 'inv:' + inv.id,
                type: 'invite',
                title,
                body,
                at: inv.at || Date.now(),
                read: false,
                meta: { roomCode: inv.roomCode, fromName: inv.fromName, fromAvatar: inv.fromAvatar },
              }, ...notifications].slice(0, 40);
              changed = true;
            }
            return changed ? { ...s, notifications } : s;
          });
        }
      }
    };
    beat();
    const id = setInterval(beat, 30000);
    const onVis = () => { if (document.visibilityState === 'visible') beat(); };
    document.addEventListener('visibilitychange', onVis);
    const onUnload = () => { try { api.presenceLeave?.(); } catch {} };
    window.addEventListener('beforeunload', onUnload);
    return () => {
      stop = true;
      clearInterval(id);
      document.removeEventListener('visibilitychange', onVis);
      window.removeEventListener('beforeunload', onUnload);
    };
  }, [settingsHydrated, settings.presenceEnabled, settings.soundcloudAuth?.username, settings.soundcloudAuth?.avatarUrl, settings.soundcloudAuth?.userId, isPlaying, track?.id, scPlayingTrack?.id]);

  useEffect(() => {
    if (!settingsHydrated) return;

            ...s,

              type: 'update',
              title: t('notif_update') + ' · ' + ver,
              body,
              at: Date.now(),
              read: false,
              meta: { version: ver, url: info.url, sha256: info.sha256 || '' },

          };
        });
      } catch {}
    };
    if (!updateCheckedRef.current) {
      updateCheckedRef.current = true;

    const id = setInterval(check, 6 * 60 * 60 * 1000);

  }, [settingsHydrated]);

  // computed app-wide accent: cover-derived when mode='cover', otherwise preset
  const appAccent = useMemo(() => {
    if (settings.accentMode === 'cover' && accentRGB) {
      // boost too-dark colors so var(--accent) text stays readable
      let { r, g, b } = accentRGB;
      const lum = (r + g + b) / 3;
      if (lum < 110) {
        const k = 110 / Math.max(1, lum);
        r = Math.min(255, Math.round(r * k));
        g = Math.min(255, Math.round(g * k));
        b = Math.min(255, Math.round(b * k));
      }
      return { r, g, b };
    }
    return ACCENT_PRESETS[settings.accentMode] || ACCENT_PRESETS.default;
  }, [settings.accentMode, accentRGB]);

  const appAccentRef = useRef(appAccent);
  appAccentRef.current = appAccent;

  // push accent to CSS var so var(--accent) works everywhere — lerp RGB on track change
  useEffect(() => {
    const to = appAccent;
    const raw = (document.documentElement.style.getPropertyValue('--accent-rgb') || '').split(',').map(n => parseInt(n, 10));
    const from = {
      r: Number.isFinite(raw[0]) ? raw[0] : to.r,
      g: Number.isFinite(raw[1]) ? raw[1] : to.g,
      b: Number.isFinite(raw[2]) ? raw[2] : to.b,
    };
    const apply = (c) => {
      document.documentElement.style.setProperty('--accent', `rgb(${c.r}, ${c.g}, ${c.b})`);
      document.documentElement.style.setProperty('--accent-rgb', `${c.r}, ${c.g}, ${c.b}`);
    };
    if (from.r === to.r && from.g === to.g && from.b === to.b) { apply(to); return; }
    let raf;
    const start = performance.now();
    const dur = 560;
    const tick = (now) => {
      const t = Math.min(1, (now - start) / dur);
      const e = 1 - Math.pow(1 - t, 3);
      apply({
        r: Math.round(from.r + (to.r - from.r) * e),
        g: Math.round(from.g + (to.g - from.g) * e),
        b: Math.round(from.b + (to.b - from.b) * e),
      });
      if (t < 1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [appAccent]);

  // titlebar accent glow — only in player view
  useEffect(() => {

  /* загружаем настройки и треки при старте */
  useEffect(() => {
    (async () => {
      try {
        const saved = await window.electronAPI.loadSettings();

  /* сохраняем настройки при изменении */
  useEffect(() => {
    if (!settingsHydrated) return;
    const toSave = settings.soundcloudAuth ? settings : { ...settings, sourceMode: 'local' };
    try { window.electronAPI.saveSettings(toSave); } catch {}

  useEffect(() => {
    try { window.electronAPI.setLoginItem?.(settings.startWithWindows); } catch {}
  }, [settings.startWithWindows]);

  useEffect(() => {
    const auth = settings.soundcloudAuth;
    if (!auth || !auth.token || !auth.clientId || auth.username) return;
    let cancelled = false;
    window.electronAPI.scFetch('https://api-v2.soundcloud.com/me', auth.token, auth.clientId).then(res => {
      if (cancelled || !res?.data?.username) return;
      setSettings(s => {

        return {
          ...s,

            ...s.soundcloudAuth,

            userId: res.data.id || s.soundcloudAuth.userId,
            avatarUrl: res.data.avatar_url || s.soundcloudAuth.avatarUrl,
          },

    const onTime = (e) => {
      const audio = e.target;
      if (audio !== audioRef.current) return;
      if (!audio.duration || !isFinite(audio.duration)) return;
      progressRef.current = audio.currentTime / audio.duration;

      if (cf <= 0 || !isPlayingRef.current) return;
      const win = Math.min(cf, Math.max(0.45, audio.duration * 0.35));
      const remaining = audio.duration - audio.currentTime;
      if (audio.duration > win + 0.4 && remaining <= win && remaining > 0.05) {
        cfLockRef.current = true;
        handleNextRef.current?.('fade');

      const audio = e.target;

      }
      if (cfLockRef.current || aftertasteRef.current || peekingRef.current || finishingBarRef.current) return;
      handleNextRef.current?.('ended');
    };

      el.addEventListener('timeupdate', onTime);
      el.addEventListener('ended', onEnded);
    });

    return () => {
      document.removeEventListener('pointerdown', wake, { capture: true });
      [a, b].forEach(el => {
        el.removeEventListener('timeupdate', onTime);
        el.removeEventListener('ended', onEnded);

    progressRef.current = 0;
    setLoadingTrackId(scTrack.id);

    const auth = scAuthRef.current;
    if (!auth) { setLoadingTrackId(null); trackSwitchingRef.current = false; return; }

    if (!autoSkip && shuffle) {
      const list = stationQueueRef.current || searchQueueRef.current || playlistQueueRef.current || (searchRef.current ? filteredScRef.current : scTracksRef.current);
      scShuffleOrderRef.current = buildScShuffle(list, scTrack.id);
      scShuffleIdxRef.current = 0;
    }

    const markError = () => {
      clearTimeout(errorTimerRef.current);
      setErrorTrackId(scTrack.id);
      errorTimerRef.current = setTimeout(() => setErrorTrackId(null), 2200);
    };

    const skipInDirection = () => {
      const list = stationQueueRef.current || searchQueueRef.current || playlistQueueRef.current || (searchRef.current ? filteredScRef.current : scTracksRef.current);
      if (shuffle) {
        const order = scShuffleOrderRef.current;
        const ni = scShuffleIdxRef.current + direction;
        if (skipCount < order.length && ni >= 0 && ni < order.length) {
          scShuffleIdxRef.current = ni;
          const nextTrack = list.find(t => t.id === order[ni]);
          if (nextTrack) { handleScTrackClick(nextTrack, scTracksRef.current.indexOf(nextTrack), true, skipCount + 1, direction); return; }
        }
        if (repeat === 'all' && direction > 0 && skipCount < order.length) {
          const newOrder = buildScShuffle(list, null);
          scShuffleOrderRef.current = newOrder;
          scShuffleIdxRef.current = 0;
          const nextTrack = list.find(t => t.id === newOrder[0]);
          if (nextTrack) handleScTrackClick(nextTrack, scTracksRef.current.indexOf(nextTrack), true, skipCount + 1, direction);
          else setIsPlaying(false);
        } else { setIsPlaying(false); }
        return;
      }
      const curIdx = list.findIndex(t => t.id === scTrack.id);
      const ni = curIdx + direction;
      if (skipCount < list.length && ni >= 0 && ni < list.length) {
        handleScTrackClick(list[ni], scTracksRef.current.indexOf(list[ni]), true, skipCount + 1, direction);
      } else if (repeat === 'all' && direction > 0 && skipCount < list.length) {
        handleScTrackClick(list[0], scTracksRef.current.indexOf(list[0]), true, skipCount + 1, direction);
      } else {
        setIsPlaying(false);
      }
    };

    if (!scTrack.streamUrl && !scTrack.hlsUrl) {
      if (gen !== scClickGenRef.current) return;
      trackSwitchingRef.current = false;
      setLoadingTrackId(null);
      markError();
      if (autoSkip) { skipInDirection(); }
      return;
    }

    let resolvedUrl = null;
    let isHls = false;

    if (scTrack.streamUrl) {
      const res = await window.electronAPI.scFetch(scTrack.streamUrl, auth.token, auth.clientId);
      if (gen !== scClickGenRef.current) return;
      if (res.data?.url) resolvedUrl = res.data.url;
    }
    if (!resolvedUrl && scTrack.hlsUrl) {
      const res = await window.electronAPI.scFetch(scTrack.hlsUrl, auth.token, auth.clientId);
      if (gen !== scClickGenRef.current) return;
      if (res.data?.url) { resolvedUrl = res.data.url; isHls = true; }
    }

    if (!resolvedUrl) {
      if (gen !== scClickGenRef.current) return;
      trackSwitchingRef.current = false;
      setLoadingTrackId(null);
      cfLockRef.current = false;
      markError();
      if (autoSkip) { skipInDirection(); }
      return;
    }

    if (gen !== scClickGenRef.current) return;
    const resolved = { ...scTrack, resolvedUrl };
    playSrcCacheRef.current[String(scTrack.id)] = resolvedUrl;
    setScPlayingTrack(resolved);

    const swap = beginTrackChange();
    const audio = swap.audio;
    if (!audio) { setLoadingTrackId(null); return; }
    const shouldPlay = applyingRoomRef.current ? !!roomApplyWantPlayRef.current : true;
    try { audio.crossOrigin = 'anonymous'; } catch {}

    audio.addEventListener('playing', () => {
      if (gen !== scClickGenRef.current) return;
      trackSwitchingRef.current = false;
      if (swap.overlap) startOverlapFade(swap.outgoing, audio, swap.cf);
      else startFadeIn(audio);
    }, { once: true });

    if (isHls && typeof Hls !== 'undefined' && Hls.isSupported()) {
      const hls = new Hls();
      hlsRef.current = hls;
      hls.loadSource(resolvedUrl);
      hls.attachMedia(audio);
      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        if (gen !== scClickGenRef.current) return;
        if (shouldPlay) {
          playAudio(audio).then(() => setLoadingTrackId(null)).catch(() => { setLoadingTrackId(null); setIsPlaying(false); });
          setIsPlaying(true);
        } else {
          setLoadingTrackId(null);
          setIsPlaying(false);
        }
      });
      hls.on(Hls.Events.LEVEL_LOADED, (_, data) => {
        if (gen !== scClickGenRef.current) return;
        const dur = Math.floor(data.details.totalduration || 0);
        if (dur) setScPlayingTrack(prev => prev ? { ...prev, duration: dur } : prev);
      });
    } else {
      audio.src = resolvedUrl;
      audio.load();
      audio.addEventListener('loadedmetadata', () => {
        if (gen !== scClickGenRef.current) return;
        const dur = Math.floor(audio.duration);
        if (dur) setScPlayingTrack(prev => prev ? { ...prev, duration: dur } : prev);
      }, { once: true });
      if (shouldPlay) {
        playAudio(audio).then(() => setLoadingTrackId(null)).catch(() => { setLoadingTrackId(null); setIsPlaying(false); });
        setIsPlaying(true);
      } else {
        setLoadingTrackId(null);
        setIsPlaying(false);
      }
    }
  }


  async function selectTrack(t) {
    if (roomRef.current.role === 'guest') { showToast(t('room_host_controls')); return; }
    const startPlayLocal = (idx) => {
      setScPlayingTrack(null);
      setTrackIdx(idx);
      progressRef.current = 0;
      setIsPlaying(true);
    };
    const startPlay = () => {
      playlistQueueRef.current = null;
      searchQueueRef.current = null;
      if (sourceMode === 'sc') {
        const scIdx = scTracks.indexOf(t);
        if (scIdx >= 0) handleScTrackClick(t, scIdx);
      } else {
        const li = tracks.indexOf(t);
        if (li >= 0) startPlayLocal(li);
      }
    };

    if (view === 'player') {
      startPlay();
      return;
    }

    // scroll target card into view if needed (mirrors handleNav home→player)
    const initialEl = artRefs.current[t.id];
    const scrollEl = homeScrollRef.current;
    if (initialEl && scrollEl) {
      const box = scrollEl.getBoundingClientRect();
      const cr  = initialEl.getBoundingClientRect();
      if (cr.top < box.top || cr.bottom > box.bottom) {
        const offset = cr.top - box.top + scrollEl.scrollTop;
        scrollEl.scrollTop = Math.max(0, offset - box.height / 2 + cr.height / 2);
        await new Promise(r => requestAnimationFrame(r));
      }
    }

    const artEl = artRefs.current[t.id];
    const par = playerArtRef.current?.getBoundingClientRect();

    if (artEl && par) {
      const startRect = artEl.getBoundingClientRect();
      const targetRect = { left: par.left, top: par.top, size: par.width };
      startPlay();
      setHero({ track: t, startRect, targetRect });
      setHomeVisible(false);
      setPlayerVisible(true);
      setView('player');
      setNavActive('library');
      setLibScrollTargetId(t.id);
      setLibScrollTrigger(v => v + 1);
      setTimeout(() => setHeroExiting(true), HERO_DUR_MS - 80);
      setTimeout(() => { setHero(null); setHeroExiting(false); }, HERO_DUR_MS - 80 + HERO_FADE_MS + 20);
    } else {
      // refs not ready — skip hero, just switch view
      startPlay();
      setHomeVisible(false);
      setPlayerVisible(true);
      setView('player');
      setNavActive('library');
      setLibScrollTargetId(t.id);
      setLibScrollTrigger(v => v + 1);
    }
  }

  const selectTrackRef = useRef(null);
  selectTrackRef.current = selectTrack;
  const selectTrackStable = useCallback((t) => selectTrackRef.current(t), []);

  const likedIds = useMemo(() => {
    const s = new Set();
    scTracks.forEach(t => {
      if (t?.id == null) return;
      s.add(t.id);
      s.add(String(t.id));
    });
    return s;
  }, [scTracks]);

  const ensureScUserId = useCallback(async () => {
    const auth0 = scAuthRef.current;
    if (!auth0) return null;
    if (auth0.userId) return auth0;
    const me = await window.electronAPI.scFetch('https://api-v2.soundcloud.com/me', auth0.token, auth0.clientId);
    const id = me?.data?.id;
    if (!id) return null;
    const auth = { ...auth0, userId: id, username: me.data.username || auth0.username, avatarUrl: me.data.avatar_url || auth0.avatarUrl };
    scAuthRef.current = auth;
    setSettings(s => ({ ...s, soundcloudAuth: { ...(s.soundcloudAuth || {}), ...auth } }));
    return auth;
  }, []);

  const handleLike = useCallback(async (track) => {
    if (likingRef.current || !track?.id) return;
    const auth = await ensureScUserId();
    if (!auth) return;
    const already = scTracksRef.current.some(t => String(t.id) === String(track.id));
    const tid = String(track.id);
    const uid = String(auth.userId);
    likingRef.current = true;
    if (already) {
      setScTracks(prev => prev.filter(x => String(x.id) !== tid));
      scCacheRef.current = scCacheRef.current.filter(x => String(x.id) !== tid);
      scCacheMapRef.current.delete(track.id);
      scCacheMapRef.current.delete(tid);
    } else {
      setScTracks(prev => [track, ...prev.filter(x => String(x.id) !== tid)]);
      scCacheRef.current = [track, ...scCacheRef.current.filter(x => String(x.id) !== tid)];
      scCacheMapRef.current.set(track.id, track);
    }
    const tryLike = async (url, method) => {
      try {
        return await window.electronAPI.scFetch(url, auth.token, auth.clientId, method);
      } catch (e) {
        return { error: String(e) };
      }
    };
    try {
      const res = await tryLike(
        `https://api-v2.soundcloud.com/users/${uid}/track_likes/${tid}`,
        already ? 'DELETE' : 'PUT'
      );
      if (scFailed(res)) {
        if (already) {
          setScTracks(prev => [track, ...prev.filter(x => String(x.id) !== tid)]);
          scCacheRef.current = [track, ...scCacheRef.current.filter(x => String(x.id) !== tid)];
          scCacheMapRef.current.set(track.id, track);
          showToast(t('unlike_err'));
        } else {
          setScTracks(prev => prev.filter(x => String(x.id) !== tid));
          scCacheRef.current = scCacheRef.current.filter(x => String(x.id) !== tid);
          scCacheMapRef.current.delete(track.id);
          scCacheMapRef.current.delete(tid);
          showToast(t('like_err'));
        }
        return;
      }
      window.electronAPI.scSaveLikesCache(scCacheRef.current);
    } finally {
      likingRef.current = false;
    }
  }, [ensureScUserId, t]);

  const handleFollow = useCallback(async (userId, currentlyFollowing) => {
    const auth = await ensureScUserId();
    if (!auth || !userId) return false;
    const uid = String(userId).replace(/^soundcloud:users:/, '');
    const urls = [
      `https://api-v2.soundcloud.com/me/followings/${uid}`,
      `https://api.soundcloud.com/me/followings/${uid}`,
    ];
    const method = currentlyFollowing ? 'DELETE' : 'PUT';
    let res = { error: true };
    for (const url of urls) {
      try {
        res = await window.electronAPI.scFetch(url, auth.token, auth.clientId, method);
      } catch (e) {
        res = { error: String(e) };
      }
      if (!scFailed(res)) break;
    }
    if (scFailed(res) && !currentlyFollowing) {
      try {
        res = await window.electronAPI.scFetch(urls[0], auth.token, auth.clientId, 'POST');
      } catch (e) {
        res = { error: String(e) };
      }
    }
    if (scFailed(res)) {
      showToast(currentlyFollowing ? t('unfollow_err') : t('follow_err'));
      return null;
    }
    if (currentlyFollowing) followedIdsRef.current.delete(userId);
    else followedIdsRef.current.add(userId);
    return !currentlyFollowing;
  }, [ensureScUserId, t]);

  const handleStartStation = useCallback(async (track) => {
    if (roomRef.current.role === 'guest') { showToast(t('room_host_controls')); return; }
    const auth = scAuthRef.current;
    if (!auth || !track?.id) { showToast(t('station_err')); return; }
    const untitled = STRINGS[langRef.current]?.no_title ?? 'Без названия';
    const mapItems = (res) => {
      const items = Array.isArray(res?.data) ? res.data : (res?.data?.collection || []);
      return items
        .map(it => mapScTrack(it.track || it, untitled))
        .filter(x => x.id);
    };
    try {
      let mapped = [];
      const station = await window.electronAPI.scFetch(
        `https://api-v2.soundcloud.com/stations/soundcloud:track-stations:${track.id}/tracks?limit=50`,
        auth.token, auth.clientId
      );
      mapped = mapItems(station);
      if (!mapped.length) {
        const related = await window.electronAPI.scFetch(
          `https://api-v2.soundcloud.com/tracks/${track.id}/related?limit=50`,
          auth.token, auth.clientId
        );
        mapped = mapItems(related);
      }
      if (!mapped.length) { showToast(t('station_err')); return; }
      if (!mapped.some(x => String(x.id) === String(track.id))) {
        mapped = [track, ...mapped];
      }
      stationQueueRef.current = mapped;
      playlistQueueRef.current = null;
      searchQueueRef.current = null;
      setStationActive({ origTrack: track, tracks: mapped });
      setPlayerVisible(true);
      setView('player');
      setNavActive('library');
      handleScTrackClick(mapped[0], -1);
    } catch {
      showToast(t('station_err'));
    }
  }, [t]);

  const handleExitStation = useCallback(() => {
    stationQueueRef.current = null;
    setStationActive(null);
  }, []);

  const handleCopyTrackLink = useCallback(async (track) => {
    if (!track?.permalinkUrl) { showToast(t('copy_link_err')); return; }
    const auth = scAuthRef.current;
    let link = track.permalinkUrl;
    if (auth) {
      try {
        const res = await window.electronAPI.scFetch(
          `https://api-v2.soundcloud.com/share/short-link?url=${encodeURIComponent(track.permalinkUrl)}`,
          auth.token, auth.clientId
        );
        const short = res?.data?.short_url || res?.data?.shortUrl;
        if (short) link = short;
      } catch {}
    }
    try {
      await navigator.clipboard.writeText(link);
      showToast(t('link_copied'));
    } catch {
      showToast(t('copy_link_err'));
    }
  }, [t]);

  const checkFollow = useCallback(async (userId) => {
    if (!userId) return false;
    if (followedIdsRef.current.has(userId)) return true;
    const auth = scAuthRef.current;
    if (!auth) return false;
    const res = await window.electronAPI.scFetch(
      `https://api-v2.soundcloud.com/me/followings/${userId}`,
      auth.token, auth.clientId
    );
    const following = !scFailed(res) && res.data;
    if (following) followedIdsRef.current.add(userId);
    return !!following;
  }, []);

  const sortedTracks = useMemo(() => {
    const arr = [...tracks];
    if (sort === 'artist')   arr.sort((a, b) => a.artist.localeCompare(b.artist) || a.title.localeCompare(b.title));
    else if (sort === 'title')    arr.sort((a, b) => a.title.localeCompare(b.title));
    else if (sort === 'duration') arr.sort((a, b) => (b.duration || 0) - (a.duration || 0));
    return arr;
  }, [tracks, sort]);

  const searchLower = useMemo(() => search.toLowerCase(), [search]);
  const filtered = useMemo(() =>
    sortedTracks.filter(t =>
      t.title.toLowerCase().includes(searchLower) ||
      t.artist.toLowerCase().includes(searchLower)
    ),
  [sortedTracks, searchLower]);
  filteredRef.current = filtered;
  const filteredSc = useMemo(() =>
    scTracks.filter(t =>
      t.title.toLowerCase().includes(searchLower) ||
      t.artist.toLowerCase().includes(searchLower)
    ),
  [scTracks, searchLower]);
  filteredScRef.current = filteredSc;
  const activeList = sourceMode === 'sc' ? filteredSc : filtered;
  const activeListPlayingId = sourceMode === 'sc'
    ? (scPlayingTrack ? scPlayingTrack.id : null)
    : (scPlayingTrack ? null : track?.id);

  const showWelcome = !settings.musicFolder && !settings.soundcloudAuth;

  const handlePickFolderFromWelcome = async () => {
    const folder = await window.electronAPI.selectMusicFolder();
    if (folder) {
      setSettings(s => ({ ...s, musicFolder: folder }));
      handleScanTracks(folder);
    }
  };

  const snapshotTrack = (tr) => ({
    id: tr.id,
    path: tr.path || null,
    title: tr.title,
    artist: tr.artist,
    coverUrl: tr.coverUrl || tr.artworkUrl || null,
    duration: tr.duration || 0,
    streamUrl: tr.streamUrl || null,
    hlsUrl: tr.hlsUrl || null,
    permalinkUrl: tr.permalinkUrl || null,
    artistId: tr.artistId || null,
    artworkUrl: tr.artworkUrl || tr.coverUrl || null,
  });

  const handleAddToPlaylist = (tr, playlistId) => {
    if (!tr) return;
    const snap = snapshotTrack(tr);
    setSettings(s => {
      const lists = [...(s.playlists || [])];
      if (!playlistId) {
        lists.push({ id: 'pl_' + Date.now(), name: (STRINGS[lang]?.playlist_new || 'playlist') + ' ' + (lists.length + 1), items: [snap] });
        return { ...s, playlists: lists };
      }
      return {
        ...s,
        playlists: lists.map(p => {
          if (p.id !== playlistId) return p;
          const exists = (p.items || []).some(x => String(x.id) === String(snap.id) || (snap.path && x.path === snap.path));
          if (exists) return p;
          return { ...p, items: [...(p.items || []), snap] };
        }),
      };
    });
    showToast(t('playlist_added'));
  };

  const handleCreatePlaylist = () => {
    setSettings(s => {
      const lists = [...(s.playlists || [])];
      const id = 'pl_' + Date.now();
      lists.push({ id, name: (STRINGS[lang]?.playlist_new || 'playlist') + ' ' + (lists.length + 1), items: [] });
      return { ...s, playlists: lists };
    });
  };

  const handleRenamePlaylist = (id, name) => {
    const trimmed = (name || '').trim();
    if (!trimmed) return;
    setSettings(s => ({
      ...s,
      playlists: (s.playlists || []).map(p => p.id === id ? { ...p, name: trimmed } : p),
    }));
  };

  const handleDeletePlaylist = (id) => {
    setOpenPlaylistId(null);
    setSettings(s => ({ ...s, playlists: (s.playlists || []).filter(p => p.id !== id) }));
  };

  const handleRemovePlaylistItem = (id, index) => {
    setSettings(s => ({
      ...s,
      playlists: (s.playlists || []).map(p => p.id === id ? { ...p, items: (p.items || []).filter((_, i) => i !== index) } : p),
    }));
  };

  const handleNav = async (id) => {
    if (!settings.soundcloudAuth && id === 'search') return;
    setNavActive(id);
    if (id === 'home') {
      if (view === 'player') {
        const artEl = artRefs.current[track.id];
        const par = playerArtRef.current?.getBoundingClientRect();
        if (artEl && par) {
          const scrollEl = homeScrollRef.current;
          if (scrollEl) {
            const box     = scrollEl.getBoundingClientRect();
            const cr      = artEl.getBoundingClientRect();
            const visible = cr.top >= box.top && cr.bottom <= box.bottom;
            if (!visible) {
              const cardOffsetInScroll = cr.top - box.top + scrollEl.scrollTop;
              const targetTop = Math.max(0, cardOffsetInScroll - box.height / 2 + cr.height / 2);
              scrollEl.scrollTop = targetTop;
            }
          }

          const cardRect = artEl.getBoundingClientRect();
          setReverseHero({
            track: track,
            targetRect: { left: par.left, top: par.top, size: par.width },
            startRect:  { left: cardRect.left, top: cardRect.top, width: cardRect.width, height: cardRect.height },
          });
          setTimeout(() => setReverseHeroExiting(true), HERO_DUR_MS - 80);
          setTimeout(() => { setReverseHero(null); setReverseHeroExiting(false); }, HERO_DUR_MS - 80 + HERO_FADE_MS + 20);
        }
        setPlayerVisible(false);
        setHomeVisible(true);
        setView('home');
      } else if (view === 'settings' || view === 'soundcloud' || view === 'search' || view === 'artist' || view === 'playlists' || view === 'rooms') {
        setHomeVisible(true);
        setView('home');
      }
    } else if (id === 'search') {
      if (view === 'home') setHomeVisible(false);
      if (view === 'player') setPlayerVisible(false);
      setView('search');
    } else if (id === 'playlists') {
      if (view === 'home') setHomeVisible(false);
      if (view === 'player') setPlayerVisible(false);
      setView('playlists');
    } else if (id === 'rooms') {
      if (view === 'home') setHomeVisible(false);
      if (view === 'player') setPlayerVisible(false);
      setView('rooms');
    } else if (id === 'soundcloud') {
      if (view === 'home') setHomeVisible(false);
      if (view === 'player') setPlayerVisible(false);
      setTimeout(() => setView('soundcloud'), view === 'home' ? 240 : 300);
    } else if (id === 'settings') {
      if (view === 'player') setPlayerVisible(false);
      if (view === 'home') setHomeVisible(false);
      setTimeout(() => setView('settings'), view === 'home' ? 240 : 300);
    } else if (view === 'home') {
      const artEl = artRefs.current[track.id];
      const par = playerArtRef.current?.getBoundingClientRect();
      if (artEl && par) {
        const scrollEl = homeScrollRef.current;
        if (scrollEl) {
          const box = scrollEl.getBoundingClientRect();
          const cr  = artEl.getBoundingClientRect();
          if (cr.top < box.top || cr.bottom > box.bottom) {
            const offset = cr.top - box.top + scrollEl.scrollTop;
            scrollEl.scrollTop = Math.max(0, offset - box.height / 2 + cr.height / 2);
            await new Promise(r => requestAnimationFrame(r));
          }
        }
        const startRect = artEl.getBoundingClientRect();
        const targetRect = { left: par.left, top: par.top, size: par.width };
        setHero({ track: track, startRect, targetRect });
        setTimeout(() => setHeroExiting(true), HERO_DUR_MS - 80);
        setTimeout(() => { setHero(null); setHeroExiting(false); }, HERO_DUR_MS - 80 + HERO_FADE_MS + 20);
      }
      setHomeVisible(false);
      setPlayerVisible(true);
      setView('player');
    } else if (view === 'settings') {
      setPlayerVisible(true);
      setView('player');
    } else if (view === 'soundcloud') {
      setTimeout(() => { setPlayerVisible(true); setView('player'); }, 240);
    } else if (view === 'search') {
      setPlayerVisible(true);
      setView('player');
    } else if (view === 'playlists') {
      setPlayerVisible(true);
      setView('player');
    } else if (view === 'rooms') {
      setPlayerVisible(true);
      setView('player');
    } else if (view === 'artist') {
      setPlayerVisible(true);
      setView('player');
    }
  };

  if (!track) return null;

  return (
    <LangContext.Provider value={lang}>
    <BreathingBorder isPlaying={isPlaying}/>
    <div style={{display:'flex', width:'100%', height:'100%', overflow:'hidden'}}>
      {hero && hero.targetRect && <HeroClone hero={hero} exiting={heroExiting}/>}
      {reverseHero && reverseHero.targetRect && <HeroClone hero={reverseHero} exiting={reverseHeroExiting} reverse={true}/>}
      {avatarFly && <AvatarFlyClone fly={avatarFly} exiting={avatarFlyExiting}/>}
      <Sidebar navActive={navActive} onNav={handleNav}
        libCollapsed={libCollapsed} onToggleLib={()=>setLibCollapsed(v=>!v)}
        inPlayer={view==='player'} scAuth={settings.soundcloudAuth||null} profileRef={sidebarProfileRef}
        roomLive={!!(room.role)}
        sourceMode={sourceMode} onToggleSource={handleToggleSource} avatarFlying={avatarFlying}/>

      <div style={{position:'relative', flex:1, height:'100%', overflow:'hidden'}}>

              display:'flex', alignItems:'center', justifyContent:'center',
              cursor:'pointer', userSelect:'none',
              color: eqOpen ? 'var(--accent)' : 'rgba(255,255,255,0.28)', transition:'color 0.2s ease',
            }}
            onMouseEnter={e => { if (!eqOpen) e.currentTarget.style.color='rgba(255,255,255,0.62)'; }}
            onMouseLeave={e => { e.currentTarget.style.color = eqOpen ? '' : 'rgba(255,255,255,0.28)'; }}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
              <rect x="4" y="12" width="3" height="8" rx="1"/>
              <rect x="10.5" y="6" width="3" height="14" rx="1"/>
              <rect x="17" y="9" width="3" height="11" rx="1"/>
            </svg>
          </div>
          {eqOpen && (
            <EqPopover
              gains={settings.eqGains || EQ_ZERO}
              eqId={settings.eqId || eqIdOf(settings.eqGains, settings.eqCustom)}
              custom={settings.eqCustom || []}
              onGains={(g) => { applyEqGains(g); setSettings(s => ({ ...s, eqGains: g, eqId: eqIdOf(g, s.eqCustom) })); }}
              onPreset={(id, g) => { applyEqGains(g); setSettings(s => ({ ...s, eqGains: g, eqId: id })); }}
              onSave={(name, g) => {
                applyEqGains(g);
                setSettings(s => {
                  const rest = (s.eqCustom || []).filter(c => c.name !== name);
                  return { ...s, eqCustom: [{ name, gains: g }, ...rest].slice(0, 8), eqId: 'u:' + name, eqGains: g };
                });
                showToast(t('eq_saved'));
              }}
              onDelete={(name) => {
                setSettings(s => {
                  const eqCustom = (s.eqCustom || []).filter(c => c.name !== name);
                  const nextId = s.eqId === 'u:' + name ? 'flat' : s.eqId;
                  const nextG = nextId === 'flat' ? EQ_ZERO : s.eqGains;
                  if (nextId === 'flat') applyEqGains(EQ_ZERO);
                  return { ...s, eqCustom, eqId: nextId, eqGains: nextG };
                });
              }}
              onClose={() => setEqOpen(false)}
            />
          )}
          <div onClick={goMini} title={t('mini_player')}
            style={{
              width:28, height:28, flexShrink:0, marginTop:6,
              display:'flex', alignItems:'center', justifyContent:'center',
              cursor:'pointer', userSelect:'none',
              color:'rgba(255,255,255,0.28)', transition:'color 0.2s ease',
            }}
            onMouseEnter={e => { e.currentTarget.style.color='rgba(255,255,255,0.62)'; }}
            onMouseLeave={e => { e.currentTarget.style.color='rgba(255,255,255,0.28)'; }}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round">
              <rect x="3" y="6" width="18" height="12" rx="2"/>
              <line x1="8" y1="10" x2="8" y2="14"/><line x1="12" y1="9" x2="12" y2="15"/><line x1="16" y1="11" x2="16" y2="13"/>
            </svg>
          </div>
          <div onClick={toggleSleep} title={sleepOn ? `${t('sleep_off')} · ${sleepRemain} мин` : t('sleep_on')}
            style={{
              width:28, height:36, flexShrink:0, marginTop:8,
              display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:1,
              cursor:'pointer', userSelect:'none',
              color: sleepOn ? 'var(--accent)' : 'rgba(255,255,255,0.32)',
              transition:'color 0.2s ease',
            }}>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
            {sleepOn && <span style={{fontSize:8, letterSpacing:'0.04em', fontVariantNumeric:'tabular-nums', opacity:0.85}}>{sleepRemain}</span>}
          </div>
        </div>
          </div>
        )}

        <SettingsView settings={settings} onSettings={setSettings} visible={view==='settings'} onScanTracks={handleScanTracks} onClearFolder={handleClearFolder} onClearCoversCache={handleClearCoversCache} onClearLikesCache={handleClearLikesCache} appAccent={appAccent} onOpenMini={goMini}/>
        <SoundCloudView
          visible={view==='soundcloud'}
          scAuth={settings.soundcloudAuth||null}
          onLogin={handleScLogin}
          onLogout={handleScLogout}
          avatarRef={scAvatarRef}
          presenceConnected={presenceConnected && settings.presenceEnabled !== false}
          presenceCount={(presencePeers || []).filter(p => !isPresenceBlocked(p, settings.blockedPresence || [])).length}
          presenceProfile={roomProfile}
          onOpenOnline={openOnlinePanel}
          onOpenOnlineCount={openOnlinePanel}
          notifUnread={(settings.notifications || []).filter(n => !n.read).length}
          onOpenNotifs={openNotifPanel}
        />
        <SearchView ref={searchViewRef} visible={view==='search'} scAuth={settings.soundcloudAuth||null}
          likedIds={likedIds} onLike={handleLike}
          onPlayTrack={(tr, queue) => { playlistQueueRef.current = null; stationQueueRef.current = null; searchQueueRef.current = queue || null; handleScTrackClick(tr, -1); }}
          onSelectTrack={(tr, queue) => { playlistQueueRef.current = null; stationQueueRef.current = null; searchQueueRef.current = queue || null; handleScTrackClick(tr, -1); setPlayerVisible(true); setView('player'); setNavActive('library'); }}
          onResultsLoaded={handleSearchResultsLoaded}
          onArtistClick={handleOpenArtist}
          loadingTrackId={loadingTrackId} errorTrackId={errorTrackId}
          hideDividers={settings.hideDividers}
          onContextMenu={(tr, x, y) => setTrackMenu({ track: tr, x, y })}/>
        <PlaylistView
          visible={view==='playlists'}
          playlists={settings.playlists || []}
          openId={openPlaylistId}
          onOpen={setOpenPlaylistId}
          onBack={() => setOpenPlaylistId(null)}
          onCreate={handleCreatePlaylist}
          onRename={handleRenamePlaylist}
          onDelete={handleDeletePlaylist}
          onRemoveItem={handleRemovePlaylistItem}
          onPlayTrack={(tr, items) => {
            playlistQueueRef.current = items || null;
            searchQueueRef.current = null;
            stationQueueRef.current = null;
            playPlaylistItem(tr);
            setPlayerVisible(true);
            setView('player');
            setNavActive('library');
          }}
          activeId={scPlayingTrack?.id || track?.id}
          loadingTrackId={loadingTrackId}
          errorTrackId={errorTrackId}
          hideDividers={settings.hideDividers}
          onContextMenu={(tr, x, y) => setTrackMenu({ track: tr, x, y })}
          accentRGB={appAccent}/>
        <RoomsView
          visible={view==='rooms'}
          room={room}
          joinCode={roomJoinCode}
          onJoinCode={setRoomJoinCode}
          onCreate={handleCreateRoom}
          onJoin={handleJoinRoom}
          onLeave={handleLeaveRoom}
          onCopy={handleCopyRoomCode}
          selfName={roomName}
          selfAvatar={roomProfile.avatar}
          selfId={room.you}
          selfUid={roomProfile.uid}
          draftLocks={roomDraftLocks}
          onToggleDraftLock={handleToggleDraftLock}
          onToggleLock={handleToggleRoomLock}
          onKick={handleKickMember}
          onBan={handleBanMember}
          onTransfer={handleTransferHost}
          onPlaySuggestion={handlePlaySuggestion}
          busy={roomBusy}
          volume={volume}
          onVolume={handleVolumeChange}
          onVolumeLive={handleVolumeLive}
          accentKey={`${appAccent.r},${appAccent.g},${appAccent.b}`}/>
        <ArtistView artist={artistView} visible={view==='artist'} onClose={handleCloseArtist} scAuth={settings.soundcloudAuth||null} artistCacheRef={artistCacheRef}
          hideDividers={settings.hideDividers}
          likedIds={likedIds} onLike={handleLike}
          onPlayTrack={tr => { playlistQueueRef.current = null; searchQueueRef.current = null; stationQueueRef.current = null; handleScTrackClick(tr, -1); }}
          onSelectTrack={tr => { playlistQueueRef.current = null; searchQueueRef.current = null; stationQueueRef.current = null; handleScTrackClick(tr, -1); setPlayerVisible(true); setView('player'); setNavActive('library'); }}
          loadingTrackId={loadingTrackId} errorTrackId={errorTrackId}
          onFollow={handleFollow} onCheckFollow={checkFollow}
          onContextMenu={(tr, x, y) => setTrackMenu({ track: tr, x, y })}/>

        <AnimatePresence>
          {toast && !toastExiting && (
            <motion.div
              key="toast"
              initial={{ opacity: 0, y: 6, scale: 0.98 }}
              animate={{ opacity: 1, y: 0, scale: 1 }}
              exit={{ opacity: 0, y: 5, scale: 0.98 }}
              transition={{ duration: 0.16, ease: 'easeOut' }}
              style={{
                position:'absolute', bottom:28, left:'50%',
                translate:'-50% 0',
                background:'rgba(30,30,36,0.97)',
                border:'1px solid rgba(255,255,255,0.05)',
                borderRadius:8, padding:'7px 13px', fontSize:12,
                color:'rgba(255,255,255,0.52)', pointerEvents:'none',
                zIndex:9999, whiteSpace:'nowrap',
              }}>{toast}</motion.div>
          )}
        </AnimatePresence>

        <AnimatePresence>
          {trackMenu && (
            <TrackContextMenu key="ctxmenu" menu={trackMenu}
              onClose={() => setTrackMenu(null)}
              onCopyLink={handleCopyTrackLink}
              onStartStation={handleStartStation}
              playlists={settings.playlists || []}
              onAddToPlaylist={handleAddToPlaylist}
              canSuggest={room.role === 'guest'}
              onSuggest={handleSuggestTrack}/>
          )}
        </AnimatePresence>

        <OnlinePanel
          open={onlinePanelOpen}
          onClose={() => setOnlinePanelOpen(false)}
          peers={presencePeers}
          selfToken={presenceTokenRef.current}
          blocked={settings.blockedPresence || []}
          presenceEnabled={settings.presenceEnabled !== false}
          onToggleVisible={v => setSettings(s => ({ ...s, presenceEnabled: !!v }))}
          onUserMenu={(peer, x, y) => setPresenceUserMenu({ peer, x, y })}
        />
        <NotificationsPanel
          open={notifPanelOpen}
          onClose={() => setNotifPanelOpen(false)}
          items={settings.notifications || []}
          updating={updateInstalling}
          onClear={() => setSettings(s => ({ ...s, notifications: [] }))}
          onUpdate={handleInstallUpdate}
          onJoinInvite={handleJoinInviteNotif}
        />
        {presenceUserMenu && (
          <PresenceUserMenu
            menu={presenceUserMenu}
            onClose={() => setPresenceUserMenu(null)}
            onOpenProfile={handlePresenceOpenProfile}
            onInvite={handlePresenceInvite}
            onBlock={handlePresenceBlock}
          />
        )}

      </div>
    </div>
    </LangContext.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  location.hash === '#mini' ? <MiniPlayer/> : <App/>
);
if (location.hash === '#mini') {
  document.documentElement.classList.add('mini-mode');
  document.body.classList.add('mini-mode');
}
</script>
</body>
</html>
