              <svg width="13" height="13" fill="white" viewBox="0 0 24 24" style={{marginLeft:2}}><polygon points="5,3 19,12 5,21"/></svg>
            </div>
        }
      </div>
      {/* title + artist */}
      <div style={{flex:1, minWidth:0, cursor:'pointer'}} onClick={onClick}>
        <div style={{fontSize:13, color:'rgba(255,255,255,0.86)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>{track.title}</div>
        <div style={{fontSize:11, color:'rgba(255,255,255,0.3)', marginTop:2, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>{track.artist}</div>
      </div>
      {/* stats — plays + duration */}
      <div style={{display:'flex', alignItems:'center', gap:14, flexShrink:0}}>
        {/* plays */}
        {pc && <div style={{display:'flex', alignItems:'center', gap:5, color:'rgba(255,255,255,0.32)'}}>
          <img src="./assets/vosproizvedenie.png" width="10" height="10" style={{display:'block', filter:'brightness(0) invert(1)', opacity:0.5}}/>
          <span style={{fontSize:11, fontVariantNumeric:'tabular-nums'}}>{pc}</span>
        </div>}
        {/* duration / unavailable */}
        {isError
          ? <div style={{fontSize:11, color:'rgba(255,80,80,0.7)', minWidth:36, textAlign:'right'}}>{t('unavailable')}</div>
          : <div style={{fontSize:11, color:'rgba(255,255,255,0.32)', minWidth:30, textAlign:'right', fontVariantNumeric:'tabular-nums'}}>{fmt(track.duration)}</div>
        }
      </div>
      {/* like — pill at the very end */}
      {onLike && <div onClick={e=>{e.stopPropagation();onLike();}}
        style={{
          marginLeft:12, flexShrink:0,
          display:'flex', alignItems:'center', justifyContent:'center', gap:5,
          minWidth: lc ? 62 : 32,
          padding:'5px 11px',
          borderRadius: 999,
          background: isLiked ? 'rgba(255,255,255,0.08)' : 'rgba(255,255,255,0.035)',
          border: isLiked ? '1px solid rgba(255,255,255,0.10)' : '1px solid rgba(255,255,255,0.05)',
          color: isLiked ? 'rgba(255,255,255,0.92)' : 'rgba(255,255,255,0.42)',
          cursor:'pointer',
          transition:'background 0.15s, border-color 0.15s, color 0.15s',
        }}
        onMouseEnter={e=>{
          e.currentTarget.style.background = isLiked ? 'rgba(255,255,255,0.13)' : 'rgba(255,255,255,0.07)';
          e.currentTarget.style.color = isLiked ? '#fff' : 'rgba(255,255,255,0.7)';
        }}
        onMouseLeave={e=>{
          e.currentTarget.style.background = isLiked ? 'rgba(255,255,255,0.08)' : 'rgba(255,255,255,0.035)';
          e.currentTarget.style.color = isLiked ? 'rgba(255,255,255,0.92)' : 'rgba(255,255,255,0.42)';
        }}
      >
        <img src={isLiked ? './assets/heart1.png' : './assets/heart0.png'} width="11" height="11" style={{display:'block', filter:'brightness(0) invert(1)'}}/>
        {lc && <span style={{fontSize:11, fontVariantNumeric:'tabular-nums'}}>{lc}</span>}
      </div>}
    </motion.div>
  );
}

/* ── SearchView ──────────────────────────────────────────────────────────── */
const SearchView = React.forwardRef(function SearchView({
  visible, scAuth, likedIds, onLike, onPlayTrack, onSelectTrack, onResultsLoaded, onArtistClick,
  loadingTrackId, errorTrackId, hideDividers, onContextMenu, activeId,
}, ref) {
  const T = useLang();
  const inputRef = useRef(null);
  const [query,   setQuery]   = useState('');
  const [results, setResults] = useState([]);
  const [users,   setUsers]   = useState([]);
  const [loading, setLoading] = useState(false);
  const [offset,  setOffset]  = useState(0);
  const [hasMore, setHasMore] = useState(false);
  const debounceRef  = useRef(null);
  const queryRef     = useRef('');
  const loadingRef   = useRef(false);
  const hasMoreRef   = useRef(false);
  const offsetRef    = useRef(0);
  hasMoreRef.current = hasMore;
  offsetRef.current  = offset;
  React.useImperativeHandle(ref, () => ({
    focus: () => { inputRef.current?.focus(); inputRef.current?.select(); },
    loadMore: () => {
      if (!hasMoreRef.current || loadingRef.current) return;
      doSearch(queryRef.current, offsetRef.current);
    },
  }));

  const hasResults = results.length > 0 || users.length > 0;

  const doSearch = async (q, off = 0) => {
    if (!q.trim() || !scAuth) return;
    loadingRef.current = true;
    setLoading(true);
    const [tracksRes, usersRes] = await Promise.all([
      window.electronAPI.scFetch(
        `https://api-v2.soundcloud.com/search/tracks?q=${encodeURIComponent(q)}&limit=20&offset=${off}`,
        scAuth.token, scAuth.clientId
      ),
      off === 0
        ? window.electronAPI.scFetch(
            `https://api-v2.soundcloud.com/search/users?q=${encodeURIComponent(q)}&limit=4`,
            scAuth.token, scAuth.clientId
          )
        : Promise.resolve(null),
    ]);
    if (queryRef.current !== q) return;
    const newTracks = (tracksRes.data?.collection || []).map(t => mapScTrack(t, T('no_title')));
    if (off === 0) {
      setResults(newTracks);
      setUsers((usersRes?.data?.collection || []).map(u => ({
        id: u.id, username: u.username,
        avatarUrl: u.avatar_url,
        followersCount: u.followers_count,
        bannerUrl: u.visuals?.visuals?.[0]?.visual_url || null,
      })));
    } else {
      setResults(prev => [...prev, ...newTracks]);
      if (newTracks.length > 0) onResultsLoaded?.(newTracks);
    }
    setHasMore(!!tracksRes.data?.next_href);
    setOffset(off + 20);
    loadingRef.current = false;
    setLoading(false);
  };

  const handleInput = e => {
    const q = e.target.value;
    setQuery(q);
    queryRef.current = q;
    clearTimeout(debounceRef.current);
    if (!q.trim()) { setResults([]); setUsers([]); setOffset(0); return; }
    debounceRef.current = setTimeout(() => doSearch(q, 0), 380);
  };

  const handleScroll = e => {
    if (!hasMore || loadingRef.current) return;
    const el = e.currentTarget;
    if (el.scrollTop + el.clientHeight >= el.scrollHeight - 120) doSearch(query, offset);
  };

  return (
    <div style={{
      position:'absolute', inset:0,
      opacity: visible ? 1 : 0,
      pointerEvents: visible ? 'auto' : 'none',
      transition:'opacity 0.14s ease',
    }}>
      {/* searchbar */}
      <div style={{
        position:'absolute', left:0, right:0,
        top: hasResults ? '8%' : '36%',
        transition:'top 0.42s cubic-bezier(0.22,1,0.36,1)',
        padding:'0 52px', zIndex:2,
      }}>
        <div style={{
          position:'relative',
          background:'rgba(255,255,255,0.05)',
          borderRadius:18,
        }}>
          <svg width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2"
            viewBox="0 0 24 24" style={{position:'absolute', left:22, top:'50%', translate:'0 -50%', pointerEvents:'none', color:'rgba(255,255,255,0.3)'}}>
            <circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35" strokeLinecap="round"/>
          </svg>
          <input
            ref={inputRef}
            value={query} onChange={handleInput}
            placeholder={T('search_ph')}
            style={{
              width:'100%', background:'transparent', border:'none', outline:'none',
              padding:'15px 54px',
              color:'#ededf4', fontSize:18, fontFamily:'inherit', textAlign:'center',
            }}
          />
          {loading && <div style={{position:'absolute', right:22, top:'50%', translate:'0 -50%', width:16, height:16, borderRadius:'50%', border:'2px solid rgba(255,255,255,0.15)', borderTopColor:'rgba(255,255,255,0.5)', animation:'spin 0.7s linear infinite'}}/>}
        </div>
      </div>

      {/* results */}
      {hasResults && (
        <div onScroll={handleScroll}
          className="scroll-thin"
          style={{
            position:'absolute', left:0, right:10,
            top:'calc(8% + 76px)', bottom: 0,
            overflowY:'auto', padding:'16px 52px 32px',
            willChange:'transform',
          }}>
          {users.length > 0 && (
            <div style={{marginBottom:22}}>
              <div style={{fontSize:10.5,letterSpacing:'0.09em',textTransform:'uppercase',color:'rgba(255,255,255,0.22)',marginBottom:10}}>{T('artists')}</div>
              <div style={{display:'grid', gridTemplateColumns:'repeat(4, 1fr)', gap:10}}>
                {users.slice(0, 4).map(u => (
                  <div key={u.id}
                    onClick={() => onArtistClick?.(u)}
                    style={{
                    display:'flex', alignItems:'center', gap:14,
                    background:'rgba(255,255,255,0.04)',
                    border:'1px solid rgba(255,255,255,0.03)',
                    borderRadius:14, padding:'12px 16px',
                    cursor:'pointer', transition:'background 0.15s, border-color 0.15s',
                    minWidth:0,
                  }}
                    onMouseEnter={e => { e.currentTarget.style.background='rgba(255,255,255,0.075)'; e.currentTarget.style.borderColor='rgba(255,255,255,0.06)'; }}
                    onMouseLeave={e => { e.currentTarget.style.background='rgba(255,255,255,0.04)'; e.currentTarget.style.borderColor='rgba(255,255,255,0.03)'; }}
                  >
                    {u.avatarUrl
                      ? <img src={u.avatarUrl} loading="lazy" decoding="async" style={{width:42,height:42,borderRadius:'50%',objectFit:'cover',flexShrink:0}}/>
                      : <div style={{width:42,height:42,borderRadius:'50%',background:'#111116',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                          <svg width="20" height="20" fill="none" stroke="rgba(255,255,255,0.3)" strokeWidth="1.6" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
                        </div>
                    }
                    <div style={{minWidth:0, flex:1}}>
                      <div style={{fontSize:13.5, fontWeight:600, color:'rgba(255,255,255,0.9)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', letterSpacing:'-0.005em'}}>{u.username}</div>
                      {u.followersCount > 0 && <div style={{fontSize:10.5, color:'rgba(255,255,255,0.36)', marginTop:3, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>{u.followersCount.toLocaleString()} {T('followers')}</div>}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}
          {results.length > 0 && (
            <div>
              <div style={{fontSize:10.5,letterSpacing:'0.09em',textTransform:'uppercase',color:'rgba(255,255,255,0.22)',marginBottom:8}}>{T('tracks_label')}</div>
              <AnimatePresence initial={false}>
                {results.map(tr => (
                  <SearchTrackRow key={tr.id} track={tr}
                    isLiked={likedIds.has(tr.id)}
                    onLike={() => onLike(tr)}
                    onClick={() => onSelectTrack(tr, results)}
                    onCoverClick={() => onPlayTrack(tr, results)}
                    isActive={activeId != null && String(activeId) === String(tr.id)}
                    isLoading={loadingTrackId === tr.id}
                    isError={errorTrackId === tr.id}
                    hideDividers={hideDividers}
                    onContextMenu={onContextMenu}/>
                ))}
              </AnimatePresence>
              {loading && <div style={{textAlign:'center',color:'rgba(255,255,255,0.2)',padding:'16px 0',fontSize:12}}>{T('loading')}</div>}
            </div>
          )}
        </div>
      )}
    </div>
  );
});

/* ── ArtistView ──────────────────────────────────────────────────────────── */
function ArtistView({ artist, visible, onClose, scAuth, likedIds, onLike, onPlayTrack, onSelectTrack, loadingTrackId, errorTrackId, artistCacheRef, onFollow, onCheckFollow, hideDividers, onContextMenu }) {
  const t = useLang();
  const [tab, setTab] = useState('popular');
  const [fetched, setFetched] = useState(null);
  const [artistTracks, setArtistTracks] = useState([]);
  const [tracksLoading, setTracksLoading] = useState(false);
  const [tracksError, setTracksError] = useState(null);
  const [fetchKey, setFetchKey] = useState(0);
  const [nextHref, setNextHref] = useState(null);
  const nextHrefRef = useRef(null);
  const [loadingMore, setLoadingMore] = useState(false);
  const loadingMoreRef = useRef(false);
  const tabCacheRef = useRef({});
  const scrollContainerRef = useRef(null);
  const tabReqRef = useRef(0);
  const [isFollowing, setIsFollowing] = useState(null);
  const [followBusy, setFollowBusy] = useState(false);

  const mapTrack = tr => mapScTrack(tr);

  const TABS = [
    { id: 'popular', label: t('artist_popular') },
    { id: 'tracks',  label: t('artist_tracks')  },
  ];

  useEffect(() => {
    if (!artist) return;
    tabCacheRef.current = {};
    setTab('popular'); setFetched(null); setArtistTracks([]);
    setIsFollowing(null); setFollowBusy(false);
  }, [artist?.id, artist?.username]);

  useEffect(() => {
    if (!visible || !scAuth || (!artist?.id && !artist?.username)) return;
    const cacheKey = artist.id ? String(artist.id) : artist.username?.toLowerCase();
    const cached = artistCacheRef?.current?.get(cacheKey);
    if (cached) { setFetched(cached); return; }
    let cancelled = false;
    (async () => {
      try {
        let userId = artist.id;
        if (!userId) {
          const s = await window.electronAPI.scFetch(
            `https://api-v2.soundcloud.com/search/users?q=${encodeURIComponent(artist.username)}&limit=1`,
            scAuth.token, scAuth.clientId
          );
          if (cancelled) return;
          userId = s.data?.collection?.[0]?.id;
          if (!userId) return;
        }
        const res = await window.electronAPI.scFetch(
          `https://api-v2.soundcloud.com/users/${userId}`,
          scAuth.token, scAuth.clientId
        );
        if (cancelled) return;
        const u = res.data;
        if (!u) return;
        const data = {
          id: u.id,
          username: u.username,
          avatarUrl: u.avatar_url ? u.avatar_url.replace('-large', '-t500x500') : null,
          followersCount: u.followers_count,
          bannerUrl: u.visuals?.visuals?.[0]?.visual_url || null,
        };
        artistCacheRef?.current?.set(cacheKey, data);
        setFetched(data);
      } catch {}
    })();
    return () => { cancelled = true; };
  }, [visible, artist?.id, artist?.username]);

  const profileId = fetched?.id || artist?.id || null;

  useEffect(() => {
    if (!visible || !scAuth || !profileId || !onCheckFollow) return;
    let cancelled = false;
    (async () => {
      const f = await onCheckFollow(profileId);
      if (!cancelled) setIsFollowing(!!f);
    })();
    return () => { cancelled = true; };
  }, [visible, profileId, onCheckFollow, scAuth]);

  const handleSubscribeClick = async () => {
    if (!profileId || !onFollow || followBusy) return;
    setFollowBusy(true);
    const result = await onFollow(profileId, isFollowing);
    setFollowBusy(false);
    if (result !== null) setIsFollowing(result);
  };

  useEffect(() => {
    if (!visible || !scAuth || !profileId) return;

    const cached = tabCacheRef.current[tab];
    if (cached) {
      setTracksLoading(false);
      setTracksError(null);
      setArtistTracks(cached.tracks);
      nextHrefRef.current = cached.nextHref;
      setNextHref(cached.nextHref);
      return;
    }

    const reqId = ++tabReqRef.current;
    setArtistTracks([]);
    setTracksError(null);
    nextHrefRef.current = null;
    setNextHref(null);
    setTracksLoading(true);
    const urls = {
      popular: `https://api-v2.soundcloud.com/users/${profileId}/toptracks?limit=20`,
      tracks:  `https://api-v2.soundcloud.com/users/${profileId}/tracks?limit=20`,
    };
    const url = urls[tab];
    if (!url) { setTracksLoading(false); return; }
    window.electronAPI.scFetch(url, scAuth.token, scAuth.clientId).then(res => {
      if (tabReqRef.current !== reqId) return;
      const items = res.data?.collection || [];
      const mapped = items.map(mapTrack);
      const nh = res.data?.next_href || null;
      tabCacheRef.current[tab] = { tracks: mapped, nextHref: nh };
      setArtistTracks(mapped);
      nextHrefRef.current = nh;
      setNextHref(nh);
    }).catch(() => {
      if (tabReqRef.current === reqId) setTracksError(t('error_retry') || 'Ошибка загрузки');
    }).finally(() => { if (tabReqRef.current === reqId) setTracksLoading(false); });
  }, [tab, profileId, visible, fetchKey]);

  useEffect(() => {
    if (tracksLoading || loadingMore || !nextHrefRef.current) return;
    const el = scrollContainerRef.current;
    if (!el || el.scrollHeight > el.clientHeight) return;
    loadMore();
  }, [tracksLoading, loadingMore]);

  const loadMore = async () => {
    if (!nextHrefRef.current || loadingMoreRef.current || !scAuth) return;
    loadingMoreRef.current = true;
    setLoadingMore(true);
    const href = nextHrefRef.current;
    const currentTab = tab;
    try {
      const res = await window.electronAPI.scFetch(href, scAuth.token, scAuth.clientId);
      const newTracks = (res.data?.collection || []).map(mapTrack);
      const nh = res.data?.next_href || null;
      nextHrefRef.current = nh;
      setNextHref(nh);
      setArtistTracks(prev => {
        const updated = [...prev, ...newTracks];
        if (tabCacheRef.current[currentTab]) {
          tabCacheRef.current[currentTab] = { tracks: updated, nextHref: nh };
        }
        return updated;
      });
    } catch {}
    loadingMoreRef.current = false;
    setLoadingMore(false);
  };

  const profile = fetched ? { ...artist, ...fetched } : artist;
  const avatarUrl = profile?.avatarUrl || null;
  const bannerUrl = profile?.bannerUrl || null;

  return (
    <div style={{
      position: 'absolute', inset: 0,
      display: 'flex', flexDirection: 'column',
      overflow: 'hidden',
      opacity: visible ? 1 : 0,
      pointerEvents: visible ? 'auto' : 'none',
      transition: 'opacity 0.18s ease',
    }}>
      {/* hero — asymmetric layout: avatar left, info right */}
      <div style={{
        position: 'relative', flexShrink: 0, overflow: 'hidden',
        display: 'flex', alignItems: 'flex-end', gap: 24,
        padding: '60px 40px 26px 40px',
      }}>
        {/* blur background — prefer banner, fallback to avatar */}
        {(bannerUrl || avatarUrl) && (
          <img src={bannerUrl || avatarUrl} className="aoi-artist-banner" style={{
            position: 'absolute', inset: '-40px',
            width: 'calc(100% + 80px)', height: 'calc(100% + 80px)',
            objectFit: 'cover',
            filter: 'blur(56px) saturate(1.3) brightness(0.5)',
          }}/>
        )}
        {/* gradient overlay */}
        <div style={{
          position: 'absolute', inset: 0,
          background: 'linear-gradient(to bottom, rgba(7,7,10,0.36) 0%, rgba(7,7,10,0.55) 55%, #07070a 100%)',
        }}/>

        {/* back button — circular with blur backdrop */}
        <div onClick={onClose} title={t('back')} style={{
          position: 'absolute', top: 14, left: 14, zIndex: 10,
          width: 32, height: 32, borderRadius: '50%',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          cursor: 'pointer',
          background: 'rgba(0,0,0,0.42)',
          backdropFilter: 'blur(10px)', WebkitBackdropFilter: 'blur(10px)',
          border: '1px solid rgba(255,255,255,0.09)',
          color: 'rgba(255,255,255,0.72)',
          transition: 'background 0.15s, color 0.15s, transform 0.15s',
        }}
          onMouseEnter={e => { e.currentTarget.style.background='rgba(0,0,0,0.62)'; e.currentTarget.style.color='rgba(255,255,255,0.95)'; }}
          onMouseLeave={e => { e.currentTarget.style.background='rgba(0,0,0,0.42)'; e.currentTarget.style.color='rgba(255,255,255,0.72)'; }}
          onMouseDown={e => e.currentTarget.style.transform='scale(0.92)'}
          onMouseUp={e => e.currentTarget.style.transform='scale(1)'}
        >
          <svg width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" viewBox="0 0 24 24">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
        </div>

        {/* avatar — left */}
        <div style={{
          position: 'relative', zIndex: 2,
          width: 148, height: 148, borderRadius: 16,
          overflow: 'hidden', flexShrink: 0,
          background: '#111116',
          boxShadow: '0 18px 48px rgba(0,0,0,0.7)',
          border: '1px solid rgba(255,255,255,0.07)',
        }}>
          {avatarUrl
            ? <img src={avatarUrl} style={{ width: '100%', height: '100%', objectFit: 'cover' }}/>
            : <div style={{ width: '100%', height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                <svg width="52" height="52" fill="none" stroke="rgba(255,255,255,0.18)" strokeWidth="1.4" viewBox="0 0 24 24">
                  <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
                </svg>
              </div>
          }
        </div>

        {/* info column — right */}
        <div style={{
          position: 'relative', zIndex: 2, flex: 1, minWidth: 0,
          display: 'flex', flexDirection: 'column',
          paddingBottom: 6,
        }}>
          <div style={{
            fontSize: 10.5, letterSpacing: '0.13em', textTransform: 'uppercase',
            color: 'rgba(255,255,255,0.42)', marginBottom: 6, fontWeight: 600,
          }}>
            {t('artist_label') || 'Артист'}
          </div>
          <div style={{
            fontSize: 'clamp(26px, 3.4vw, 38px)', fontWeight: 700,
            letterSpacing: '-0.028em', lineHeight: 1.12,
            overflow: 'hidden', whiteSpace: 'nowrap', textOverflow: 'ellipsis',
            textShadow: '0 2px 14px rgba(0,0,0,0.55)',
          }}>
            {profile?.username || artist?.username || '—'}
          </div>
          <div style={{
            display: 'flex', alignItems: 'center', gap: 14,
            marginTop: 10,
          }}>
            {(profile?.followersCount > 0) && (
              <div key={profile.followersCount} className="aoi-badge-roll" style={{ fontSize: 12, color: 'rgba(255,255,255,0.5)', letterSpacing: '0.01em' }}>
                {profile.followersCount.toLocaleString()} {t('followers')}
              </div>
            )}
            {profileId && scAuth && isFollowing !== null && (
              <button
                className={'aoi-follow-wipe' + (isFollowing ? ' is-on' : ' is-off')}
                disabled={followBusy}
                onClick={handleSubscribeClick}
                onMouseEnter={e => {
                  if (followBusy) return;
                  e.currentTarget.style.background = isFollowing ? 'rgba(255,80,80,0.10)' : 'rgba(255,255,255,0.20)';
                  e.currentTarget.style.color = isFollowing ? 'rgba(255,140,140,0.95)' : '#fff';
                  e.currentTarget.style.borderColor = isFollowing ? 'rgba(255,120,120,0.32)' : 'transparent';
                }}
                onMouseLeave={e => {
                  e.currentTarget.style.background = isFollowing ? 'transparent' : 'rgba(255,255,255,0.12)';
                  e.currentTarget.style.color = isFollowing ? 'rgba(255,255,255,0.78)' : 'rgba(255,255,255,0.94)';
                  e.currentTarget.style.borderColor = isFollowing ? 'rgba(255,255,255,0.22)' : 'transparent';
                }}
                style={{
                  padding: '6px 18px',
                  fontSize: 12, fontWeight: 600, letterSpacing: '0.02em',
                  background: isFollowing ? 'transparent' : 'rgba(255,255,255,0.12)',
                  border: isFollowing ? '1px solid rgba(255,255,255,0.22)' : '1px solid transparent',
                  color: isFollowing ? 'rgba(255,255,255,0.78)' : 'rgba(255,255,255,0.94)',
                  borderRadius: 999,
                  cursor: followBusy ? 'default' : 'pointer',

        {loadingMore && (

    </div>
  );

function tauriApi() {
  return window.__TAURI__ || null;
}
function emitAoi(name, payload, labels) {
  const ev = tauriApi()?.event;
  if (!ev) return;
  const targets = labels || ['main', 'mini'];
  const go = async () => {
    for (const label of targets) {
      try { if (ev.emitTo) await ev.emitTo({ kind: 'WebviewWindow', label }, name, payload); } catch {}
      try { if (ev.emitTo) await ev.emitTo(label, name, payload); } catch {}
    }
    try { await ev.emit(name, payload); } catch {}
  };
  go();
}
function emitPlayerCmd(action, value) {
  // Rust bridge — надёжный путь mini → main (события между webview на Windows часто глохнут)
  try { window.electronAPI?.miniCmd?.(action, value); } catch {}
}

function MiniIcoBtn({ onClick, children, w = 32, dim, title }) {
  const armed = useRef(false);
  return (
    <button type="button" className="mini-hit" title={title}
      onPointerDown={e => {
        if (e.button !== 0) return;
        e.stopPropagation();
        armed.current = true;
        onClick?.(e);
      }}
      onClick={e => {
        e.stopPropagation();
        if (armed.current) { armed.current = false; e.preventDefault(); return; }
        onClick?.(e);
      }}
      style={{
        width:w, height:w, borderRadius:10, border:'none', background:'none',
        display:'flex', alignItems:'center', justifyContent:'center',
        cursor:'pointer', color: dim ? 'rgba(255,255,255,0.38)' : 'rgba(255,255,255,0.88)', flexShrink:0,
        WebkitAppRegion:'no-drag', pointerEvents:'auto', position:'relative', zIndex:2,
      }}
      onMouseEnter={e => { e.currentTarget.style.background='rgba(255,255,255,0.06)'; }}
      onMouseLeave={e => { e.currentTarget.style.background='none'; }}>
      {children}
    </button>
  );
}

function MiniVolBar({ value, onLive, onCommit }) {
  const ref = useRef(null);
  const drag = useRef(false);
  const apply = (e, commit) => {
    const el = ref.current;
    if (!el) return;
    const r = el.getBoundingClientRect();
    const v = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
    onLive?.(v);
    if (commit) onCommit?.(v);
  };
  useEffect(() => {
    const move = e => { if (drag.current) apply(e, false); };
    const up = e => { if (!drag.current) return; drag.current = false; apply(e, true); };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
    return () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); };
  }, []);
  const pct = Math.round((value || 0) * 100);
  return (
    <div ref={ref} className="mini-hit" onMouseDown={e => { drag.current = true; apply(e, false); }}
      style={{ flex:1, height:14, display:'flex', alignItems:'center', cursor:'pointer', minWidth:48 }}>
      <div style={{ width:'100%', height:3, borderRadius:99, background:'rgba(255,255,255,0.1)', overflow:'hidden', position:'relative' }}>
        <div style={{
          width: pct + '%', height:'100%', borderRadius:99,
          background:'linear-gradient(90deg, rgba(var(--accent-rgb),0.55), rgb(var(--accent-rgb)))',
        }}/>
      </div>
    </div>
  );
}

}

  async function handleScTrackClick(scTrack, idx, autoSkip = false, skipCount = 0, direction = 1, fromRoom = false) {
    if (roomRef.current.role === 'guest' && !fromRoom) { showToast(t('room_host_controls')); return; }
    const gen = ++scClickGenRef.current;
    trackSwitchingRef.current = true;
    playLoggedRef.current = '';
    stopNeedle();
    setScPlayingIdx(idx);
    progressRef.current = 0;
    setLoadingTrackId(scTrack.id);

    const auth = scAuthRef.current;
    if (!auth) { setLoadingTrackId(null); trackSwitchingRef.current = false; return; }

    if (!autoSkip && shuffle) {
      const list = stationQueueRef.current || searchQueueRef.current || playlistQueueRef.current || (searchRef.current ? filteredScRef.current : scTracksRef.current);
      scShuffleOrderRef.current = shuffleBag(list, scTrack.id);
      scShuffleIdxRef.current = 0;
    }

    const markError = () => {
      clearTimeout(errorTimerRef.current);
      setErrorTrackId(scTrack.id);
      errorTimerRef.current = setTimeout(() => setErrorTrackId(null), 2200);
    };

    const skipInDirection = () => {
      const list = stationQueueRef.current || searchQueueRef.current || playlistQueueRef.current || (searchRef.current ? filteredScRef.current : scTracksRef.current);
      if (shuffle) {
        const order = scShuffleOrderRef.current;
        const ni = scShuffleIdxRef.current + direction;
        if (skipCount < order.length && ni >= 0 && ni < order.length) {
          scShuffleIdxRef.current = ni;
          const nextTrack = list.find(t => t.id === order[ni]);
          if (nextTrack) { handleScTrackClick(nextTrack, scTracksRef.current.indexOf(nextTrack), true, skipCount + 1, direction); return; }
        }
        if (repeat === 'all' && direction > 0 && skipCount < order.length) {
          const newOrder = shuffleBag(list, null);
          scShuffleOrderRef.current = newOrder;
          scShuffleIdxRef.current = 0;
          const nextTrack = list.find(t => t.id === newOrder[0]);
          if (nextTrack) handleScTrackClick(nextTrack, scTracksRef.current.indexOf(nextTrack), true, skipCount + 1, direction);
          else setIsPlaying(false);
        } else { setIsPlaying(false); }
        return;
      }
      const curIdx = list.findIndex(t => t.id === scTrack.id);
      const ni = curIdx + direction;
      if (skipCount < list.length && ni >= 0 && ni < list.length) {
        handleScTrackClick(list[ni], scTracksRef.current.indexOf(list[ni]), true, skipCount + 1, direction);
      } else if (repeat === 'all' && direction > 0 && skipCount < list.length) {
        handleScTrackClick(list[0], scTracksRef.current.indexOf(list[0]), true, skipCount + 1, direction);
      } else {
        setIsPlaying(false);
      }
    };

    if (!scTrack.streamUrl && !scTrack.hlsUrl) {
      if (gen !== scClickGenRef.current) return;
      trackSwitchingRef.current = false;
      setLoadingTrackId(null);
      markError();
      if (autoSkip) { skipInDirection(); }
      return;
    }

    let resolvedUrl = null;
    let isHls = false;

    const tryResolve = async (endpoint, asHls) => {
      if (!endpoint) return 'miss';
      const res = await window.electronAPI.scFetch(endpoint, auth.token, auth.clientId);
      if (gen !== scClickGenRef.current) return 'stale';
      if (res?.data?.url) {
        resolvedUrl = res.data.url;
        isHls = !!asHls || isProbablyHlsUrl(res.data.url);
        return 'ok';
      }
      return 'miss';
    };

    // Prefer AAC HLS after SoundCloud dropped progressive MP3 (Dec 2025).
    let resolveState = 'miss';
    if (scTrack.preferHls || (!scTrack.streamUrl && scTrack.hlsUrl)) {
      resolveState = await tryResolve(scTrack.hlsUrl, true);
      if (resolveState === 'miss') resolveState = await tryResolve(scTrack.streamUrl, false);
    } else {
      resolveState = await tryResolve(scTrack.streamUrl, false);
      if (resolveState === 'miss') resolveState = await tryResolve(scTrack.hlsUrl, true);
    }
    if (resolveState === 'stale') return;

    if (!resolvedUrl) {
      if (gen !== scClickGenRef.current) return;
      trackSwitchingRef.current = false;
      setLoadingTrackId(null);
      cfLockRef.current = false;
      markError();
      if (autoSkip) { skipInDirection(); }
      return;
    }

    if (gen !== scClickGenRef.current) return;
    // Absolute CDN playlists sometimes need a second hop if JSON still points at an API/auth URL.
    if (isProbablyHlsUrl(resolvedUrl)) isHls = true;
    let proxyAttempt = 0;
    let hlsFatalTries = 0;
    const useProxy = settingsRef.current?.useAoiProxy;
    const pickProxyUrl = () => proxyMediaUrl(resolvedUrl, useProxy, proxyAttempt);
    let proxiedUrl = pickProxyUrl();
    const resolved = { ...scTrack, resolvedUrl: proxiedUrl };
    playSrcCacheRef.current[String(scTrack.id)] = proxiedUrl;
    setScPlayingTrack(resolved);

    const swap = beginTrackChange();
    const audio = swap.audio;
    if (!audio) { setLoadingTrackId(null); return; }
    const shouldPlay = applyingRoomRef.current ? !!roomApplyWantPlayRef.current : true;
    setAudioCorsForSrc(audio, proxiedUrl);

    const retryProxy = () => {
      if (gen !== scClickGenRef.current) return;
      proxyAttempt++;
      proxiedUrl = pickProxyUrl();
      playSrcCacheRef.current[String(scTrack.id)] = proxiedUrl;
      setAudioCorsForSrc(audio, proxiedUrl);
      setScPlayingTrack(prev => prev ? { ...prev, resolvedUrl: proxiedUrl } : prev);
    };

    audio.addEventListener('playing', () => {
      if (gen !== scClickGenRef.current) return;
      trackSwitchingRef.current = false;
      try { window.AoiRooms?.rememberProxyBase?.(proxiedUrl); } catch {}
      if (swap.overlap) startOverlapFade(swap.outgoing, audio, fadePrevRef.current, scTrack);
      else startFadeIn(audio, fadePrevRef.current, scTrack);
      fadePrevRef.current = scTrack;
    }, { once: true });

    if (isHls && typeof Hls !== 'undefined' && Hls.isSupported()) {
      const q = settingsRef.current?.hlsQuality || 'auto';
      const mountHls = (srcUrl) => {
        if (gen !== scClickGenRef.current) return;
        if (hlsRef.current) { try { hlsRef.current.destroy(); } catch {} hlsRef.current = null; }
        setAudioCorsForSrc(audio, srcUrl);
        const hlsOpts = {
          startLevel: q === 'sq' ? 0 : -1,
          capLevelToPlayerSize: q !== 'hq',
        };
        if (useProxy) {
          const Loader = makeScHlsLoader(() => proxyAttempt);
          if (Loader) hlsOpts.loader = Loader;
        }
        const hls = new Hls(hlsOpts);
        hlsRef.current = hls;
        hls.loadSource(srcUrl);
        hls.attachMedia(audio);
        applyPlaybackSettings();
        hls.on(Hls.Events.ERROR, (_, data) => {
          if (gen !== scClickGenRef.current) return;
          if (!data.fatal) return;
          hlsFatalTries++;
          if (hlsFatalTries > 3) {
            trackSwitchingRef.current = false;
            setLoadingTrackId(null);
            cfLockRef.current = false;
            markError();
            if (autoSkip) skipInDirection();
            return;
          }
          retryProxy();
          setTimeout(() => {
            if (gen !== scClickGenRef.current) return;
            mountHls(pickProxyUrl());
          }, 320);
        });
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          if (gen !== scClickGenRef.current) return;
          if (shouldPlay) {
            playAudio(audio).then(() => setLoadingTrackId(null)).catch(() => { setLoadingTrackId(null); setIsPlaying(false); });
            setIsPlaying(true);
          } else {
            setLoadingTrackId(null);
            setIsPlaying(false);
          }
        });
        hls.on(Hls.Events.LEVEL_LOADED, (_, data) => {
          if (gen !== scClickGenRef.current) return;
          const dur = Math.floor(data.details.totalduration || 0);
          if (dur) setScPlayingTrack(prev => prev ? { ...prev, duration: dur } : prev);
        });
      };
      mountHls(proxiedUrl);
    } else {
      const onAudioErr = () => {
        if (gen !== scClickGenRef.current) return;
        if (proxyAttempt >= 3) {
          audio.removeEventListener('error', onAudioErr);
          trackSwitchingRef.current = false;
          setLoadingTrackId(null);
          cfLockRef.current = false;
          markError();
          if (autoSkip) skipInDirection();
          return;
        }
        retryProxy();
        const nextSrc = pickProxyUrl();
        setAudioCorsForSrc(audio, nextSrc);
        audio.src = nextSrc;
        audio.load();
        applyPlaybackSettings();
        if (shouldPlay) playAudio(audio).catch(() => {});
      };
      audio.addEventListener('error', onAudioErr);
      setAudioCorsForSrc(audio, proxiedUrl);
      audio.src = proxiedUrl;
      audio.load();
      applyPlaybackSettings();
      audio.addEventListener('loadedmetadata', () => {
        if (gen !== scClickGenRef.current) return;
        const dur = Math.floor(audio.duration);
        if (dur) setScPlayingTrack(prev => prev ? { ...prev, duration: dur } : prev);
      }, { once: true });
      if (shouldPlay) {
        playAudio(audio).then(() => setLoadingTrackId(null)).catch(() => { setLoadingTrackId(null); setIsPlaying(false); });
        setIsPlaying(true);
      } else {
        setLoadingTrackId(null);
        setIsPlaying(false);
      }
    }
  }


  async function selectTrack(tr) {
    if (roomRef.current.role === 'guest') { showToast(t('room_host_controls')); return; }
    const startPlayLocal = (idx) => {
      setScPlayingTrack(null);
      setTrackIdx(idx);
      progressRef.current = 0;
      setIsPlaying(true);
    };
    const startPlay = () => {
      clearQueueSession();
      if (sourceMode === 'sc') {
        const scIdx = scTracks.indexOf(tr);
        if (scIdx >= 0) handleScTrackClick(tr, scIdx);
      } else {
        const li = tracks.indexOf(tr);
        if (li >= 0) startPlayLocal(li);
      }
    };

    if (view === 'player') {
      startPlay();
      return;
    }

    // scroll target card into view if needed (mirrors handleNav home→player)
    const initialEl = artRefs.current[tr.id];
    const scrollEl = homeScrollRef.current;
    if (initialEl && scrollEl) {
      const box = scrollEl.getBoundingClientRect();
      const cr  = initialEl.getBoundingClientRect();
      if (cr.top < box.top || cr.bottom > box.bottom) {
        const offset = cr.top - box.top + scrollEl.scrollTop;
        scrollEl.scrollTop = Math.max(0, offset - box.height / 2 + cr.height / 2);
        await new Promise(r => requestAnimationFrame(r));
      }
    }

    const artEl = artRefs.current[tr.id];
    const par = playerArtRef.current?.getBoundingClientRect();

    if (artEl && par) {
      const startRect = artEl.getBoundingClientRect();
      const targetRect = { left: par.left, top: par.top, size: par.width };
      startPlay();
      setHero({ track: tr, startRect, targetRect });
      setHomeVisible(false);
      setPlayerVisible(true);
      setView('player');
      setNavActive('library');
      setLibScrollTargetId(tr.id);
      setLibScrollTrigger(v => v + 1);
      setTimeout(() => setHeroExiting(true), HERO_DUR_MS - 80);
      setTimeout(() => { setHero(null); setHeroExiting(false); }, HERO_DUR_MS - 80 + HERO_FADE_MS + 20);
    } else {
      // refs not ready — skip hero, just switch view
      startPlay();
      setHomeVisible(false);
      setPlayerVisible(true);
      setView('player');
      setNavActive('library');
      setLibScrollTargetId(tr.id);
      setLibScrollTrigger(v => v + 1);
    }
  }

  const handleLike = useCallback(async (track) => {
    if (!track?.id) return;
    const auth = await ensureScUserId();
    if (!auth) return;
    const already = scTracksRef.current.some(t => String(t.id) === String(track.id));
    const tid = String(track.id);
    const uid = String(auth.userId);
    // optimistic UI once; queue network quietly (L60)
    if (already) {
      setScTracks(prev => prev.filter(x => String(x.id) !== tid));
      scCacheRef.current = scCacheRef.current.filter(x => String(x.id) !== tid);
      scCacheMapRef.current.delete(track.id);
      scCacheMapRef.current.delete(tid);
    } else {
      setScTracks(prev => [track, ...prev.filter(x => String(x.id) !== tid)]);
      scCacheRef.current = [track, ...scCacheRef.current.filter(x => String(x.id) !== tid)];
      scCacheMapRef.current.set(track.id, track);
    }
    const snap = { already, tid, track };
    window.AoiNight?.enqueueLikeJob?.({
      run: async () => {
        try {
          const res = await window.electronAPI.scFetch(
            `https://api-v2.soundcloud.com/users/${uid}/track_likes/${tid}`,
            auth.token, auth.clientId, snap.already ? 'DELETE' : 'PUT'
          );
          return !scFailed(res);
        } catch { return false; }
      },
      done: (ok) => {
        if (!ok) {
          // rollback
          if (snap.already) {
            setScTracks(prev => [snap.track, ...prev.filter(x => String(x.id) !== snap.tid)]);
            scCacheRef.current = [snap.track, ...scCacheRef.current.filter(x => String(x.id) !== snap.tid)];
            scCacheMapRef.current.set(snap.track.id, snap.track);
          } else {
            setScTracks(prev => prev.filter(x => String(x.id) !== snap.tid));
            scCacheRef.current = scCacheRef.current.filter(x => String(x.id) !== snap.tid);
            scCacheMapRef.current.delete(snap.track.id);
            scCacheMapRef.current.delete(snap.tid);
          }
        } else {
          window.electronAPI.scSaveLikesCache(scCacheRef.current);
        }
        const title = ok
          ? (snap.already ? t('notif_unlike_ok') : t('notif_like_ok'))
          : (snap.already ? t('notif_unlike_fail') : t('notif_like_fail'));
        setSettings(s => {
          const notifications = Array.isArray(s.notifications) ? s.notifications.slice() : [];
          const n = {
            id: 'like:' + snap.tid + ':' + Date.now(),
            type: 'like',
            title,
            body: snap.track.title || '',
            at: Date.now(),
            read: false,
            meta: {},
          };
          window.AoiNight?.onNotificationEvent?.(s);
          return { ...s, notifications: [n, ...notifications].slice(0, 40) };
        });
      },
    });
  }, [ensureScUserId, t]);

  const handleFollow = useCallback(async (userId, currentlyFollowing) => {

    const uid = String(userId).replace(/^soundcloud:users:/, '');
    const urls = [
      `https://api-v2.soundcloud.com/me/followings/${uid}`,
      `https://api.soundcloud.com/me/followings/${uid}`,
    ];
    const method = currentlyFollowing ? 'DELETE' : 'PUT';
    let res = { error: true };
    for (const url of urls) {
      try {
        res = await window.electronAPI.scFetch(url, auth.token, auth.clientId, method);
      } catch (e) {
        res = { error: String(e) };
      }
      if (!scFailed(res)) break;
    }
    if (scFailed(res) && !currentlyFollowing) {
      try {
        res = await window.electronAPI.scFetch(urls[0], auth.token, auth.clientId, 'POST');
      } catch (e) {
        res = { error: String(e) };
      }
    }
    if (scFailed(res)) {
      showToast(currentlyFollowing ? t('unfollow_err') : t('follow_err'));
      return null;

    if (currentlyFollowing) followedIdsRef.current.delete(userId);

            const cr      = artEl.getBoundingClientRect();
            const visible = cr.top >= box.top && cr.bottom <= box.bottom;
            if (!visible) {

              const targetTop = Math.max(0, cardOffsetInScroll - box.height / 2 + cr.height / 2);
              scrollEl.scrollTop = targetTop;

      if (view === 'home') setHomeVisible(false);
      if (view === 'player') setPlayerVisible(false);
      setView('search');
    } else if (id === 'playlists') {
      if (view === 'home') setHomeVisible(false);
      if (view === 'player') setPlayerVisible(false);
      setView('playlists');
    } else if (id === 'rooms') {
      if (view === 'home') setHomeVisible(false);
      if (view === 'player') setPlayerVisible(false);
      setView('rooms');
    } else if (id === 'soundcloud') {
      if (view === 'home') setHomeVisible(false);
      if (view === 'player') setPlayerVisible(false);
      setTimeout(() => setView('soundcloud'), view === 'home' ? 240 : 300);
    } else if (id === 'settings') {
      if (view === 'player') setPlayerVisible(false);
      if (view === 'home') setHomeVisible(false);
      setTimeout(() => setView('settings'), view === 'home' ? 240 : 300);
    } else if (id === 'library') {
      setPlaybackDock(null);
      if (view === 'home') setHomeVisible(false);
      setPlayerVisible(true);
      setView('player');
    } else if (view === 'home') {
      const artEl = artRefs.current[track.id];
      const par = playerArtRef.current?.getBoundingClientRect();
      if (artEl && par) {
        const scrollEl = homeScrollRef.current;
        if (scrollEl) {
          const box = scrollEl.getBoundingClientRect();
          const cr  = artEl.getBoundingClientRect();
          if (cr.top < box.top || cr.bottom > box.bottom) {
            const offset = cr.top - box.top + scrollEl.scrollTop;
            scrollEl.scrollTop = Math.max(0, offset - box.height / 2 + cr.height / 2);
            await new Promise(r => requestAnimationFrame(r));
          }
        }
        const startRect = artEl.getBoundingClientRect();
        const targetRect = { left: par.left, top: par.top, size: par.width };
        setHero({ track: track, startRect, targetRect });
        setTimeout(() => setHeroExiting(true), HERO_DUR_MS - 80);
        setTimeout(() => { setHero(null); setHeroExiting(false); }, HERO_DUR_MS - 80 + HERO_FADE_MS + 20);

                {scPlayingTrack
                  ? splitArtists(track.artist).map(({ name, sep }, i) => {
                      const isUploader = track.uploaderUsername
                        ? name.toLowerCase() === track.uploaderUsername.toLowerCase()
                        : i === 0;
                      return (
                        <React.Fragment key={i}>
                          <span
                            onClick={() => handleOpenArtist(
                              isUploader
                                ? { id: track.artistId, username: name, avatarUrl: track.artistAvatarUrl }
                                : { username: name }
                            )}
                            onMouseEnter={e => e.currentTarget.style.color='rgba(255,255,255,0.65)'}
                            onMouseLeave={e => e.currentTarget.style.color='rgba(255,255,255,0.28)'}
                            style={{ color:'rgba(255,255,255,0.28)', cursor:'pointer', transition:'color 0.15s' }}
                          >{name}</span>
                          {sep && <span style={{ color:'rgba(255,255,255,0.16)' }}>{/^[,.]$/.test(sep.trim()) ? ', ' : ` ${sep.trim()} `}</span>}
                        </React.Fragment>
                      );
                    })
                  : <span style={{ color:'rgba(255,255,255,0.28)' }}>{track.artist}</span>
                }
              </div>
              {/* title */}
              <div key={track.id + '-title'} className="track-meta-in" style={{textAlign:'center', marginBottom:14, width:'100%'}}>
                {editingTitle ? (
                  <div style={{display:'flex', justifyContent:'center', width:'100%'}}>
                    <div className="aoi-title-edit" style={{
                      display:'inline-flex', alignItems:'center',
                      background:'rgba(255,255,255,0.055)',
                      borderRadius:11, padding:'7px 18px',
                      boxShadow:'0 4px 28px rgba(0,0,0,0.45)',
                      maxWidth:'100%',
                    }}>
                      <input
                        autoFocus
                        value={editValue}
                        onChange={e => setEditValue(e.target.value)}
                        onKeyDown={e => {
                          if (e.key === 'Enter')  { editCancelRef.current = false; commitEdit(); }
                          if (e.key === 'Escape') { editCancelRef.current = true;  setEditingTitle(false); }
                        }}
                        onBlur={() => { if (!editCancelRef.current) commitEdit(); editCancelRef.current = false; }}
                        style={{
                          background:'none', border:'none', outline:'none',
                          fontSize:'clamp(15px, 2vw, 24px)', fontWeight:600, letterSpacing:'-0.022em',
                          color:'#ededf4', textAlign:'center',
                          fontFamily:'inherit',
                          width: Math.max(80, editValue.length * 13) + 'px',
                          maxWidth:'100%',
                        }}
                      />
                    </div>
                  </div>
                ) : (
                  <div style={{
                    display:'flex', alignItems:'center', justifyContent:'center', width:'100%',
                  }}>
                    <MarqueeText
                      text={track.title}
                      onClick={e => {
                        if (e.shiftKey && !scPlayingTrack && track.path) {
                          editCancelRef.current = false; setEditValue(track.title); setEditingTitle(true);
                        } else if (!e.shiftKey) {
                          setLibScrollTargetId(track.id); setLibScrollTrigger(v => v + 1);
                        }
                      }}
                      style={{fontSize:'clamp(18px, 2.6vw, 28px)', fontWeight:600, letterSpacing:'-0.022em'}}
                      className="track-title-letterpress"
                      maxWidth={'min(clamp(280px, 38vw, 520px), 88%)'}
                    />
                  </div>
                )}
              </div>
            </div>{/* playerInfoRef end */}
              {/* album art with ambient glow */}
              <div style={{
                width:'min(100%, clamp(320px, 54vw, 760px), clamp(240px, 58vh, 760px))',
                marginBottom:24,
                position:'relative',
              }}>
                {uiShow.playerGlow !== false && <div className="aoi-corner-leak" aria-hidden/>}
                {track.title && <div className="aoi-cover-shadow-type" aria-hidden>{track.title}</div>}
                {/* ambient glow blob — uses app accent (cover-derived or preset) */}
                <AmbientGlow
                  accent={appAccent}
                  isPlaying={isPlaying}
                  visible={uiShow.playerGlow !== false && !((hero && !heroExiting) || reverseHero)}
                  audioRef={audioRef}
                  eqAnalyserRef={eqAnalyserRef}
                />
                <div id="player-album-art" ref={playerArtRef}
                  style={{opacity: ((hero && !heroExiting) || reverseHero) ? 0 : 1, position:'relative', zIndex:1, overflow:'visible'}}>
                  <div ref={artEntranceRef} style={{ position:'relative', overflow:'visible' }}>
                    {uiShow.playerProgress !== false && (
                      <CoverProgressRing progressRef={progressRef} isPlaying={isPlaying} visible={playerVisible}/>
                    )}
                    <AlbumArt track={track} isPlaying={isPlaying} sleepy={sleepyEdge} someoneElse={someoneElse} iris={irisPulse}/>
                  </div>
                </div>
              </div>
            </div>
            <div style={{
              width:'min(100%, clamp(260px, 34vw, 520px))', margin:'0 auto 0',
              opacity: playerVisible ? 1 : 0,
              transform: playerVisible ? 'translateY(0)' : 'translateY(10px)',
              transition: playerVisible ? 'opacity 0.36s ease 0.28s, transform 0.48s cubic-bezier(0.22,1,0.36,1) 0.28s' : 'opacity 0.1s ease, transform 0.1s ease',
            }}>
              {uiShow.playerProgress !== false && (
              <ProgressBar progressRef={progressRef} total={track.duration || 0}
                onSeek={handleSeek} isPlaying={isPlaying} visible={playerVisible}
                accentRGB={appAccent} rate={roomPlay?.rate ?? settings.playbackRate}/>
              )}
            {(()=>{ const P = { spring:0.055, damping:0.84, clamp:10 }; return (
            <div style={{display:'flex', alignItems:'center', gap:14, justifyContent:'center', marginTop:16}}>
              {scPlayingTrack && <div style={{width:27, marginRight:14, flexShrink:0}}/>}
              {uiShow.playerShuffle !== false && (
              <MagBtn className={shuffle ? 'aoi-shuffle-on' : 'aoi-shuffle-off'} onClick={()=>setShuffle(s=>!s)} active={shuffle} size={'clamp(40px, 5.2vw, 58px)'} physics={P}>
                <img src="./assets/shuffle.png" style={{width:'clamp(18px, 2.2vw, 26px)',height:'clamp(18px, 2.2vw, 26px)',filter:'brightness(0) invert(1)',opacity:shuffle?1:0.38,transition:'opacity 0.2s ease'}}/>
              </MagBtn>
              )}
              <MagBtn onClick={handlePrev} size={'clamp(46px, 6vw, 66px)'} physics={P}>
                <img src="./assets/rewind.png" style={{width:'clamp(18px, 2.2vw, 26px)',height:'clamp(18px, 2.2vw, 26px)',filter:'brightness(0) invert(1)',opacity:0.38}}/>
              </MagBtn>
              <PlayBtn isPlaying={isPlaying} onToggle={()=>{
                if (roomRef.current.role === 'guest') { showToast(t('room_host_controls')); return; }
                setIsPlaying(p=>!p);
              }} physics={P}/>
              <div className={'aoi-needle-wrap' + (needleHold ? ' is-hold' : '')}>
                <div className="aoi-needle-hair" aria-hidden/>
                <MagBtn onClick={() => handleNext('user')} onHoldStart={() => { setNeedleHold(true); startNeedle(); }} onHoldEnd={() => { setNeedleHold(false); stopNeedle(); }} title={t('needle_fwd')} size={'clamp(46px, 6vw, 66px)'} physics={P}>
                  <img src="./assets/forward.png" style={{width:'clamp(18px, 2.2vw, 26px)',height:'clamp(18px, 2.2vw, 26px)',filter:'brightness(0) invert(1)',opacity:0.38}}/>
                </MagBtn>
              </div>
              {uiShow.playerRepeat !== false && (
              <MagBtn onClick={()=>setRepeat(r=>r==='off'?'all':r==='all'?'one':'off')} active={repeat!=='off'} size={'clamp(40px, 5.2vw, 58px)'} physics={P}>
                <div style={{position:'relative',width:'clamp(18px, 2.2vw, 26px)',height:'clamp(18px, 2.2vw, 26px)'}}>
                  <img className="aoi-repeat-ico" src="./assets/repeat.png"  style={{position:'absolute',top:0,left:0,width:'100%',height:'100%',filter:'brightness(0) invert(1)',opacity:repeat==='off'?0.38:repeat==='all'?1:0,transition:'opacity 0.2s ease'}}/>
                  <img className="aoi-repeat-ico" src="./assets/repeat1.png" style={{position:'absolute',top:0,left:0,width:'100%',height:'100%',filter:'brightness(0) invert(1)',opacity:repeat==='one'?1:0,transition:'opacity 0.2s ease'}}/>
                </div>
              </MagBtn>
              )}
              {scPlayingTrack && (() => {
                const liked = likedIds.has(scPlayingTrack.id);
                return <PlayerLikeBtn liked={liked} onLike={() => handleLike(scPlayingTrack)} style={{marginLeft:14}}/>;
              })()}
            </div>
            ); })()}
            </div>{/* controls+progress wrapper end */}
          </div>
        </div>

        {/* volume panel */}
        {(uiShow.playerVolume !== false || uiShow.playerEq !== false) && (
        <div style={{
          width:28, flexShrink:0, height:'100%',
          display:'flex', flexDirection:'column', alignItems:'center',
          paddingTop:90, paddingBottom:18, paddingRight:5,
          position:'relative', overflow:'visible',
          zIndex: eqOpen ? 100 : 12,
          opacity: playerVisible ? 1 : 0,
          transform: playerVisible ? 'translateX(0)' : 'translateX(8px)',
          transition: playerVisible ? 'opacity 0.36s ease 0.44s, transform 0.48s cubic-bezier(0.22,1,0.36,1) 0.44s' : 'opacity 0.1s ease, transform 0.1s ease',
        }}>
          {uiShow.playerVolume !== false && (
          <ThinVolumeSlider volume={volume} onChange={handleVolumeChange} onLiveChange={handleVolumeLive} accentKey={`${appAccent.r},${appAccent.g},${appAccent.b}`}/>
          )}
          {uiShow.playerEq !== false && (
          <div data-eq-btn onClick={() => { ensureEqChain(); resumeEqCtx(eqCtxRef); setEqOpen(o => !o); }} title={t('eq')}
            style={{
              width:28, height:28, flexShrink:0, marginTop:6,
              display:'flex', alignItems:'center', justifyContent:'center',
              cursor:'pointer', userSelect:'none',
              color: eqOpen ? 'var(--accent)' : 'rgba(255,255,255,0.28)', transition:'color 0.2s ease',
            }}
            onMouseEnter={e => { if (!eqOpen) e.currentTarget.style.color='rgba(255,255,255,0.62)'; }}
            onMouseLeave={e => { e.currentTarget.style.color = eqOpen ? '' : 'rgba(255,255,255,0.28)'; }}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
              <rect x="4" y="12" width="3" height="8" rx="1"/>
              <rect x="10.5" y="6" width="3" height="14" rx="1"/>
              <rect x="17" y="9" width="3" height="11" rx="1"/>
            </svg>
          </div>
          )}
          {uiShow.playerEq !== false && eqOpen && (
            <EqPopover
              gains={settings.eqGains || EQ_ZERO}
              eqId={settings.eqId || eqIdOf(settings.eqGains, settings.eqCustom)}
              custom={settings.eqCustom || []}
              onGains={(g) => { applyEqGains(g); setSettings(s => ({ ...s, eqGains: g, eqId: eqIdOf(g, s.eqCustom) })); }}
              onPreset={(id, g) => { applyEqGains(g); setSettings(s => ({ ...s, eqGains: g, eqId: id })); }}
              onSave={(name, g) => {
                applyEqGains(g);
                setSettings(s => {
                  const rest = (s.eqCustom || []).filter(c => c.name !== name);
                  return { ...s, eqCustom: [{ name, gains: g }, ...rest].slice(0, 8), eqId: 'u:' + name, eqGains: g };
                });
                showToast(t('eq_saved'));
              }}
              onDelete={(name) => {
                setSettings(s => {
                  const eqCustom = (s.eqCustom || []).filter(c => c.name !== name);
                  const nextId = s.eqId === 'u:' + name ? 'flat' : s.eqId;
                  const nextG = nextId === 'flat' ? EQ_ZERO : s.eqGains;
                  if (nextId === 'flat') applyEqGains(EQ_ZERO);
                  return { ...s, eqCustom, eqId: nextId, eqGains: nextG };
                });
              }}
              onClose={() => setEqOpen(false)}
              playbackRate={settings.playbackRate || 1}
              preservesPitch={settings.preservesPitch !== false}
              onPlaybackRate={(r, preserve) => {
                const rate = clampPlaybackRate(r);
                const keep = preserve == null
                  ? (settingsRef.current?.preservesPitch !== false)
                  : !!preserve;
                setSettings(s => ({ ...s, playbackRate: rate, preservesPitch: keep }));
                applyPlaybackToEls(audioPoolRef.current, audioRef.current, rate, keep);
              }}
            />
          )}
          <div onClick={goMini} title={t('mini_player')}
            style={{
              width:28, height:28, flexShrink:0, marginTop:6,
              display:'flex', alignItems:'center', justifyContent:'center',
              cursor:'pointer', userSelect:'none',
              color:'rgba(255,255,255,0.28)', transition:'color 0.2s ease',
            }}
            onMouseEnter={e => { e.currentTarget.style.color='rgba(255,255,255,0.62)'; }}
            onMouseLeave={e => { e.currentTarget.style.color='rgba(255,255,255,0.28)'; }}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round">
              <rect x="3" y="6" width="18" height="12" rx="2"/>
              <line x1="8" y1="10" x2="8" y2="14"/><line x1="12" y1="9" x2="12" y2="15"/><line x1="16" y1="11" x2="16" y2="13"/>
            </svg>
          </div>
          <div onClick={toggleSleep} title={sleepOn ? `${t('sleep_off')} · ${sleepRemain} мин` : t('sleep_on')}
            style={{
              width:28, height:36, flexShrink:0, marginTop:8,
              display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:1,
              cursor:'pointer', userSelect:'none',
              color: sleepOn ? 'var(--accent)' : 'rgba(255,255,255,0.32)',
              transition:'color 0.2s ease',
            }}>
            <svg className={sleepOn ? 'aoi-moon-wane' : undefined} width="15" height="15" viewBox="0 0 24 24" fill="currentColor"
              style={sleepOn ? { clipPath: 'inset(0 ' + Math.round((1 - Math.max(0, Math.min(1, sleepRemain / 100))) * 100) + '% 0 0)' } : undefined}>
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
            {sleepOn && <span key={sleepRemain} className="aoi-sleep-digit" style={{fontSize:8, letterSpacing:'0.04em', fontVariantNumeric:'tabular-nums', opacity:0.85}}>{sleepRemain}</span>}
          </div>
        </div>
        )}
          </div>
        )}

        <SettingsView settings={settings} onSettings={setSettings} visible={view==='settings'} onScanTracks={handleScanTracks} onClearFolder={handleClearFolder} onClearCoversCache={handleClearCoversCache} onClearLikesCache={handleClearLikesCache} appAccent={appAccent} onOpenMini={goMini} appVersion={appVersion} onToast={showToast}/>
        <SoundCloudView
          visible={view==='soundcloud'}
          scAuth={settings.soundcloudAuth||null}
          onLogin={handleScLogin}
          onLogout={handleScLogout}
          scAccounts={settings.scAccounts || []}
          onAddAccount={handleScAddAccount}
          onSwitchAccount={handleScSwitchAccount}
          avatarRef={scAvatarRef}
          presenceConnected={presenceConnected && settings.presenceEnabled !== false}
          presenceCount={(presencePeers || []).filter(p => !isPresenceBlocked(p, settings.blockedPresence || [])).length}
          presenceProfile={roomProfile}
          onOpenOnline={openOnlinePanel}
          onOpenOnlineCount={openOnlinePanel}
          notifUnread={(settings.notifications || []).filter(n => !n.read).length}
          onOpenNotifs={openNotifPanel}
        />
        <SearchView ref={searchViewRef} visible={view==='search'} scAuth={settings.soundcloudAuth||null}
          likedIds={likedIds} onLike={handleLike}
          activeId={scPlayingTrack?.id || null}
          onPlayTrack={(tr, queue) => playSearchItem(tr, queue)}
          onSelectTrack={(tr, queue) => playSearchItem(tr, queue)}
          onResultsLoaded={handleSearchResultsLoaded}
          onArtistClick={handleOpenArtist}
          loadingTrackId={loadingTrackId} errorTrackId={errorTrackId}
          hideDividers={settings.hideDividers}
          onContextMenu={(tr, x, y) => setTrackMenu({ track: tr, x, y })}/>
        <PlaylistView
          visible={view==='playlists'}
          playlists={settings.playlists || []}
          scPlaylists={settings.scPlaylists || []}
          scAuth={settings.soundcloudAuth || null}
          openId={openPlaylistId}
          onOpen={setOpenPlaylistId}
          onBack={() => setOpenPlaylistId(null)}
          onCreate={handleCreatePlaylist}
          onRename={handleRenamePlaylist}
          onDelete={handleDeletePlaylist}
          onRemoveItem={handleRemovePlaylistItem}
          onPlayScPlaylist={handlePlayScPlaylist}
          onSaveScPlaylists={(list) => setSettings(s => ({ ...s, scPlaylists: list }))}
          onPlayTrack={(tr, items, title) => {
            applyQueueSession('playlist', items, title || '');
            setPlaybackDock(null);
            enterPlayer();
            if (tr?.id) {
              setLibScrollTargetId(tr.id);
              setLibScrollTrigger(v => v + 1);
            }
            playPlaylistItem(tr);
          }}
          activeId={scPlayingTrack?.id || track?.id}
          loadingTrackId={loadingTrackId}
          errorTrackId={errorTrackId}
          hideDividers={settings.hideDividers}
          likedIds={likedIds}
          onLike={handleLike}
          onContextMenu={(tr, x, y) => setTrackMenu({ track: tr, x, y })}
          accentRGB={appAccent}
          sharedCrates={sharedCrates}
          openShared={openSharedFriend}
          onSharedConsumed={() => setOpenSharedFriend(null)}
          onAddCurrentToShared={handleAddToSharedFriend}
          onRemoveSharedItem={handleRemoveSharedFriendItem}
          onClearShared={handleClearSharedFriend}/>
        <RoomsView
          visible={view==='rooms'}
          room={room}
          joinCode={roomJoinCode}
          onJoinCode={setRoomJoinCode}
          onCreate={handleCreateRoom}
          onJoin={handleJoinRoom}
          onLeave={handleLeaveRoom}
          onCopy={handleCopyRoomCode}
          selfName={roomName}
          selfAvatar={roomProfile.avatar}
          selfId={room.you}
          selfUid={roomProfile.uid}
          draftLocks={roomDraftLocks}
          onToggleDraftLock={handleToggleDraftLock}
          onToggleLock={handleToggleRoomLock}
          onKick={handleKickMember}
          onBan={handleBanMember}
          onTransfer={handleTransferHost}
          onPlaySuggestion={handlePlaySuggestion}
          busy={roomBusy}
          volume={volume}
          onVolume={handleVolumeChange}
          onVolumeLive={handleVolumeLive}
          accentKey={`${appAccent.r},${appAccent.g},${appAccent.b}`}/>
        <ArtistView artist={artistView} visible={view==='artist'} onClose={handleCloseArtist} scAuth={settings.soundcloudAuth||null} artistCacheRef={artistCacheRef}
          hideDividers={settings.hideDividers}
          likedIds={likedIds} onLike={handleLike}
          onPlayTrack={tr => { clearQueueSession(); stationQueueRef.current = null; handleScTrackClick(tr, -1); }}
          onSelectTrack={tr => { clearQueueSession(); stationQueueRef.current = null; handleScTrackClick(tr, -1); setPlayerVisible(true); setView('player'); setNavActive('library'); }}
          loadingTrackId={loadingTrackId} errorTrackId={errorTrackId}
          onFollow={handleFollow} onCheckFollow={checkFollow}
          onContextMenu={(tr, x, y) => setTrackMenu({ track: tr, x, y })}/>

        {updateInstalling && (
          <div style={{
            position:'fixed', inset:0, zIndex:10050,
            background:'rgba(6,6,10,0.92)',
            display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center',
            pointerEvents:'auto',
          }}>
            <div className="aoi-mark-row" aria-hidden>
              <div className="aoi-mark-bar" style={{ width:4, height:12, borderRadius:2, background:'rgba(255,255,255,0.55)', animationDelay:'0ms' }}/>
              <div className="aoi-mark-bar" style={{ width:4, height:20, borderRadius:2, background:'rgba(255,255,255,0.7)', animationDelay:'140ms' }}/>
              <div className="aoi-mark-bar" style={{ width:4, height:16, borderRadius:2, background:'rgba(255,255,255,0.45)', animationDelay:'280ms' }}/>
            </div>
            <div style={{ fontSize:14, fontWeight:600, color:'rgba(255,255,255,0.88)' }}>{t('update_auto')}</div>
            <div style={{ fontSize:12, color:'rgba(255,255,255,0.38)', marginTop:6 }}>{t('update_auto_sub')}</div>
          </div>
        )}

        <AnimatePresence>
          {toast && !toastExiting && (
            <motion.div
              key="toast"
              initial={{ opacity: 0, y: 6, scale: 0.98 }}
              animate={{ opacity: 1, y: 0, scale: 1 }}
              exit={{ opacity: 0, y: 5, scale: 0.98 }}
              transition={{ duration: 0.16, ease: 'easeOut' }}
              className="aoi-toast"
              style={{
                position:'absolute', bottom:28, left:'50%',
                translate:'-50% 0',
                background:'rgba(30,30,36,0.97)',
                border:'1px solid rgba(255,255,255,0.05)',
                borderRadius:8, padding:'7px 13px', fontSize:12,
                color:'rgba(255,255,255,0.52)', pointerEvents:'none',
                zIndex:9999, whiteSpace:'nowrap',
              }}>{toast}</motion.div>
          )}
        </AnimatePresence>

        <AnimatePresence>
          {trackMenu && (
            <TrackContextMenu key="ctxmenu" menu={trackMenu}
              onClose={() => setTrackMenu(null)}
              onCopyLink={handleCopyTrackLink}
              onStartStation={handleStartStation}
              playlists={settings.playlists || []}
              onAddToPlaylist={handleAddToPlaylist}
              canSuggest={room.role === 'guest'}
              onSuggest={handleSuggestTrack}/>
          )}
        </AnimatePresence>

        <OnlinePanel
          open={onlinePanelOpen}
          onClose={() => setOnlinePanelOpen(false)}
          peers={presencePeers}
          selfToken={presenceTokenRef.current}
          blocked={settings.blockedPresence || []}
          friends={settings.friends || []}
          sharedCrates={sharedCrates}
          onOpenSharedCrate={(peer) => {
            setOpenSharedCrate(null);
            setOpenSharedFriend({
              friendUid: peer.friendUid,
              friendName: peer.friendName,
              nonce: Date.now(),
            });
            setTimeout(() => setOnlinePanelOpen(false), 0);
            handleNav('playlists');
          }}
          onUnblock={handlePresenceUnblock}
          presenceEnabled={settings.presenceEnabled !== false}
          onToggleVisible={v => setSettings(s => ({ ...s, presenceEnabled: !!v }))}
          onUserMenu={(peer, x, y) => setPresenceUserMenu({ peer, x, y })}
        />
        <SharedCrateView
          open={openSharedCrate}
          items={sharedCrateItems}
          myUid={settings.soundcloudAuth?.userId || ''}
          onBack={() => setOpenSharedCrate(null)}
          onPlayTrack={(tr, queue) => playCrateItem(tr, queue)}
          onRemoveItem={handleRemoveFromSharedCrate}
          onClear={handleClearSharedCrate}
          onAddCurrent={handleAddToOpenSharedCrate}
          activeId={playbackDock === 'crate' ? (scPlayingTrack?.id || track?.id) : null}
          dockTrack={playbackDock === 'crate' ? (scPlayingTrack || track) : null}
          dockPlaying={isPlaying}
          progressRef={progressRef}
          onDockToggle={() => setIsPlaying(v => !v)}
          onDockPrev={handlePrev}
          onDockNext={handleNext}
          onDockOpen={openFullPlayer}
          onDockSeek={handleSeek}
          loadingTrackId={loadingTrackId}
          errorTrackId={errorTrackId}
          hideDividers={settings.hideDividers}
          likedIds={likedIds}
          onLike={handleLike}
          onContextMenu={(tr, x, y) => setTrackMenu({ track: tr, x, y })}
        />
        <NotificationsPanel
          open={notifPanelOpen}
          onClose={() => setNotifPanelOpen(false)}
          items={settings.notifications || []}
          updating={updateInstalling}
          onClear={() => setSettings(s => ({ ...s, notifications: [] }))}
          onUpdate={handleInstallUpdate}
          onJoinInvite={handleJoinInviteNotif}
        />
        {presenceUserMenu && (
          <PresenceUserMenu
            menu={presenceUserMenu}
            onClose={() => setPresenceUserMenu(null)}
            onOpenProfile={handlePresenceOpenProfile}
            onInvite={handlePresenceInvite}
            onBlock={handlePresenceBlock}
            onUnblock={handlePresenceUnblock}
            onToggleFriend={handlePresenceToggleFriend}
            isFriend={window.AoiNight?.isFriend?.(settings.friends || [], presenceUserMenu.peer)}
            isBlocked={isPresenceBlocked(presenceUserMenu.peer, settings.blockedPresence || [])}
          />
        )}

      </div>
      </div>
      {navDock === 'right' && sidebarEl}
    </div>
    </LangContext.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  location.hash === '#mini' ? <MiniPlayer/> : <App/>
);
if (location.hash === '#mini') {
  document.documentElement.classList.add('mini-mode');
  document.body.classList.add('mini-mode');
